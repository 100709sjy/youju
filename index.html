<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현욱이게임</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#07070f;--panel:#12122a;--c1:#00e5ff;--c2:#ff2d6f;--ok:#2dff9a;--tx:#e8eaff;--mu:#8b8fb8;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:inherit}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 30%,#1a1040,var(--bg) 70%);color:var(--tx);font-family:"Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;width:min(100vw,calc(100vh*1.5));height:min(100vh,calc(100vw/1.5));max-width:900px;max-height:600px;box-shadow:0 0 40px #00e5ff33;border-radius:10px;overflow:hidden}
#wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;border-radius:10px}
#game{pointer-events:none;z-index:2}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#05050cee;border-radius:10px;padding:16px;z-index:10;overflow-y:auto}
.hide{display:none!important}
h1{font-size:clamp(26px,5.5vw,52px);letter-spacing:3px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.sub{color:var(--mu);margin:4px 0 14px;font-size:clamp(12px,1.7vw,15px)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:5px 0}
button{padding:9px 16px;font-size:clamp(13px,1.9vw,16px);font-weight:700;border:2px solid var(--c1);border-radius:10px;background:#0a0a1e;color:var(--c1);cursor:pointer;transition:.15s}
button:hover{background:var(--c1);color:#000;box-shadow:0 0 18px var(--c1)}
button.g{border-color:var(--ok);color:var(--ok)}button.g:hover{background:var(--ok);color:#000;box-shadow:0 0 18px var(--ok)}
button.r{border-color:var(--c2);color:var(--c2)}button.r:hover{background:var(--c2);color:#000;box-shadow:0 0 18px var(--c2)}
button.gray{border-color:#555;color:#aaa}button.gray:hover{background:#333;color:#fff}
input{padding:9px 12px;font-size:15px;width:150px;text-align:center;border-radius:10px;border:2px solid #2a2a5a;background:var(--panel);color:var(--tx)}
#status{min-height:22px;margin-top:8px;color:var(--ok);font-size:clamp(12px,1.8vw,15px)}
.keys{color:var(--mu);font-size:clamp(11px,1.5vw,13px);margin-top:10px;line-height:1.6}
.keys b{color:var(--c1)}
#endT{font-size:clamp(26px,5.5vw,48px);font-weight:900;margin-bottom:12px}
.user-bar{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:20;font-size:13px;color:var(--mu)}
.user-bar b{color:var(--c1)}
.auth-box{background:var(--panel);padding:18px 20px;border-radius:12px;border:1px solid #2a2a5a;margin:8px 0;width:min(300px,90%)}
.auth-box input{width:100%;margin:6px 0;box-sizing:border-box}
.auth-box button{width:100%;margin-top:8px}
.lb-list{width:min(320px,92%);max-height:280px;overflow-y:auto;text-align:left;margin:10px 0}
.lb-item{display:flex;justify-content:space-between;padding:8px 12px;background:#0e0e22;border-radius:8px;margin:4px 0;font-size:14px}
.lb-item .rank{color:var(--c1);font-weight:700;width:28px}
.lb-item .name{flex:1;color:var(--tx)}
.lb-item .wins{color:var(--ok);font-weight:700}
.msg{color:var(--c2);font-size:13px;margin-top:6px;min-height:18px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>

  <!-- 상단 유저 표시 -->
  <div class="user-bar" id="userBar">
    <span id="userLabel">게스트</span>
    <span>
      <button class="gray" style="padding:4px 10px;font-size:12px" onclick="showLeaderboard()">리더보드</button>
      <button class="gray" style="padding:4px 10px;font-size:12px;margin-left:4px" id="logoutBtn" onclick="logout()">로그아웃</button>
    </span>
  </div>

  <!-- 로그인 / 회원가입 -->
  <div id="auth" class="ov">
    <h1>현욱이게임</h1>
    <div class="sub">계정은 이 기기에만 저장됩니다</div>
    <div class="auth-box">
      <input id="authNick" maxlength="12" placeholder="닉네임 (2~12자)">
      <input id="authPw" type="password" maxlength="20" placeholder="비밀번호">
      <div class="msg" id="authMsg"></div>
      <button class="g" onclick="doLogin()">로그인</button>
      <button onclick="doSignup()">회원가입</button>
      <button class="gray" onclick="playAsGuest()">게스트로 플레이</button>
    </div>
  </div>

  <!-- 로비 -->
  <div id="lobby" class="ov hide">
    <h1>현욱이게임</h1>
    <div class="sub">1인칭 3D 슈팅 · AI 연습 또는 최대 4인 대결 · 3승 먼저</div>
    <div class="row">
      <button class="g" onclick="startAI('easy')">AI 쉬움</button>
      <button class="g" onclick="startAI('normal')">AI 보통</button>
      <button class="r" onclick="startAI('hard')">AI 지옥</button>
    </div>
    <div class="row"><button onclick="createRoom()">방 만들기</button></div>
    <div class="row">
      <input id="roomInput" maxlength="5" placeholder="방 코드">
      <button onclick="joinRoom()">입장</button>
    </div>
    <div class="row"><button id="startBtn" class="g hide" onclick="hostStart()">게임 시작</button></div>
    <div id="status"></div>
    <div class="keys"><b>WASD</b> 이동 · <b>← →</b> 시점 · <b>Space/J</b> 발사 · <b>Shift/L</b> 대시<br>💖 회복 · ⭐ 트리플샷 · 총알은 벽에 한 번 튕김</div>
  </div>

  <!-- 리더보드 -->
  <div id="leaderboard" class="ov hide">
    <h1>리더보드</h1>
    <div class="sub">이 기기에 저장된 승리 기록</div>
    <div class="lb-list" id="lbList"></div>
    <div class="row"><button onclick="hideLeaderboard()">닫기</button></div>
  </div>

  <!-- 결과 -->
  <div id="end" class="ov hide">
    <div id="endT"></div>
    <div class="row">
      <button class="g" onclick="rematch()">다시하기</button>
      <button onclick="toLobby()">로비로</button>
    </div>
  </div>
</div>

<script>
/* ========== 계정 / 리더보드 (localStorage) ========== */
const LS_USERS = "hyeonuk_users";
const LS_CURRENT = "hyeonuk_current";
const LS_SCORES = "hyeonuk_scores";

function loadUsers(){ try{ return JSON.parse(localStorage.getItem(LS_USERS)||"{}"); }catch(e){ return {}; } }
function saveUsers(u){ localStorage.setItem(LS_USERS, JSON.stringify(u)); }
function loadScores(){ try{ return JSON.parse(localStorage.getItem(LS_SCORES)||"{}"); }catch(e){ return {}; } }
function saveScores(s){ localStorage.setItem(LS_SCORES, JSON.stringify(s)); }

function simpleHash(str){
  let h=0; for(let i=0;i<str.length;i++){ h=((h<<5)-h)+str.charCodeAt(i); h|=0; }
  return "h"+Math.abs(h).toString(16);
}

let currentUser = null; // {nick, isGuest}

function updateUserBar(){
  const label = $("userLabel");
  const logoutBtn = $("logoutBtn");
  if(currentUser){
    label.innerHTML = currentUser.isGuest ? "게스트" : "<b>"+currentUser.nick+"</b> 님";
    logoutBtn.style.display = currentUser.isGuest ? "none" : "inline-block";
  } else {
    label.textContent = "게스트";
    logoutBtn.style.display = "none";
  }
}

function doSignup(){
  const nick = $("authNick").value.trim();
  const pw = $("authPw").value;
  const msg = $("authMsg");
  if(nick.length<2||nick.length>12){ msg.textContent="닉네임은 2~12자로 해주세요"; return; }
  if(pw.length<2){ msg.textContent="비밀번호는 2자 이상"; return; }
  const users = loadUsers();
  if(users[nick]){ msg.textContent="이미 존재하는 닉네임입니다"; return; }
  users[nick] = simpleHash(pw);
  saveUsers(users);
  // 점수 초기화
  const scores = loadScores();
  if(!scores[nick]) scores[nick]=0;
  saveScores(scores);
  currentUser = {nick, isGuest:false};
  localStorage.setItem(LS_CURRENT, JSON.stringify(currentUser));
  msg.textContent="";
  enterLobby();
}

function doLogin(){
  const nick = $("authNick").value.trim();
  const pw = $("authPw").value;
  const msg = $("authMsg");
  const users = loadUsers();
  if(!users[nick] || users[nick] !== simpleHash(pw)){
    msg.textContent="닉네임 또는 비밀번호가 틀렸습니다";
    return;
  }
  currentUser = {nick, isGuest:false};
  localStorage.setItem(LS_CURRENT, JSON.stringify(currentUser));
  msg.textContent="";
  enterLobby();
}

function playAsGuest(){
  currentUser = {nick:"게스트", isGuest:true};
  localStorage.removeItem(LS_CURRENT);
  enterLobby();
}

function logout(){
  currentUser = null;
  localStorage.removeItem(LS_CURRENT);
  $("auth").classList.remove("hide");
  $("lobby").classList.add("hide");
  $("leaderboard").classList.add("hide");
  $("end").classList.add("hide");
  updateUserBar();
  $("authNick").value=""; $("authPw").value=""; $("authMsg").textContent="";
}

function enterLobby(){
  $("auth").classList.add("hide");
  $("lobby").classList.remove("hide");
  $("leaderboard").classList.add("hide");
  updateUserBar();
}

function addWin(){
  if(!currentUser || currentUser.isGuest) return;
  const scores = loadScores();
  scores[currentUser.nick] = (scores[currentUser.nick]||0) + 1;
  saveScores(scores);
}

function showLeaderboard(){
  const scores = loadScores();
  const list = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const box = $("lbList");
  if(list.length===0){
    box.innerHTML = "<div style='text-align:center;color:#888;padding:20px'>아직 기록이 없습니다</div>";
  } else {
    box.innerHTML = list.map(([name,wins],i)=>`
      <div class="lb-item">
        <span class="rank">${i+1}</span>
        <span class="name">${name}</span>
        <span class="wins">${wins}승</span>
      </div>`).join("");
  }
  $("lobby").classList.add("hide");
  $("auth").classList.add("hide");
  $("leaderboard").classList.remove("hide");
}

function hideLeaderboard(){
  $("leaderboard").classList.add("hide");
  if(currentUser) $("lobby").classList.remove("hide");
  else $("auth").classList.remove("hide");
}

// 페이지 로드 시 자동 로그인
(function(){
  try{
    const saved = localStorage.getItem(LS_CURRENT);
    if(saved){
      currentUser = JSON.parse(saved);
      enterLobby();
    }
  }catch(e){}
  updateUserBar();
})();

let peer=null,conn=null,conns=[],isHost=false,isAI=false,D=DIFF.normal,myId=0,nextId=1,roomCode="";
let state="lobby",timer=0,banner="",shake=0,t=0,sendT=0;
let P=[],me=null,en=null,bullets=[],parts=[],pickups=[],wins={};
let keys={};
const byId=i=>P.find(p=>p.id===i);

let AC=null;
function beep(f,d,type,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.value=f;g.gain.value=v||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

function say(s){$("status").textContent=s}
function openCount(){return conns.filter(c=>c.open).length}
function lobbyMsg(){say("방 코드: "+roomCode+" · 접속 "+(openCount()+1)+"/"+MAXP+"명");$("startBtn").classList.toggle("hide",openCount()<1)}
function toLobby(){
  conns.forEach(c=>{try{c.close()}catch(e){}});
  if(conn){try{conn.close()}catch(e){}}if(peer){try{peer.destroy()}catch(e){}}
  conn=null;peer=null;conns=[];nextId=1;isHost=false;state="lobby";me=null;
  $("end").classList.add("hide");$("lobby").classList.remove("hide");$("startBtn").classList.add("hide");say("");
}
function startAI(d){isAI=true;D=DIFF[d];myId=0;begin(2)}
function createRoom(){
  if(typeof Peer==="undefined"){say("PeerJS 로드 실패");return}
  roomCode=Math.random().toString(36).slice(2,7).toUpperCase();
  peer=new Peer("hyeonuk-"+roomCode);isHost=true;isAI=false;myId=0;conns=[];nextId=1;say("방 생성 중...");
  const tm=setTimeout(()=>{if(!peer||!peer.open)say("방 서버 연결 실패. 다른 브라우저를 시도해보세요.")},8000);
  peer.on("open",()=>{clearTimeout(tm);lobbyMsg()});
  peer.on("connection",c=>{
    if(conns.length>=MAXP-1||state!=="lobby"){c.on("open",()=>c.close());return}
    c.pid=nextId++;conns.push(c);
    c.on("open",()=>{c.send({t:"id",i:c.pid});lobbyMsg()});
    c.on("data",m=>{onData(m);conns.forEach(o=>{if(o!==c&&o.open)o.send(m)})});
    c.on("close",()=>onLeave(c));
  });
  peer.on("error",e=>{clearTimeout(tm);if(e.type==="unavailable-id"){toLobby();createRoom();return}say("오류: "+e.type)});
}
function joinRoom(){
  const code=$("roomInput").value.trim().toUpperCase();
  if(!code){say("방 코드를 입력하세요");return}
  if(typeof Peer==="undefined"){say("PeerJS 로드 실패");return}
  peer=new Peer();isHost=false;isAI=false;say("접속 중...");
  peer.on("open",()=>{
    conn=peer.connect("hyeonuk-"+code);
    conn.on("open",()=>say("접속 완료! 방장이 시작하길 기다리는 중..."));
    conn.on("data",onData);
    conn.on("close",()=>{if(state==="lobby")say("방장이 나갔습니다");else if(state!=="over"){state="over";showEnd("연결이 끊겼습니다",false)}});
  });
  peer.on("error",e=>say("오류: "+e.type+" (코드를 확인하세요)"));
}
function hostIds(){return[0,...conns.filter(c=>c.open).map(c=>c.pid)]}
function hostStart(){const ids=hostIds();if(ids.length<2)return;send({t:"go",ids});begin(ids)}
function onLeave(c){
  conns=conns.filter(o=>o!==c);
  if(state==="lobby"){lobbyMsg();return}
  const p=byId(c.pid);
  if(p&&p.alive){p.alive=false;send({t:"k",i:c.pid});checkEnd()}
}
function send(o){
  if(o.i===undefined)o.i=myId;
  if(isHost)conns.forEach(c=>{if(c.open)c.send(o)});
  else if(conn&&conn.open)conn.send(o);
}
function onData(m){
  if(m.t==="id")myId=m.i;
  else if(m.t==="go"){isAI=false;begin(m.ids)}
  else if(m.t==="s"){const p=byId(m.i);if(p){p.tx=m.x;p.ty=m.y;p.a=m.a;p.hp=m.hp;p.dash=m.d}}
  else if(m.t==="b"){bullets.push({x:m.x,y:m.y,vx:m.vx,vy:m.vy,o:m.i,life:1.3,bn:0});beep(300,.08,"sawtooth",.03)}
  else if(m.t==="k"){const p=byId(m.i);if(p&&p.alive){p.alive=false;boom(p.x,p.y,p.col);checkEnd()}}
  else if(m.t==="pk"){if(pickups[m.n])pickups[m.n].cd=pickups[m.n].k?14:10}
}

function mk(id,k,n){
  const s=(n===2?[[90,300],[W-90,300]]:[[90,90],[W-90,H-90],[W-90,90],[90,H-90]])[k];
  return{id,col:COL[k],sx:s[0],sy:s[1],x:s[0],y:s[1],tx:s[0],ty:s[1],hp:100,a:Math.atan2(300-s[1],450-s[0]),vx:0,vy:0,dash:0,dcd:0,cd:0,tri:0,st:0,dir:1,alive:true};
}
function resetRound(){
  P.forEach(p=>{p.x=p.tx=p.sx;p.y=p.ty=p.sy;p.hp=100;p.alive=true;p.tri=0;p.dash=0;p.cd=0;p.a=Math.atan2(300-p.sy,450-p.sx)});
  bullets=[];parts=[];
  pickups=[{x:W/2,y:50,cd:0,k:0},{x:W/2,y:H-50,cd:0,k:0},{x:300,y:300,cd:0,k:1},{x:600,y:300,cd:0,k:1}];
}
function begin(ids){resetVis();
  const n=typeof ids==="number"?ids:ids.length;
  P=[];for(let k=0;k<n;k++)P.push(mk(typeof ids==="number"?k:ids[k],k,n));
  me=P.find(p=>p.id===myId);en=P[1];
  wins={};P.forEach(p=>wins[p.id]=0);
  $("lobby").classList.add("hide");$("end").classList.add("hide");
  resetRound();state="round";timer=1.6;banner="READY";
}
function rematch(){
  if(isAI){begin(2);return}
  if(isHost){const ids=hostIds();if(ids.length<2)return;send({t:"go",ids});begin(ids)}
  else{$("endT").textContent="방장이 시작하길 기다리는 중...";$("endT").style.color="#fff"}
}
function checkEnd(){
  if(state!=="play")return;
  const al=P.filter(p=>p.alive);
  if(al.length>1)return;
  const w=al[0];if(w)wins[w.id]++;
  const top=P.find(p=>wins[p.id]>=WIN);
  if(top){
    state="over";
    const isMeWin = top===me;
    if(isMeWin) addWin();          // 리더보드에 승리 기록
    setTimeout(()=>showEnd(isMeWin?"VICTORY":"DEFEAT",isMeWin),900);
    return;
  }
  state="roundEnd";timer=2;banner=!w?"무승부":w===me?"승리!":isAI?"패배...":"P"+(P.indexOf(w)+1)+" 승리";
}
function showEnd(txt,win){
  $("endT").textContent=txt+"  "+P.map(p=>wins[p.id]||0).join(" : ");
  $("endT").style.color=win?"#2dff9a":"#ff2d6f";$("end").classList.remove("hide");
}

function collide(p){
  p.x=Math.max(R,Math.min(W-R,p.x));p.y=Math.max(R,Math.min(H-R,p.y));
  for(const[ox,oy,ow,oh] of OBS){
    const cx=Math.max(ox,Math.min(p.x,ox+ow)),cy=Math.max(oy,Math.min(p.y,oy+oh));
    const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);
    if(d<R){if(d===0){p.y=oy-R;continue}p.x=cx+dx/d*R;p.y=cy+dy/d*R}
  }
}
function inObs(x,y){return OBS.some(([a,b,w,h])=>x>a&&x<a+w&&y>b&&y<b+h)}
function move(p,mx,my,spd,dt){
  const l=Math.hypot(mx,my);if(l>0){mx/=l;my/=l}
  const s=p.dash>0?860:spd;
  p.vx=mx*s;p.vy=my*s;p.x+=p.vx*dt;p.y+=p.vy*dt;collide(p);
}
function fire(p){const n=p.tri>0?3:1;for(let i=0;i<n;i++){const a0=p.a;p.a+=(i-(n-1)/2)*.22;fire1(p);p.a=a0}}
function fire1(p){
  const aa=p.a+(p===me?(Math.random()-.5)*.16:0),c=Math.cos(aa),s=Math.sin(aa),sp=470;
  const b={x:p.x+c*24,y:p.y+s*24,vx:c*sp,vy:s*sp,o:p.id,life:1.3,bn:0};
  bullets.push(b);beep(p===me?640:300,.07,"square",.035);
  if(p===me)send({t:"b",x:b.x,y:b.y,vx:b.vx,vy:b.vy});
}
function boom(x,y,col){
  for(let i=0;i<36;i++){const a=Math.random()*6.283,s=60+Math.random()*320;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,m:1,c:col})}
  shake=Math.max(shake,12);beep(90,.35,"sawtooth",.07);
}
function spark(x,y,col){for(let i=0;i<6;i++){const a=Math.random()*6.283,s=40+Math.random()*160;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.25,m:.25,c:col})}}
function pop(x,y,c){parts.push({x,y,vx:0,vy:0,l:.7,m:.7,c,s:"-"+DMG})}

function aiUpdate(dt){
  const e=en,dx=me.x-e.x,dy=me.y-e.y,d=Math.hypot(dx,dy);
  const lead=d/470*D.lead,tx=me.x+me.vx*lead*.5,ty=me.y+me.vy*lead*.5;
  const ta=Math.atan2(ty-e.y,tx-e.x);
  let da=ta-e.a;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;
  e.a+=da*Math.min(1,dt*(6+D.spd/40));
  e.st-=dt;if(e.st<=0){e.st=.5+Math.random();e.dir=Math.random()<.5?1:-1}
  const ang=Math.atan2(dy,dx),want=d>340?1:d<210?-1:0;
  let mx=Math.cos(ang)*want-Math.sin(ang)*e.dir*.9,my=Math.sin(ang)*want+Math.cos(ang)*e.dir*.9,threat=false;
  for(const b of bullets){if(b.o===e.id)continue;
    const bx=e.x-b.x,by=e.y-b.y,dist=Math.hypot(bx,by);
    if(dist<170&&(bx*b.vx+by*b.vy)>0){const sg=(bx*b.vy-by*b.vx)>0?1:-1;mx+=-b.vy/470*sg*2.2;my+=b.vx/470*sg*2.2;threat=true}}
  if(threat&&e.dcd<=0&&Math.random()<D.dash*dt*6){e.dash=.14;e.dcd=1.4}
  move(e,mx,my,D.spd,dt);
  if(e.cd<=0&&d<620&&Math.abs(da)<.35&&hasLOS(e,me)){
    const o=e.a;e.a+=(Math.random()-.5)*2*D.err;fire(e);e.a=o;e.cd=D.cd*(.8+Math.random()*.5)}
}
function hasLOS(a,b){for(let i=1;i<12;i++){if(inObs(a.x+(b.x-a.x)*i/12,a.y+(b.y-a.y)*i/12))return false}return true}

function update(dt){
  t+=dt;shake*=.88;hitFl=Math.max(0,hitFl-dt);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  if(state==="round"||state==="roundEnd"){
    timer-=dt;if(timer<=0){
      if(state==="round"){state="play";banner="FIGHT!";timer=.8}
      else{resetRound();state="round";timer=1.4;banner="READY"}
    }
  }
  if(state==="play"&&banner&&(timer-=dt)<=0)banner="";
  if(state==="lobby"||!me)return;
  const live=state==="play";
  P.forEach(p=>{p.cd-=dt;p.dcd-=dt;p.dash-=dt;p.tri-=dt});
  if(live&&me.alive){
    me.a+=((keys.arrowright?1:0)-(keys.arrowleft?1:0))*2.6*dt;
    const fw=(keys.w?1:0)-(keys.s?1:0),sd=(keys.d?1:0)-(keys.a?1:0),ca=Math.cos(me.a),sa=Math.sin(me.a);
    const mx=ca*fw-sa*sd,my=sa*fw+ca*sd;
    if((keys.shift||keys.l)&&me.dcd<=0&&(mx||my)){me.dash=.13;me.dcd=1.2;beep(200,.12,"triangle",.05)}
    if(me.dash>0)move(me,mx||Math.cos(me.a),my||Math.sin(me.a),0,dt);else move(me,mx,my,235,dt);
    if((keys[" "]||keys.j)&&me.cd<=0){fire(me);me.cd=.34}
  }
  if(live&&isAI&&en.alive)aiUpdate(dt);
  if(!isAI)for(const p of P)if(p!==me){p.x+=(p.tx-p.x)*Math.min(1,dt*18);p.y+=(p.ty-p.y)*Math.min(1,dt*18)}
  pickups.forEach((p,i)=>{
    if(p.cd>0){p.cd-=dt;return}
    if(live&&me.alive&&(p.k||me.hp<100)&&Math.hypot(me.x-p.x,me.y-p.y)<R+14){
      if(p.k)me.tri=6;else me.hp=Math.min(100,me.hp+35);
      p.cd=p.k?14:10;send({t:"pk",n:i});beep(900,.15,"sine",.05);spark(p.x,p.y,"#ff6fa5")}
    else if(isAI&&live&&en.alive&&(p.k||en.hp<100)&&Math.hypot(en.x-p.x,en.y-p.y)<R+14){
      if(p.k)en.tri=6;else en.hp=Math.min(100,en.hp+35);p.cd=p.k?14:10}
  });
  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(inObs(b.x,b.y)){b.life=0;spark(b.x,b.y,"#fff");continue}
    if(b.x<0||b.x>W||b.y<0||b.y>H){
      if(!b.bn){b.bn=1;if(b.x<0||b.x>W){b.vx*=-1;b.x=b.x<0?0:W}else{b.vy*=-1;b.y=b.y<0?0:H}spark(b.x,b.y,"#fff")}
      else{b.life=0;spark(b.x,b.y,"#fff");continue}
    }
    if(!live)continue;
    for(const p of P){
      if(!p.alive||p.id===b.o)continue;
      if(Math.hypot(b.x-p.x,b.y-p.y)<R-2){
        b.life=0;spark(p.x,p.y,p.col);
        if(p===me){me.hp-=DMG;shake=Math.max(shake,7);beep(150,.1,"sawtooth",.06);pop(p.x,p.y,"#ff2d6f");hitFl=.35}
        else{if(isAI)p.hp-=DMG;pop(p.x,p.y,"#0a7cff")}
        break;
      }
    }
  }
  bullets=bullets.filter(b=>b.life>0);
  let died=false;
  if(live&&me.alive&&me.hp<=0){me.hp=0;me.alive=false;boom(me.x,me.y,me.col);send({t:"k"});died=true}
  if(live&&isAI&&en.alive&&en.hp<=0){en.hp=0;en.alive=false;boom(en.x,en.y,en.col);died=true}
  if(died)checkEnd();
  sendT-=dt;if(!isAI&&sendT<=0){sendT=.045;send({t:"s",x:me.x,y:me.y,a:me.a,hp:me.hp,d:me.dash})}
}

let hitFl=0,vis={},bm=[],pks=[];const bMat={};
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfe6ff);scene.fog=new THREE.Fog(0xffd6ea,450,1500);
const cam=new THREE.PerspectiveCamera(78,3/2,1,3000);scene.add(cam);
scene.add(new THREE.HemisphereLight(0xffffff,0xffc0dd,.95));
const dl=new THREE.DirectionalLight(0xffffff,.55);dl.position.set(300,500,100);scene.add(dl);
const ren=new THREE.WebGLRenderer({antialias:true,alpha:false});
ren.setPixelRatio(Math.min(2,devicePixelRatio||1));
ren.domElement.style.zIndex="1";
$("wrap").insertBefore(ren.domElement,cv);

function fit(){
  const r=$("wrap").getBoundingClientRect();
  if(r.width>0)ren.setSize(Math.round(r.width),Math.round(r.height),false);
}
addEventListener("resize",fit);fit();

function tex(draw,w,h){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);return new THREE.CanvasTexture(c)}
const ft=tex((g,w,h)=>{g.fillStyle="#ffe9f4";g.fillRect(0,0,w,h);g.fillStyle="#d8f1ff";g.fillRect(0,0,w/2,h/2);g.fillRect(w/2,h/2,w/2,h/2)},64,64);
ft.wrapS=ft.wrapT=THREE.RepeatWrapping;ft.repeat.set(W/60,H/60);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshLambertMaterial({map:ft}));
floor.rotation.x=-Math.PI/2;floor.position.set(W/2,0,H/2);scene.add(floor);
function box(x,y,w,h,ht,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,ht,h),new THREE.MeshLambertMaterial({color}));m.position.set(x+w/2,ht/2,y+h/2);scene.add(m)}
OBS.forEach(o=>box(o[0],o[1],o[2],o[3],70,0xff9fcb));
box(-20,-20,W+40,20,90,0xffb3d9);box(-20,H,W+40,20,90,0xffb3d9);box(-20,0,20,H,90,0xffb3d9);box(W,0,20,H,90,0xffb3d9);
const gun=new THREE.Mesh(new THREE.BoxGeometry(3,3,16),new THREE.MeshLambertMaterial({color:0xff6fa5}));
gun.position.set(6,-6,-14);cam.add(gun);
const bGeo=new THREE.SphereGeometry(3.5,8,8);
function ptex(col){return tex((g,w,h)=>{g.beginPath();g.arc(w/2,h/2,w/2-3,0,7);g.fillStyle="#fff";g.fill();
  g.save();g.beginPath();g.arc(w/2,h/2,w/2-9,0,7);g.clip();if(FACE.complete)g.drawImage(FACE,0,0,w,h);g.restore();
  g.lineWidth=9;g.strokeStyle=col;g.beginPath();g.arc(w/2,h/2,w/2-5,0,7);g.stroke()},128,128)}
function emoTex(e){return tex((g,w,h)=>{g.font="48px Arial";g.textAlign="center";g.textBaseline="middle";g.fillText(e,w/2,h/2+3)},64,64)}
function getVis(p){
  if(vis[p.id])return vis[p.id];
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:ptex(p.col),transparent:true}));spr.scale.set(44,44,1);
  const bg=new THREE.Sprite(new THREE.SpriteMaterial({color:0x222222,transparent:true}));bg.scale.set(42,6,1);bg.renderOrder=1;
  const fill=new THREE.Sprite(new THREE.SpriteMaterial({color:p.col,transparent:true}));fill.scale.set(40,4,1);fill.renderOrder=2;
  scene.add(spr,bg,fill);return vis[p.id]={spr,bg,fill};
}
function resetVis(){for(const k in vis){const v=vis[k];scene.remove(v.spr,v.bg,v.fill)}vis={}}
FACE.onload=resetVis;
const vv=new THREE.Vector3();
function proj(x,y,z){vv.set(x,y,z).project(cam);return(vv.z<1&&vv.z>-1)?[(vv.x+1)/2*W,(1-vv.y)/2*H]:null}

function render(){
  const g=ctx;g.clearRect(0,0,W,H);
  if(state==="lobby"||!me){
    cam.fov=78;cam.updateProjectionMatrix();
    cam.position.set(450+Math.cos(t*.25)*380,120,300+Math.sin(t*.25)*260);cam.lookAt(450,20,300);
    ren.render(scene,cam);return;
  }
  const sx=(Math.random()-.5)*shake*.5,sy=(Math.random()-.5)*shake*.5;
  cam.position.set(me.x+sx,24+sy,me.y);
  cam.lookAt(me.x+Math.cos(me.a)*100,24,me.y+Math.sin(me.a)*100);
  cam.fov=78+(me.dash>0?10:0);cam.updateProjectionMatrix();
  gun.position.z=-14+Math.max(0,me.cd-.2)*22;
  for(const p of P){
    const v=getVis(p),on=p.alive&&p!==me;
    v.spr.visible=v.bg.visible=v.fill.visible=on;
    if(!on)continue;
    v.spr.position.set(p.x,26,p.y);v.bg.position.set(p.x,54,p.y);v.fill.position.set(p.x,54,p.y);
    v.fill.scale.x=Math.max(.01,40*Math.max(0,p.hp)/100);
  }
  pickups.forEach((p,i)=>{
    if(!pks[i]){pks[i]=new THREE.Sprite(new THREE.SpriteMaterial({map:emoTex(p.k?"⭐":"💖"),transparent:true}));pks[i].scale.set(30,30,1);scene.add(pks[i])}
    pks[i].visible=p.cd<=0;pks[i].position.set(p.x,22+Math.sin(t*4+i)*4,p.y);
  });
  bullets.forEach((b,i)=>{
    const o=byId(b.o),c=o?o.col:"#fff";
    const m=bm[i]||(bm[i]=new THREE.Mesh(bGeo));scene.add(m);
    m.material=bMat[c]||(bMat[c]=new THREE.MeshBasicMaterial({color:c}));
    m.visible=true;m.position.set(b.x,22,b.y);
  });
  for(let i=bullets.length;i<bm.length;i++)bm[i].visible=false;
  ren.render(scene,cam);

  if(hitFl>0){g.fillStyle="rgba(255,45,111,"+Math.min(.5,hitFl*1.4)+")";g.fillRect(0,0,W,H)}
  for(const p of parts){
    const s=proj(p.x,p.s?34+(.7-p.l)*45:16,p.y);if(!s)continue;
    g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;
    if(p.s){g.font="bold 20px Arial";g.textAlign="center";g.fillText(p.s,s[0],s[1])}else g.fillRect(s[0]-2,s[1]-2,5,5);
  }
  g.globalAlpha=1;
  if(me.alive){g.strokeStyle="#fff";g.lineWidth=2;g.shadowColor="#000";g.shadowBlur=3;
    g.beginPath();g.moveTo(W/2-10,H/2);g.lineTo(W/2-3,H/2);g.moveTo(W/2+3,H/2);g.lineTo(W/2+10,H/2);g.moveTo(W/2,H/2-10);g.lineTo(W/2,H/2-3);g.moveTo(W/2,H/2+3);g.lineTo(W/2,H/2+10);g.stroke();g.shadowBlur=0}
  const mx0=W-140,my0=H-100;
  g.fillStyle="#ffffffaa";g.fillRect(mx0,my0,120,80);g.fillStyle="#ff9fcb";
  for(const o of OBS)g.fillRect(mx0+o[0]/7.5,my0+o[1]/7.5,o[2]/7.5,o[3]/7.5);
  for(const p of P){if(!p.alive)continue;g.fillStyle=p.col;g.beginPath();g.arc(mx0+p.x/7.5,my0+p.y/7.5,p===me?4:3,0,7);g.fill();
    if(p===me){g.strokeStyle=p.col;g.lineWidth=2;g.beginPath();g.moveTo(mx0+p.x/7.5,my0+p.y/7.5);g.lineTo(mx0+p.x/7.5+Math.cos(p.a)*10,my0+p.y/7.5+Math.sin(p.a)*10);g.stroke()}}
  g.strokeStyle="#3a2a5a";g.lineWidth=2;g.strokeRect(mx0,my0,120,80);
  const n=P.length,bw=(W-40-(n-1)*10)/n;
  P.forEach((p,k)=>{const x=20+k*(bw+10);
    g.fillStyle="#fff9";g.fillRect(x,12,bw,20);
    g.fillStyle=p.col;g.fillRect(x,12,bw*Math.max(0,p.hp)/100,20);
    g.strokeStyle="#3a2a5a";g.lineWidth=2;g.strokeRect(x,12,bw,20);
    g.font="bold 13px Arial";g.textAlign="left";g.fillStyle="#2a1a4a";
    g.fillText((p===me?"나":isAI?"AI":"P"+(k+1))+" "+Math.ceil(p.hp),x+6,27);
    g.textAlign="right";g.fillText("승 "+(wins[p.id]||0),x+bw-6,27)});
  g.fillStyle="#222";g.fillRect(20,H-18,120,6);
  g.fillStyle="#ffd400";g.fillRect(20,H-18,120*(1-Math.max(0,me.dcd)/1.2),6);
  g.font="bold 16px Arial";g.textAlign="left";
  if(me.tri>0){g.fillStyle="#ff7a00";g.fillText("⭐ 트리플샷 "+Math.ceil(me.tri)+"s",150,H-10)}
  if(state==="play"&&!me.alive){g.textAlign="center";g.fillStyle="#fff";g.fillText("관전 중...",W/2,H-14)}
  if(banner){g.textAlign="center";g.font="900 64px Arial";g.shadowColor="#fff";g.shadowBlur=25;g.fillStyle="#ff4d8d";g.fillText(banner,W/2,H/2+20);g.shadowBlur=0}
}

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(e.key===" "||e.key.startsWith("Arrow"))e.preventDefault();
  if(AC&&AC.state==="suspended")AC.resume();
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>

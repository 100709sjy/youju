<!-- MAIN GAME LOGIC SCRIPT -->
<script>
/**
 * 현욱이게임 1인칭 FPS (WASD + 화살표회전 + Spacebar 공격)
 */

// ... existing code ...
let selectedGameMode = "1v1"; // "1v1" or "nvn"
const keys = { w: false, a: false, s: false, d: false, left: false, right: false, space: false, shift: false };
let touchSwipeStartX = 0;

// Initialize 1st Person Controls (Pitch Fixed, Rotation with Arrow Keys)
window.addEventListener('keydown', e => {
  if (e.key === 'w' || e.key === 'W') keys.w = true;
  if (e.key === 'a' || e.key === 'A') keys.a = true;
  if (e.key === 's' || e.key === 'S') keys.s = true;
  if (e.key === 'd' || e.key === 'D') keys.d = true;
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.code === 'Space') {
    keys.space = true;
    if (state === 'play' && me && me.alive) shootMeteorBullet(me);
  }
  if (e.key === 'Shift') keys.shift = true;
});

window.addEventListener('keyup', e => {
  if (e.key === 'w' || e.key === 'W') keys.w = false;
  if (e.key === 'a' || e.key === 'A') keys.a = false;
  if (e.key === 's' || e.key === 'S') keys.s = false;
  if (e.key === 'd' || e.key === 'D') keys.d = false;
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.code === 'Space') keys.space = false;
  if (e.key === 'Shift') keys.shift = false;
});

// Mobile Swipe to Turn Camera Left/Right
function setupMobileLookControls() {
  const lookZone = document.getElementById('mobile-look-zone');
  
  window.addEventListener('touchstart', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      if (touch.clientX > window.innerWidth / 2) {
        touchSwipeStartX = touch.clientX;
      }
    }
  });

  window.addEventListener('touchmove', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      if (touch.clientX > window.innerWidth / 3 && me && me.alive) {
        const deltaX = touch.clientX - touchSwipeStartX;
        me.angle -= deltaX * 0.005; // Turn camera horizontally
        touchSwipeStartX = touch.clientX;
      }
    }
  });
}
setupMobileLookControls();

// Initialize Player & Bots depending on 1v1 vs NvN
function setupLocalGame() {
  const nick = document.getElementById('input-nickname').value || '현욱이';
  me = new Player('p_local', nick, false, 0xff2d6f); // Red Team player
  me.team = 'RED';
  players = [me];

  if (selectedGameMode === '1v1') {
    // 1대1 대전
    const bot = new Player('bot_1', '라이벌현욱', true, 0x00f0ff);
    bot.team = 'BLUE';
    players.push(bot);
  } else {
    // N대N (3v3 팀전)
    const redNames = ['현욱A', '현욱B'];
    const blueNames = ['블루현욱1', '블루현욱2', '블루현욱3'];

    redNames.forEach((n, idx) => {
      const p = new Player('red_' + idx, n, true, 0xff2d6f);
      p.team = 'RED';
      players.push(p);
    });

    blueNames.forEach((n, idx) => {
      const p = new Player('blue_' + idx, n, true, 0x00f0ff);
      p.team = 'BLUE';
      players.push(p);
    });
  }

  document.getElementById('hud-mode-title').innerText = selectedGameMode === '1v1' ? '1v1 복도 대전' : 'NvN 팀전 (RED vs BLUE)';
  spawnPickups();
  startGameLoop();
}

// Player Update Physics & 1st Person Camera Handling
function update(dt) {
  if (state !== 'play') return;

  if (me && me.alive) {
    // 1. Horizontal Camera Rotation with Arrow Keys (Left / Right)
    const turnSpeed = 2.2;
    if (keys.left) me.angle += turnSpeed * dt;
    if (keys.right) me.angle -= turnSpeed * dt;

    // 2. WASD Movement in 1st Person Direction
    let moveForward = 0;
    let moveSide = 0;

    if (keys.w) moveForward += 1;
    if (keys.s) moveForward -= 1;
    if (keys.a) moveSide -= 1;
    if (keys.d) moveSide += 1;

    if (isMobile && (joystickVector.x !== 0 || joystickVector.y !== 0)) {
      moveSide = joystickVector.x;
      moveForward = -joystickVector.y;
    }

    if (moveForward !== 0 || moveSide !== 0) {
      const sin = Math.sin(me.angle);
      const cos = Math.cos(me.angle);

      const moveX = (sin * moveForward + cos * moveSide);
      const moveZ = (cos * moveForward - sin * moveSide);

      const speedMult = me.dashTimer > 0 ? 1.8 : 1.0;
      me.x += moveX * me.speed * speedMult * dt;
      me.z += moveZ * me.speed * speedMult * dt;
    }

    // Map Boundaries
    me.x = Math.max(-110, Math.min(110, me.x));
    me.z = Math.max(-150, Math.min(150, me.z));

    if (me.dashTimer > 0) me.dashTimer -= dt;
    if (me.fireCd > 0) me.fireCd -= dt;
    if (me.shieldTimer > 0) me.shieldTimer -= dt;
    if (me.rapidTimer > 0) me.rapidTimer -= dt;
  }

  // Update AI Bots
  players.forEach(p => {
    if (p.isBot && p.alive) {
      // Target player from opposing team
      let target = players.find(t => t.alive && t.team !== p.team);
      if (target) {
        const dx = target.x - p.x;
        const dz = target.z - p.z;
        p.angle = Math.atan2(dx, dz);

        const dist = Math.hypot(dx, dz);
        if (dist > 30) {
          p.x += Math.sin(p.angle) * p.speed * 0.65 * dt;
          p.z += Math.cos(p.angle) * p.speed * 0.65 * dt;
        }

        if (dist < 140 && Math.random() < 0.035) {
          shootMeteorBullet(p);
        }
      }
    }
  });

  // Update Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.z += b.vz * dt;
    b.life -= dt;

    if (b.mesh) {
      b.mesh.position.set(b.x, 22, b.z); // Eye Level Bullet Height
      b.mesh.rotation.y += dt * 6;
      b.mesh.rotation.x += dt * 6;
    }

    let hitWall = Math.abs(b.x) > 115 || Math.abs(b.z) > 155;

    if (!hitWall) {
      for (let j = 0; j < players.length; j++) {
        const p = players[j];
        const shooter = players.find(s => s.id === b.ownerId);

        // Friendly Fire Check (Do not hit teammates in NvN)
        if (p.alive && p.id !== b.ownerId && (!shooter || shooter.team !== p.team || selectedGameMode === '1v1')) {
          const dist = Math.hypot(p.x - b.x, p.z - b.z);
          if (dist < 10) {
            hitWall = true;
            let dmg = 25;
            if (p.shieldTimer > 0) dmg *= 0.5;

            p.hp -= dmg;
            if (b.ownerId === me.id) triggerHitmarker();

            if (p.hp <= 0) {
              p.hp = 0;
              p.alive = false;
              if (shooter) shooter.kills++;
              setTimeout(() => respawnPlayer(p), 3000);
            }
            break;
          }
        }
      }
    }

    if (hitWall || b.life <= 0) {
      createExplosionParticles(b.x, b.z);
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }

  // Update Particles & Pickups
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life -= dt;
    pt.mesh.position.x += pt.vx * dt;
    pt.mesh.position.y += pt.vy * dt;
    pt.mesh.position.z += pt.vz * dt;
    pt.vy -= 98 * dt;
    pt.mesh.material.opacity = pt.life / 0.5;

    if (pt.life <= 0) {
      scene.remove(pt.mesh);
      particles.splice(i, 1);
    }
  }

  pickups.forEach(pk => {
    if (pk.mesh) pk.mesh.rotation.y += dt * 2;
    if (me && me.alive && Math.hypot(me.x - pk.x, me.z - pk.z) < 12) {
      sfx.playPickup();
      if (pk.type === 'hp') me.hp = Math.min(me.maxHp, me.hp + 40);
      if (pk.type === 'rapid') me.rapidTimer = 8;
      if (pk.type === 'shield') me.shieldTimer = 8;
      pk.x = (Math.random() - 0.5) * 160;
      pk.z = (Math.random() - 0.5) * 200;
      pk.mesh.position.set(pk.x, 8, pk.z);
    }
  });

  updateHUD();

  if (!isSolo && isHost) {
    broadcastState();
  }
}

// 1st Person Camera Rendering (Height = 22, Fixed Pitch, Eye Level)
function render3D() {
  if (me && me.alive) {
    const eyeHeight = 22; // Student Eye Level Height
    camera.position.set(me.x, eyeHeight, me.z);

    // Look Straight Forward in 1st Person Direction (Pitch Fixed to Horizontal Level)
    const lookX = me.x + Math.sin(me.angle) * 100;
    const lookZ = me.z + Math.cos(me.angle) * 100;
    camera.lookAt(lookX, eyeHeight, lookZ);
  }

  // Sync 3D Player Meshes (Hide own mesh in 1st Person View)
  players.forEach(p => {
    let vis = visP[p.id];
    if (!vis) {
      vis = createStudentCharacterMesh(p.color);
      scene.add(vis);
      visP[p.id] = vis;
    }
    vis.position.set(p.x, 0, p.z);
    vis.rotation.y = p.angle;
    // Hide own character mesh so it does not block the 1st person screen view
    vis.visible = p.alive && p.id !== me.id;
  });

  renderer.render(scene, camera);
}

// UI Bindings for Mode Switch
window.addEventListener('load', () => {
  document.getElementById('mode-1v1').addEventListener('click', () => {
    selectedGameMode = "1v1";
    document.getElementById('mode-1v1').className = 'py-2.5 rounded-lg text-xs font-bold transition-all bg-amber-500 text-slate-950 shadow';
    document.getElementById('mode-nvn').className = 'py-2.5 rounded-lg text-xs font-bold text-gray-400 transition-all hover:text-white';
  });

  document.getElementById('mode-nvn').addEventListener('click', () => {
    selectedGameMode = "nvn";
    document.getElementById('mode-nvn').className = 'py-2.5 rounded-lg text-xs font-bold transition-all bg-cyan-500 text-slate-950 shadow';
    document.getElementById('mode-1v1').className = 'py-2.5 rounded-lg text-xs font-bold text-gray-400 transition-all hover:text-white';
  });
});
</script>

const photoM=new THREE.MeshLambertMaterial({map:photoTex});
box(500,H-25,180,12,65,photoM);box(W-20,380,20,120,110,wallM);
const sign=new THREE.Mesh(new THREE.PlaneGeometry(60,35),signTex);sign.position.set(240,65,-10);scene.add(sign);

function resetVis(){for(const k in vis)scene.remove(vis[k].m);vis={};bm.forEach(m=>scene.remove(m));bm=[];pks.forEach(m=>scene.remove(m));pks=[]}
function updateScene(){
  const live=state==="play";
  if(!me)return;
  const targetX=me.x,targetY=me.y,targetA=me.a;
  cam.position.set(targetX,28,targetY+20);
  cam.rotation.set(0,0,0);
  cam.rotation.y=(Math.PI/2)-targetA;
  cam.rotation.x=-0.22;
  const activeIds=new Set(P.map(p=>p.id));
  for(const id in vis){if(!activeIds.has(Number(id))){scene.remove(vis[id].m);delete vis[id]}}
  P.forEach(p=>{
    let v=vis[p.id];
    if(!v){
      const g=new THREE.Group();
      const body=new THREE.Mesh(new THREE.BoxGeometry(16,28,12),new THREE.MeshLambertMaterial({color:p.col}));body.position.y=14;g.add(body);
      const head=new THREE.Mesh(new THREE.BoxGeometry(12,12,12),new THREE.MeshLambertMaterial({color:0xffd29d}));head.position.y=32;g.add(head);
      scene.add(g);v={m:g};vis[p.id]=v
    }
    v.m.position.set(p.x,0,p.y);
    v.m.rotation.y=-p.a+Math.PI/2;
    v.m.visible=p.alive
  });
  while(bm.length<bullets.length){const m=new THREE.Mesh(new THREE.SphereGeometry(3.5,8,8),new THREE.MeshBasicMaterial({color:0xffaa00}));scene.add(m);bm.push(m)}
  while(bm.length>bullets.length){scene.remove(bm.pop())}
  bullets.forEach((b,i)=>{bm[i].position.set(b.x,18,b.y)});
  while(pks.length<pickups.length){
    const g=new THREE.Group();
    const c=new THREE.Mesh(new THREE.CylinderGeometry(8,8,16,12),new THREE.MeshLambertMaterial({color:0x2dff9a}));c.position.y=8;g.add(c);
    scene.add(g);pks.push(g)
  }
  pickups.forEach((pk,i)=>{pks[i].position.set(pk.x,0,pk.y);pks[i].visible=pk.cd<=0});
  ren.render(scene,cam)
}

function render2D(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
  ctx.fillStyle="#07070f";ctx.fillRect(0,0,W,H);
  if(!state.startsWith("lobby")){ctx.restore();return}
  ctx.restore()
}

function loop(ts){
  const dt=Math.min(.05,(ts-(window._lt||ts))/1000);window._lt=ts;
  if(state==="play"||state==="round"||state==="roundEnd"){update(dt);updateScene()}
  render2D();
  requestAnimationFrame(loop)
}
requestAnimationFrame(ts=>{window._lt=ts;requestAnimationFrame(loop)});
</script>

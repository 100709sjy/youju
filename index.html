<html lang="ko">
<head>

<title>현욱이게임 - 3D 멸망의 운석 대전</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap');

  :root {
    --bg-dark: #090a10;
    --neon-cyan: #00f0ff;
    --neon-orange: #ff5500;
    --neon-yellow: #ffcc00;
  }
  
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
    touch-action: manipulation;
  }
  
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: 'Noto Sans KR', sans-serif;
  }

  .font-title {
    font-family: 'Black Han Sans', sans-serif;
  }

  /* Canvas Container */
  #game-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* HUD Overlay */
  #hud {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  .interactive {
    pointer-events: auto;
  }

  /* Glassmorphism Panel */
  .glass-panel {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  /* Touch Joystick Elements */
  .joystick-base {
    width: 120px;
    height: 120px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    position: absolute;
    bottom: 30px;
    left: 30px;
    display: none;
    touch-action: none;
  }

  .joystick-stick {
    width: 50px;
    height: 50px;
    background: radial-gradient(circle, var(--neon-cyan) 0%, rgba(0,240,255,0.4) 100%);
    border-radius: 50%;
    position: absolute;
    top: 35px;
    left: 35px;
    box-shadow: 0 0 15px var(--neon-cyan);
  }

  /* Hitmarker */
  #hitmarker {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    width: 32px;
    height: 32px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.05s ease-out, transform 0.05s ease-out;
  }
  #hitmarker.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.1);
  }
  #hitmarker::before, #hitmarker::after {
    content: '';
    position: absolute;
    background: #ff0055;
    box-shadow: 0 0 8px #ff0055;
  }
  #hitmarker::before { left: 14px; top: 0; width: 4px; height: 32px; }
  #hitmarker::after { top: 14px; left: 0; width: 32px; height: 4px; }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.2);
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
  }

<!-- MAIN GAME LOGIC SCRIPT -->
<script>
/**
 * 현욱이게임 3D ENGINE & MULTIPLAYER SYSTEM
 * Fixed WebGL Black Screen & CORS Issue with Procedural Textures
 */

// ==========================================
// 1. SOUND SYNTHESIZER (Web Audio API)
// ==========================================
class SoundFX {
  constructor() {
    this.ctx = null;
    this.enabled = true;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playMeteorShoot() {
    if (!this.enabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(440, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.25);
    } catch(e){}
  }

  playExplosion() {
    if (!this.enabled || !this.ctx) return;
    try {
      const bufferSize = this.ctx.sampleRate * 0.4;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, this.ctx.currentTime);
      filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.4);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start();
    } catch(e){}
  }

  playHit() {
    if (!this.enabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(220, this.ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.1);
    } catch(e){}
  }

  playPickup() {
    if (!this.enabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
      osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);
      osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.16);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.3);
    } catch(e){}
  }
}

const sfx = new SoundFX();

// ==========================================
// 2. PROCEDURAL TEXTURE GENERATORS
// ==========================================
function generateMeteorFaceTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  // Outer Meteor Flame Glow
  const grad = ctx.createRadialGradient(256, 256, 50, 256, 256, 250);
  grad.addColorStop(0, '#ffe600');
  grad.addColorStop(0.3, '#ff5500');
  grad.addColorStop(0.7, '#880000');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);

  // Meteor Rock Base
  ctx.beginPath();
  ctx.arc(256, 256, 170, 0, Math.PI * 2);
  ctx.fillStyle = '#2d1810';
  ctx.fill();

  // Face Skin Glow
  ctx.beginPath();
  ctx.arc(256, 250, 120, 0, Math.PI * 2);
  ctx.fillStyle = '#ffcca6';
  ctx.fill();

  // Hair
  ctx.beginPath();
  ctx.ellipse(256, 160, 110, 60, 0, Math.PI, 0);
  ctx.fillStyle = '#1a1829';
  ctx.fill();

  // Glasses Frame
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 10;
  ctx.strokeRect(180, 220, 65, 45);
  ctx.strokeRect(267, 220, 65, 45);
  ctx.beginPath();
  ctx.moveTo(245, 238);
  ctx.lineTo(267, 238);
  ctx.stroke();

  // Eyes
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(212, 242, 10, 0, Math.PI * 2);
  ctx.arc(300, 242, 10, 0, Math.PI * 2);
  ctx.fill();

  // Mouth
  ctx.beginPath();
  ctx.arc(256, 290, 30, 0.1, Math.PI - 0.1);
  ctx.lineWidth = 6;
  ctx.stroke();

  return new THREE.CanvasTexture(canvas);
}

function generateToiletSignTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 256, 128);
  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 8;
  ctx.strokeRect(6, 6, 244, 116);

  ctx.fillStyle = '#0284c7';
  ctx.fillRect(10, 10, 236, 28);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Toilet', 128, 30);

  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 42px sans-serif';
  ctx.fillText('화장실', 128, 88);

  return new THREE.CanvasTexture(canvas);
}

function generateFloorTileTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#cfd8dc';
  ctx.fillRect(0, 0, 512, 512);

  ctx.strokeStyle = '#90a4ae';
  ctx.lineWidth = 4;
  const size = 64;
  for (let x = 0; x <= 512; x += size) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, x); ctx.lineTo(512, x); ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(12, 12);
  return texture;
}

function generateWallTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(0, 180, 256, 76);
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 180, 256, 76);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(8, 1);
  return texture;
}

// ==========================================
// 3. GAME STATE & SETUP
// ==========================================
let scene, camera, renderer;
let me = null;
let players = [];
let bullets = [];
let particles = [];
let pickups = [];
let visP = {};

function init3D() {
  const container = document.getElementById('game-container');
  container.innerHTML = '';

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0c14);
  scene.fog = new THREE.FogExp2(0x0a0c14, 0.015);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // Generate Procedural Canvas Textures
  meteorTexture = generateMeteorFaceTexture();
  floorTexture = generateFloorTileTexture();
  wallTexture = generateWallTexture();
  signTexture = generateToiletSignTexture();

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffeedd, 0.8);
  dirLight.position.set(50, 100, 50);
  dirLight.castShadow = true;
  scene.add(dirLight);

  buildSchoolHallwayMap();
  window.addEventListener('resize', onWindowResize);
}

function buildSchoolHallwayMap() {
  const MAP_W = 240;
  const MAP_H = 320;
  const WALL_H = 50;

  // Floor & Ceiling
  const floorMat = new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.3, metalness: 0.1 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(MAP_W, MAP_H), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const ceilMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.8 });
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(MAP_W, MAP_H), ceilMat);
  ceiling.position.y = WALL_H;
  ceiling.rotation.x = Math.PI / 2;
  scene.add(ceiling);

  // Ceiling Lights
  for (let z = -MAP_H / 2 + 40; z < MAP_H / 2; z += 60) {
    const lightBox = new THREE.Mesh(
      new THREE.BoxGeometry(20, 1, 8),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    lightBox.position.set(0, WALL_H - 0.5, z);
    scene.add(lightBox);
  }

  // Outer Walls
  const wallMat = new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.5 });
  function addWall(w, h, d, x, y, z) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    wall.position.set(x, y, z);
    wall.castShadow = true;
    wall.receiveShadow = true;
    scene.add(wall);
  }

  addWall(MAP_W, WALL_H, 4, 0, WALL_H / 2, -MAP_H / 2);
  addWall(MAP_W, WALL_H, 4, 0, WALL_H / 2, MAP_H / 2);
  addWall(4, WALL_H, MAP_H, -MAP_W / 2, WALL_H / 2, 0);
  addWall(4, WALL_H, MAP_H, MAP_W / 2, WALL_H / 2, 0);

  // Obstacle Walls
  addWall(80, WALL_H, 10, -40, WALL_H / 2, -60);
  addWall(80, WALL_H, 10, 40, WALL_H / 2, 60);
  addWall(10, WALL_H, 90, 0, WALL_H / 2, 0);

  // Toilet Sign
  const signMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(24, 12),
    new THREE.MeshBasicMaterial({ map: signTexture, side: THREE.DoubleSide })
  );
  signMesh.position.set(0, WALL_H - 14, -50);
  scene.add(signMesh);
}

function createStudentCharacterMesh(colorHex = 0x38bdf8) {

  // Torso / Polo Shirt (Light Blue matching image 2)
  const shirtMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.6 });
  const torso = new THREE.Mesh(new THREE.BoxGeometry(10, 16, 7), shirtMat);
  torso.position.y = 15;
  torso.castShadow = true;
  group.add(torso);

  // Pants (Dark Blue/Black matching image 2)
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(4.2, 14, 6), pantsMat);
  leftLeg.position.set(-2.4, 7, 0);
  leftLeg.castShadow = true;
  group.add(leftLeg);

  const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(4.2, 14, 6), pantsMat);
  rightLeg.position.set(2.4, 7, 0);
  rightLeg.castShadow = true;
  group.add(rightLeg);

  // Head (Skin tone)
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd29d, roughness: 0.5 });
  const head = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 8), skinMat);
  head.position.y = 27;
  head.castShadow = true;
  group.add(head);

  // Glasses Frame (Dark)
  const glassMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
  const glasses = new THREE.Mesh(new THREE.BoxGeometry(8.2, 2.5, 8.2), glassMat);
  glasses.position.set(0, 27.5, 0.2);
  group.add(glasses);

  // Student Hair (Black)
  const hairMat = new THREE.MeshStandardMaterial({ color: 0x1e1e1e, roughness: 0.9 });
  const hair = new THREE.Mesh(new THREE.BoxGeometry(8.4, 4, 8.4), hairMat);
  hair.position.y = 31;
  group.add(hair);

  // Weapon / Hand Holding Meteor Launcher
  const launcherMat = new THREE.MeshStandardMaterial({ color: 0xff5500, roughness: 0.2, metalness: 0.5 });
  const launcher = new THREE.Mesh(new THREE.SphereGeometry(3.5, 12, 12), launcherMat);
  launcher.position.set(6, 17, 6);
  group.add(launcher);

  return group;
}

// 6. MULTIPLAYER & GAME ENGINE CLASS

class Player {
  constructor(id, name, isBot = false, col = 0x38bdf8) {
    this.id = id;
    this.name = name;
    this.isBot = isBot;
    this.color = col;
    this.x = (Math.random() - 0.5) * 160;
    this.z = (Math.random() - 0.5) * 200;
    this.angle = 0;
    this.hp = 100;
    this.maxHp = 100;
    this.kills = 0;
    this.alive = true;
    this.speed = 70;
    this.dashTimer = 0;
    this.fireCd = 0;
    this.shieldTimer = 0;
    this.rapidTimer = 0;
  }
}

// Initialize Singleplayer or Local Player
function setupLocalGame() {
  const nick = document.getElementById('input-nickname').value || '현욱이';
  me = new Player('p_local', nick, false, 0x00f0ff);
  players = [me];

  if (isSolo) {
    // Add 3 AI Student Bots
    const botNames = ['열공현욱', '복도짱현욱', '시험기간현욱'];
    const colors = [0xff2d6f, 0xffb703, 0x10b981];
    for (let i = 0; i < 3; i++) {
      players.push(new Player('bot_' + i, botNames[i], true, colors[i]));
    }
  }

  // Create Pickups in Hallway
  spawnPickups();
  startGameLoop();
}

function spawnPickups() {
  pickups = [
    { id: 'pk_hp', type: 'hp', x: -50, z: 0, mesh: null, cd: 0 },
    { id: 'pk_rapid', type: 'rapid', x: 50, z: 0, mesh: null, cd: 0 },
    { id: 'pk_shield', type: 'shield', x: 0, z: 80, mesh: null, cd: 0 }
  ];

  pickups.forEach(p => {
    const geo = new THREE.OctahedronGeometry(4);
    let matColor = 0x10b981;
    if (p.type === 'rapid') matColor = 0xf59e0b;
    if (p.type === 'shield') matColor = 0x06b6d4;

    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: matColor, emissive: matColor, emissiveIntensity: 0.5 }));
    mesh.position.set(p.x, 8, p.z);
    scene.add(mesh);
    p.mesh = mesh;
  });
}

// Start Main Game Flow
function startGameLoop() {
  document.getElementById('lobby-screen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  state = "play";
  gameTime = 120;

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (state === "play") {
      gameTime--;
      const m = String(Math.floor(gameTime / 60)).padStart(2, '0');
      const s = String(gameTime % 60).padStart(2, '0');
      document.getElementById('hud-timer').innerText = `${m}:${s}`;
      if (gameTime <= 0) endGame();
    }
  }, 1000);

  sfx.init();
}

window.addEventListener('keydown', e => {

  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;

  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
  if (e.key === 'Shift') keys.shift = true;
});

window.addEventListener('keyup', e => {
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.w = false;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
  if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.s = false;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
  if (e.key === 'Shift') keys.shift = false;
});

// Raycasting for Mouse Aiming
const raycaster = new THREE.Raycaster();
const mouseVec = new THREE.Vector2();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

window.addEventListener('mousemove', e => {
  if (state !== 'play' || !me || isMobile) return;
  mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouseVec, camera);
  const targetPoint = new THREE.Vector3();
  raycaster.ray.intersectPlane(floorPlane, targetPoint);

  if (targetPoint) {
    const dx = targetPoint.x - me.x;
    const dz = targetPoint.z - me.z;
    me.angle = Math.atan2(dx, dz);
  }
});

window.addEventListener('mousedown', e => {
  if (state === 'play' && me && me.alive && e.button === 0 && !isMobile) {
    shootMeteorBullet(me);
  }
});

// Mobile Touch Controls & Joystick Setup
function setupMobileControls() {
  const joyZone = document.getElementById('joystick-zone');
  const joyBase = document.getElementById('joystick-base');
  const joyStick = document.getElementById('joystick-stick');
  let joyActive = false;
  let joyTouchId = null;
  let basePos = { x: 0, y: 0 };

  joyZone.addEventListener('touchstart', e => {
    isMobile = true;
    const touch = e.changedTouches[0];
    joyTouchId = touch.identifier;
    joyActive = true;
    joyBase.style.display = 'block';
    const rect = joyZone.getBoundingClientRect();
    basePos = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  });

  window.addEventListener('touchmove', e => {
    if (!joyActive) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      if (touch.identifier === joyTouchId) {
        const dx = touch.clientX - basePos.x;
        const dy = touch.clientY - basePos.y;
        const dist = Math.min(Math.hypot(dx, dy), 45);
        const angle = Math.atan2(dy, dx);

        const sx = Math.cos(angle) * dist;
        const sy = Math.sin(angle) * dist;
        joyStick.style.transform = `translate(${sx}px, ${sy}px)`;

        joystickVector.x = sx / 45;
        joystickVector.y = sy / 45;
      }
    }
  });

  const endJoy = e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        joyActive = false;
        joyTouchId = null;
        joystickVector = { x: 0, y: 0 };
        joyStick.style.transform = 'translate(0px, 0px)';
        joyBase.style.display = 'none';
      }
    }
  };

  window.addEventListener('touchend', endJoy);
  window.addEventListener('touchcancel', endJoy);

  // Mobile Buttons
  document.getElementById('btn-mobile-fire').addEventListener('touchstart', e => {
    e.preventDefault();
    if (me && me.alive) shootMeteorBullet(me);
  });

  document.getElementById('btn-mobile-dash').addEventListener('touchstart', e => {
    e.preventDefault();
    if (me && me.alive && me.dashTimer <= 0) me.dashTimer = 0.4;
  });
}
setupMobileControls();

// 8. METEOR BULLET & PARTICLE SYSTEM
// ==========================================
function shootMeteorBullet(p) {
  if (p.fireCd > 0) return;
  p.fireCd = p.rapidTimer > 0 ? 0.12 : 0.35;

  const bulletSpeed = 160;
  const bx = p.x + Math.sin(p.angle) * 8;
  const bz = p.z + Math.cos(p.angle) * 8;

  // Meteor Bullet Mesh (Sphere with Face Texture)
  const bGeo = new THREE.SphereGeometry(3, 16, 16);
  const bMat = new THREE.MeshBasicMaterial({ map: meteorTexture });
  const mesh = new THREE.Mesh(bGeo, bMat);
  mesh.position.set(bx, 15, bz);
  scene.add(mesh);

  // Meteor Fire Trail Light
  const pLight = new THREE.PointLight(0xff5500, 1.5, 30);
  mesh.add(pLight);

  bullets.push({
    id: Math.random().toString(36).substring(2, 9),
    ownerId: p.id,
    x: bx,
    z: bz,
    vx: Math.sin(p.angle) * bulletSpeed,
    vz: Math.cos(p.angle) * bulletSpeed,
    mesh: mesh,
    life: 2.0
  });

  sfx.playMeteorShoot();
}

// Particle Explosion Effects on Impact
function createExplosionParticles(x, z) {
  sfx.playExplosion();
  shakeTime = 0.25;

  for (let i = 0; i < 20; i++) {
    const pGeo = new THREE.DodecahedronGeometry(Math.random() * 2 + 1);
    const pMat = new THREE.MeshBasicMaterial({
      color: Math.random() > 0.5 ? 0xff5500 : 0xffcc00,
      transparent: true,
      opacity: 1.0
    });
    const pMesh = new THREE.Mesh(pGeo, pMat);
    pMesh.position.set(x, 10 + (Math.random() - 0.5) * 8, z);
    scene.add(pMesh);

    particles.push({
      mesh: pMesh,
      vx: (Math.random() - 0.5) * 60,
      vy: Math.random() * 40 + 20,
      vz: (Math.random() - 0.5) * 60,
      life: 0.5
    });
  }
}

// Trigger Screen Shake & Hitmarker
function triggerHitmarker() {
  sfx.playHit();
  const hm = document.getElementById('hitmarker');
  hm.classList.add('active');
  setTimeout(() => hm.classList.remove('active'), 120);
}

// ==========================================
// 9. GAME UPDATE LOOP (Physics & Logic)
// ==========================================
function update(dt) {
  if (state !== 'play') return;

  // Timers Update
  if (shakeTime > 0) shakeTime -= dt;

  // Process Local Player Movement
  if (me && me.alive) {
    let dx = 0;
    let dz = 0;

    if (!isMobile) {
      if (keys.w) dz -= 1;
      if (keys.s) dz += 1;
      if (keys.a) dx -= 1;
      if (keys.d) dx += 1;
    } else {
      dx = joystickVector.x;
      dz = joystickVector.y;
      if (Math.hypot(dx, dz) > 0.1) {
        me.angle = Math.atan2(dx, dz);
      }
    }

    const len = Math.hypot(dx, dz);
    if (len > 0.1) {
      const speedMult = me.dashTimer > 0 ? 1.8 : 1.0;
      const currentSpeed = me.speed * speedMult;
      me.x += (dx / (isMobile ? 1 : len)) * currentSpeed * dt;
      me.z += (dz / (isMobile ? 1 : len)) * currentSpeed * dt;
    }

    // Map Boundary Collisions
    me.x = Math.max(-110, Math.min(110, me.x));
    me.z = Math.max(-150, Math.min(150, me.z));

    if (keys.shift && me.dashTimer <= 0) me.dashTimer = 0.4;
    if (me.dashTimer > 0) me.dashTimer -= dt;
    if (me.fireCd > 0) me.fireCd -= dt;
    if (me.shieldTimer > 0) me.shieldTimer -= dt;
    if (me.rapidTimer > 0) me.rapidTimer -= dt;
  }

  // Update AI Bots
  players.forEach(p => {
    if (p.isBot && p.alive) {
      // AI Logic: Track nearest target & shoot
      let target = me.alive ? me : null;
      if (target) {
        const dist = Math.hypot(target.x - p.x, target.z - p.z);
        p.angle = Math.atan2(target.x - p.x, target.z - p.z);

        if (dist > 40) {
          p.x += Math.sin(p.angle) * p.speed * 0.7 * dt;
          p.z += Math.cos(p.angle) * p.speed * 0.7 * dt;
        }

        if (dist < 120 && Math.random() < 0.03) {
          shootMeteorBullet(p);
        }
      }
    }
  });

  // Update Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.z += b.vz * dt;
    b.life -= dt;

    if (b.mesh) {
      b.mesh.position.set(b.x, 15, b.z);
      b.mesh.rotation.y += dt * 5;
    }

    // Map Border Bullet Impact
    let hitWall = Math.abs(b.x) > 115 || Math.abs(b.z) > 155;

    // Player Bullet Collision
    if (!hitWall) {
      for (let j = 0; j < players.length; j++) {
        const p = players[j];
        if (p.alive && p.id !== b.ownerId) {
          const dist = Math.hypot(p.x - b.x, p.z - b.z);
          if (dist < 10) {
            hitWall = true;
            let dmg = 25;
            if (p.shieldTimer > 0) dmg *= 0.5;

            p.hp -= dmg;
            if (b.ownerId === me.id) triggerHitmarker();

            if (p.hp <= 0) {
              p.hp = 0;
              p.alive = false;
              const killer = players.find(k => k.id === b.ownerId);
              if (killer) killer.kills++;
              setTimeout(() => respawnPlayer(p), 3000);
            }
            break;
          }
        }
      }
    }

    if (hitWall || b.life <= 0) {
      createExplosionParticles(b.x, b.z);
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }

  // Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life -= dt;
    pt.mesh.position.x += pt.vx * dt;
    pt.mesh.position.y += pt.vy * dt;
    pt.mesh.position.z += pt.vz * dt;
    pt.vy -= 98 * dt; // Gravity
    pt.mesh.material.opacity = pt.life / 0.5;

    if (pt.life <= 0) {
      scene.remove(pt.mesh);
      particles.splice(i, 1);
    }
  }

  // Update Pickups Collision
  pickups.forEach(pk => {
    if (pk.mesh) pk.mesh.rotation.y += dt * 2;
    if (me && me.alive && Math.hypot(me.x - pk.x, me.z - pk.z) < 12) {
      sfx.playPickup();
      if (pk.type === 'hp') me.hp = Math.min(me.maxHp, me.hp + 40);
      if (pk.type === 'rapid') me.rapidTimer = 8;
      if (pk.type === 'shield') me.shieldTimer = 8;
      pk.x = (Math.random() - 0.5) * 160;
      pk.z = (Math.random() - 0.5) * 200;
      pk.mesh.position.set(pk.x, 8, pk.z);
    }
  });

  // Update HUD Display
  updateHUD();

  // PeerJS Networking Broadcast (if Host)
  if (!isSolo && isHost) {
    broadcastState();
  }
}

function respawnPlayer(p) {
  p.hp = 100;
  p.alive = true;
  p.x = (Math.random() - 0.5) * 160;
  p.z = (Math.random() - 0.5) * 200;
}

// Update 3D Scene Rendering & Camera Tracking
function render3D() {
  if (me) {
    // Camera Tracking Local Player with Shake Effect
    const targetCamX = me.x + (shakeTime > 0 ? (Math.random() - 0.5) * 4 : 0);
    const targetCamZ = me.z + 75 + (shakeTime > 0 ? (Math.random() - 0.5) * 4 : 0);

    camera.position.set(targetCamX, 90, targetCamZ);
    camera.lookAt(me.x, 15, me.z);
  }

  // Sync 3D Player Character Meshes
  players.forEach(p => {
    let vis = visP[p.id];
    if (!vis) {
      vis = createStudentCharacterMesh(p.color);
      scene.add(vis);
      visP[p.id] = vis;
    }
    vis.position.set(p.x, 0, p.z);
    vis.rotation.y = p.angle;
    vis.visible = p.alive;
  });

  renderer.render(scene, camera);
}

// Main Frame Loop
function animationLoop(timestamp) {
  const dt = Math.min((timestamp - (window._lastTime || timestamp)) / 1000, 0.05);
  window._lastTime = timestamp;

  update(dt);
  render3D();

  requestAnimationFrame(animationLoop);
}

// ==========================================
// 10. HUD & UI RENDERER
// ==========================================
function updateHUD() {
  if (!me) return;
  document.getElementById('hud-player-name').innerText = me.name;
  document.getElementById('hud-hp-text').innerText = `${Math.ceil(me.hp)} HP`;

  const hpPercent = Math.max(0, (me.hp / me.maxHp) * 100);
  document.getElementById('hud-hp-bar').style.width = `${hpPercent}%`;

  // Status Buff Indicators
  const weaponText = me.rapidTimer > 0 ? '🔥 연사 운석 폭격' : '☄️ 멸망의 운석';
  document.getElementById('hud-weapon-status').innerHTML = `<i class="fa-solid fa-meteor"></i> ${weaponText}`;

  const shieldText = me.shieldTimer > 0 ? '🛡️ 방어막 활성' : '노말 버프';
  document.getElementById('hud-shield-status').innerHTML = `<i class="fa-solid fa-shield-halved text-cyan-400"></i> ${shieldText}`;

  // Leaderboard
  const sorted = [...players].sort((a, b) => b.kills - a.kills);
  const lbContainer = document.getElementById('hud-leaderboard');
  lbContainer.innerHTML = sorted.map((p, idx) => `
    <div class="flex justify-between items-center ${p.id === me.id ? 'text-amber-400 font-bold' : 'text-gray-300'}">
      <span>${idx + 1}. ${p.name}</span>
      <span>${p.kills} 킬</span>
    </div>
  `).join('');
}

function endGame() {
  state = "roundEnd";
  if (timerInterval) clearInterval(timerInterval);

  const sorted = [...players].sort((a, b) => b.kills - a.kills);
  const winner = sorted[0];

  document.getElementById('hud').classList.add('hidden');
  document.getElementById('gameover-screen').classList.remove('hidden');

  document.getElementById('gameover-title').innerText = winner.id === me.id ? '🎉 MVP 최종 승리!' : `${winner.name} 승리!`;
  document.getElementById('gameover-desc').innerText = `학교 복도 전장을 석권한 멸망의 수호자입니다!`;

  document.getElementById('final-stats').innerHTML = sorted.map((p, i) => `
    <div class="flex justify-between p-1.5 rounded ${i === 0 ? 'bg-amber-500/20 text-amber-300 font-bold' : 'text-gray-300'}">
      <span>${i + 1}등. ${p.name}</span>
      <span>${p.kills} KILLS (${p.hp > 0 ? '생존' : '처치됨'})</span>
    </div>
  `).join('');
}

// ==========================================
// 11. MULTIPLAYER SYSTEM (PeerJS)
// ==========================================
function initMultiplayerPeer() {
  peer = new Peer();

  peer.on('open', id => {
    console.log('PeerJS Connected with ID:', id);
  });

  peer.on('connection', conn => {
    connections.push(conn);
    setupConnection(conn);
  });
}

function setupConnection(conn) {
  conn.on('data', data => {
    if (data.type === 'join') {
      const newP = new Player(data.id, data.name, false, 0xff2d6f);
      players.push(newP);
    }
    if (data.type === 'state' && !isHost) {
      // Sync State from Host
      data.players.forEach(sp => {
        const lp = players.find(p => p.id === sp.id);
        if (lp && lp.id !== me.id) {
          lp.x = sp.x;
          lp.z = sp.z;
          lp.angle = sp.angle;
          lp.hp = sp.hp;
          lp.kills = sp.kills;
          lp.alive = sp.alive;
        } else if (!lp) {
          players.push(new Player(sp.id, sp.name, false, 0xff2d6f));
        }
      });
    }
  });
}

function broadcastState() {
  const pStates = players.map(p => ({
    id: p.id, name: p.name, x: p.x, z: p.z, angle: p.angle, hp: p.hp, kills: p.kills, alive: p.alive
  }));

  connections.forEach(conn => {
    if (conn.open) {
      conn.send({ type: 'state', players: pStates });
    }
  });
}

// ==========================================
// 12. UI BUTTON BINDINGS & INIT
// ==========================================
window.addEventListener('load', () => {
  init3D();
  initMultiplayerPeer();
  requestAnimationFrame(animationLoop);

  // Tab Switching
  document.getElementById('tab-solo').addEventListener('click', () => {
    isSolo = true;
    document.getElementById('tab-solo').className = 'py-2.5 rounded-lg text-xs font-bold transition-all bg-amber-500 text-slate-950 shadow';
    document.getElementById('tab-multi').className = 'py-2.5 rounded-lg text-xs font-bold text-gray-400 transition-all hover:text-white';
    document.getElementById('multi-options').classList.add('hidden');
  });

  document.getElementById('tab-multi').addEventListener('click', () => {
    isSolo = false;
    document.getElementById('tab-multi').className = 'py-2.5 rounded-lg text-xs font-bold transition-all bg-cyan-500 text-slate-950 shadow';
    document.getElementById('tab-solo').className = 'py-2.5 rounded-lg text-xs font-bold text-gray-400 transition-all hover:text-white';
    document.getElementById('multi-options').classList.remove('hidden');
  });

  // Start Game Button
  document.getElementById('btn-start-game').addEventListener('click', () => {
    setupLocalGame();
  });

  // Multi Rooms Setup
  document.getElementById('btn-create-room').addEventListener('click', () => {
    isHost = true;
    roomCode = "HW" + Math.floor(1000 + Math.random() * 9000);
    document.getElementById('hud-room-code').innerText = `ROOM: ${roomCode}`;
    alert(`새로운 방이 생성되었습니다!\n방 코드: ${roomCode}\n친구에게 전달하여 함께 플레이하세요!`);
    setupLocalGame();
  });

  document.getElementById('btn-join-room').addEventListener('click', () => {
    const code = document.getElementById('input-room-code').value.trim();
    if (!code) return alert('방 코드를 입력해주세요!');
    isHost = false;
    setupLocalGame();
  });

  // Restart Button
  document.getElementById('btn-restart').addEventListener('click', () => {
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('lobby-screen').classList.remove('hidden');
    state = "lobby";
  });

  // Toggle Sound
  document.getElementById('btn-toggle-sound').addEventListener('click', () => {
    sfx.enabled = !sfx.enabled;
    const icon = document.getElementById('icon-sound');
    const text = document.getElementById('text-sound');
    if (sfx.enabled) {
      icon.className = "fa-solid fa-volume-high text-emerald-400";
      text.innerText = "사운드 ON";
    } else {
      icon.className = "fa-solid fa-volume-xmark text-gray-500";
      text.innerText = "사운드 OFF";
    }
  });
});

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

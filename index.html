<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>현욱이게임</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{color-scheme:dark;--c1:#00e5ff;--c2:#ff2d6f;--ok:#2dff9a;--mu:#8b8fb8;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07070f;color:#e8eaff;font-family:"Segoe UI",Arial,sans-serif}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1a1040,#07070f 70%)}
#wrap{position:relative;width:min(100vw,calc(100dvh*1.5));height:min(100dvh,calc(100vw/1.5));max-width:1000px;max-height:667px;border-radius:10px;overflow:hidden}
#wrap.playing{touch-action:none}
@media(max-width:700px),(max-height:500px){#wrap{width:100%;height:100%;max-width:none;max-height:none;border-radius:0}}
#wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important;pointer-events:none!important}
.menu{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#07071af0,#0b0b24f5);padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));overflow-y:auto;pointer-events:auto}
.hide{display:none!important}
h1{font-size:clamp(26px,7vw,48px);letter-spacing:2px;background:linear-gradient(90deg,#ffb347,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.sub{color:var(--mu);margin:4px 0 12px;font-size:clamp(12px,3.2vw,15px)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:5px 0;width:min(340px,94%)}
button,select,input{font:inherit;font-size:16px;border-radius:12px;min-height:44px;color:inherit;pointer-events:auto}
button{padding:8px 14px;font-weight:700;border:2px solid var(--c1);background:#0a0a1e;color:var(--c1);cursor:pointer;flex:1;min-width:80px;touch-action:manipulation}
button.g{border-color:var(--ok);color:var(--ok)}button.r{border-color:var(--c2);color:var(--c2)}button.gray{border-color:#555;color:#aaa}
button:active{opacity:.7;transform:scale(.98)}
select,input{padding:8px;border:2px solid #2a2a5a;background:#12122a;width:100%;text-align:center}
.box{background:#12122acc;padding:16px;border-radius:16px;border:1px solid #2a2a5a;width:min(340px,94%);position:relative;z-index:210}
.box>*{margin-top:8px}
#status{min-height:22px;margin-top:6px;color:var(--ok);font-size:14px}
.msg{color:var(--c2);font-size:13px;min-height:16px}
.keys{color:var(--mu);font-size:12px;margin-top:10px;line-height:1.6}.keys b{color:#ffb347}
#endT{font-size:clamp(26px,7vw,48px);font-weight:900;margin-bottom:14px}
.ubar{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;z-index:110;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);pointer-events:none}
.ubar *{pointer-events:auto}.ubar b{color:var(--c1)}.ubar button{flex:none;min-height:30px;padding:4px 8px;font-size:12px;min-width:0}
.lb{width:min(340px,94%);max-height:48vh;overflow-y:auto;text-align:left;margin:10px 0}
.lbi{display:flex;justify-content:space-between;padding:8px 12px;background:#0e0e22cc;border-radius:8px;margin:4px 0;font-size:14px}.lbi i{color:var(--c1);font-style:normal;font-weight:700;width:26px}.lbi em{color:var(--ok);font-style:normal;font-weight:700}
#touchUI{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}#touchUI.show{display:block}
.jb{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;background:#ffffff1f;border:2px solid #00e5ff59;pointer-events:auto}
.js{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#00e5ff8c;border:2px solid #00e5ff;pointer-events:none}
.tb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;font-weight:800;color:#fff}
#bF{right:max(18px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:76px;height:76px;background:#ff781480;border:3px solid #ff7a00;font-size:15px}
#bD{right:max(18px,env(safe-area-inset-right));bottom:max(116px,calc(env(safe-area-inset-bottom) + 108px));width:54px;height:54px;background:#ffd40059;border:2px solid #ffd400;color:#ffd400;font-size:12px}
#bU{right:max(104px,calc(env(safe-area-inset-right) + 94px));bottom:max(40px,calc(env(safe-area-inset-bottom) + 30px));width:58px;height:58px;background:#ff2d6f66;border:2px solid #ff2d6f;font-size:12px}
#bW{right:max(104px,calc(env(safe-area-inset-right) + 94px));bottom:max(110px,calc(env(safe-area-inset-bottom) + 100px));width:54px;height:54px;background:#00e5ff40;border:2px solid #00e5ff;font-size:12px}

#globalChat{width:min(340px,94%);margin-top:10px;text-align:left;background:#12122acc;border:1px solid #2a2a5a;border-radius:12px;padding:8px}
.chat-head{font-size:13px;font-weight:bold;color:var(--c1);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.chat-head span{font-size:11px;color:var(--mu);font-weight:normal}
#globalChatLog{height:100px;overflow-y:auto;background:#0e0e22cc;border-radius:8px;padding:6px;font-size:13px;line-height:1.5;word-break:break-all}
#globalChatLog b{color:var(--c1)}
#globalChatLog i{color:var(--mu);font-style:normal}
#globalChatLog .sys{color:#ffb347;font-size:12px}
.crow{display:flex;gap:6px;margin-top:6px}
#globalChatIn{flex:1;min-height:36px;text-align:left;width:auto;font-size:13px;padding:6px 10px}
#globalChatSend{flex:none;min-height:36px;min-width:54px;padding:4px 10px;font-size:13px}
</style>
</head>
<body>
<div id="app"><div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>
  <div id="touchUI">
    <div class="jb" id="jb"><div class="js" id="js"></div></div>
    <div class="tb" id="bD">대시</div><div class="tb" id="bW">무기</div><div class="tb" id="bU">메테오</div><div class="tb" id="bF">발사</div>
  </div>
</div></div>

<div class="ubar">
  <span id="ulabel">게스트</span>
  <span>
    <button type="button" class="gray" id="btnEditNick">닉네임 변경</button>
    <button type="button" class="gray" id="btnLB">글로벌 리더보드</button> 
    <button type="button" class="gray" id="logoutBtn" style="display:none">로그아웃</button>
  </span>
</div>

<div id="auth" class="menu">
  <h1>현욱이게임</h1><div class="sub">복도 위로 운석이 쏟아진다 ☄️ · 글로벌 8인 대난투</div>
  <div class="box">
    <input id="aNick" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="username">
    <input id="aPw" type="password" maxlength="20" placeholder="비밀번호" autocomplete="current-password">
    <div class="msg" id="aMsg"></div>
    <button type="button" class="g" id="btnLogin" style="width:100%">로그인</button>
    <button type="button" id="btnSignup" style="width:100%">회원가입</button>
    <button type="button" class="gray" id="btnGuest" style="width:100%">게스트로 플레이</button>
  </div>
</div>

<div id="lobby" class="menu hide">
  <h1>현욱이게임</h1><div class="sub">1인칭 슈팅 · 맵 4개 · 총기 5종 선택 · 최대 8인 난투</div>
  
  <div class="row" style="flex-direction:column;gap:4px">
    <div style="font-size:12px;color:var(--c1);font-weight:bold;text-align:left">주 무기 선택:</div>
    <select id="startWeaponSel">
      <option value="0">권총 (밸런스형)</option>
      <option value="1">샷건 (근거리 근접 폭딜)</option>
      <option value="2">저격총 (원거리 한방 데미지)</option>
      <option value="3">기관총 (고속 연사 서프레서)</option>
      <option value="4">바주카 (범위 폭발 미사일)</option>
    </select>
  </div>

  <div class="row"><select id="mapSel"></select></div>
  <div class="row">
    <select id="modeSel">
      <option value="2">AI 1:1 (2인)</option>
      <option value="4">AI 4인 난투</option>
      <option value="6">AI 6인 대난투</option>
      <option value="8">AI 8인 풀방 난투</option>
    </select>
  </div>
  <div class="row"><button type="button" class="g" id="bEasy">쉬움</button><button type="button" class="g" id="bNorm">보통</button><button type="button" class="r" id="bHard">지옥</button></div>
  <div class="row"><button type="button" id="btnCreate">방 만들기 (최대 8인)</button></div>
  <div class="row"><input id="roomInput" maxlength="5" placeholder="방 코드" style="flex:1"><button type="button" id="btnJoin" style="flex:none">입장</button></div>
  <div class="row"><button type="button" id="startBtn" class="g hide">게임 시작</button></div>
  <div id="status"></div>
  
  <div id="globalChat">
    <div class="chat-head">🌐 전체 글로벌 채팅 <span id="onlineCount">접속 중...</span></div>
    <div id="globalChatLog"></div>
    <div class="crow">
      <input id="globalChatIn" maxlength="100" placeholder="전체 채팅 입력 (Enter)" autocomplete="off">
      <button type="button" id="globalChatSend">전송</button>
    </div>
  </div>

  <div class="keys"><b>PC</b> WASD 이동 · ←→ 회전 · Space/J 발사 · Shift/L 대시 · E 메테오 · R/1~5 무기 교체<br><b>모바일</b> 조이스틱 · 화면 쓸어 회전 · 버튼</div>
</div>

<div id="lboard" class="menu hide">
  <h1>글로벌 리더보드</h1>
  <div class="sub">전 세계 유저 실시간 랭킹 (네트워크 연동)</div>
  <div class="lb" id="lbList"></div>
  <button type="button" id="btnCloseLB" style="flex:none;width:200px">닫기</button>
</div>

<div id="end" class="menu hide">
  <div id="endT"></div>
  <div class="row"><button type="button" class="g" id="btnRe">다시하기</button><button type="button" id="btnLobby">로비로</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$("game");
const ctx=cv.getContext("2d");
let t=0, state="lobby", isAI=true, D=null, myId=0, peer=null, conn=null, conns=[], nextId=1, roomCode="", wins={}, bullets=[], parts=[], pickups=[], keys={}, shake=0, hitFl=0, sendT=0;

/* ---------- 계정 / 리더보드 ---------- */
const LS={u:"hyeonuk_users",c:"hyeonuk_current",s:"hyeonuk_scores",g:"hyeonuk_global_scores"};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return"h"+Math.abs(h).toString(16)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let user=null;

function show(id){["auth","lobby","lboard","end"].forEach(x=>$(x).classList.add("hide"));if(id)$(id).classList.remove("hide")}
function ubar(){
  $("ulabel").innerHTML=user?`<b>${esc(user.nick)}</b> 님`:"게스트";
  $("logoutBtn").style.display=user&&!user.guest?"inline-block":"none";
  $("btnEditNick").style.display=user&&!user.guest?"inline-block":"none";
}

function loginAs(n){
  user={nick:n,guest:false};
  sv(LS.c,user);
  $("aMsg").textContent="";
  show("lobby");
  ubar();
  initGlobalChat();
}

  const fill=new THREE.Sprite(new THREE.SpriteMaterial({color:p.col,transparent:true}));fill.scale.set(40,4,1);fill.renderOrder=2;

}
function resetVis(){for(const k in vis){const v=vis[k];scene.remove(v.spr,v.bg,v.fill)}vis={}}

const vv=new THREE.Vector3();

    cam.fov=78;cam.updateProjectionMatrix();cam.position.set(W/2+Math.cos(t*.25)*W*.34,110,H/2+Math.sin(t*.25)*H*.3);cam.lookAt(W/2,20,H/2);ren.render(scene,cam);return}
  const sx=(Math.random()-.5)*shake*.5,sy=(Math.random()-.5)*shake*.5,bob=Math.hypot(me.vx,me.vy)>10?Math.sin(t*12)*1.3:0;
  cam.position.set(me.x+sx,24+sy+bob,me.y);cam.lookAt(me.x+Math.cos(me.a)*100,24,me.y+Math.sin(me.a)*100);cam.fov=78+(me.dash>0?10:0);cam.updateProjectionMatrix();
  const wp=WEP[me.w];gun.material.color.setHex(wp.c);gun.scale.set(1,1,wp.z);gun.position.z=-14+Math.max(0,me.cd-.2)*22;
  for(const p of P){const v=getVis(p),on=p.alive&&p!==me;v.spr.visible=v.bg.visible=v.fill.visible=on;if(!on)continue;
    v.spr.position.set(p.x,30,p.y);v.bg.position.set(p.x,64,p.y);v.fill.position.set(p.x,64,p.y);v.fill.scale.x=Math.max(.01,40*Math.max(0,p.hp)/100)}
  pickups.forEach((p,i)=>{if(!pks[i]){pks[i]=new THREE.Sprite(new THREE.SpriteMaterial({map:emoTex(["💖","⭐","🛡️"][p.k]),transparent:true}));pks[i].scale.set(30,30,1);scene.add(pks[i])}
    pks[i].visible=p.cd<=0;pks[i].position.set(p.x,22+Math.sin(t*4+i)*4,p.y)});
  for(let i=pickups.length;i<pks.length;i++)pks[i].visible=false;
  bullets.forEach((b,i)=>{const o=byId(b.o),c=o?o.col:"#ffffff";let m=bm[i];
    if(!m){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:MET,transparent:true})),gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glow(c),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(s,gl);m=bm[i]={s,gl,c}}
    if(m.c!==c){m.gl.material.map=glow(c);m.gl.material.needsUpdate=true;m.c=c}
    const z=12+b.d*.5;m.s.scale.set(z,z,1);m.gl.scale.set(z*2.4,z*2.4,1);
    m.s.visible=m.gl.visible=true;m.s.material.rotation=t*8+i;m.s.position.set(b.x,22,b.y);m.gl.position.set(b.x,22,b.y)});
  for(let i=bullets.length;i<bm.length;i++)bm[i].s.visible=bm[i].gl.visible=false;
  ren.render(scene,cam);
  if(hitFl>0){g.fillStyle="rgba(255,45,111,"+Math.min(.5,hitFl*1.4)+")";g.fillRect(0,0,HW,HH)}
  for(const p of parts){const s=proj(p.x,p.s?34+(.7-p.l)*45:16,p.y);if(!s)continue;g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;
    if(p.s){g.font="bold 20px Arial";g.textAlign="center";g.fillText(p.s,s[0],s[1])}else g.fillRect(s[0]-2,s[1]-2,5,5)}
  g.globalAlpha=1;
  if(me.alive){g.strokeStyle="#fff";g.lineWidth=2;g.shadowColor="#000";g.shadowBlur=3;g.beginPath();g.moveTo(HW/2-10,HH/2);g.lineTo(HW/2-3,HH/2);g.moveTo(HW/2+3,HH/2);g.lineTo(HW/2+10,HH/2);g.moveTo(HW/2,HH/2-10);g.lineTo(HW/2,HH/2-3);g.moveTo(HW/2,HH/2+3);g.lineTo(HW/2,HH/2+10);g.stroke();g.shadowBlur=0}
  
  const mw=120,mh=120*H/W,k=mw/W,mx0=HW-mw-20,my0=HH-mh-20;
  g.fillStyle="#ffffffaa";g.fillRect(mx0,my0,mw,mh);g.fillStyle="#7fb8d8";for(const o of OBS)g.fillRect(mx0+o[0]*k,my0+o[1]*k,o[2]*k,o[3]*k);
  for(const p of P){if(!p.alive)continue;g.fillStyle=p.col;g.beginPath();g.arc(mx0+p.x*k,my0+p.y*k,p===me?4:3,0,7);g.fill();
    if(p===me){g.strokeStyle=p.col;g.lineWidth=2;g.beginPath();g.moveTo(mx0+p.x*k,my0+p.y*k);g.lineTo(mx0+p.x*k+Math.cos(p.a)*10,my0+p.y*k+Math.sin(p.a)*10);g.stroke()}}
  g.strokeStyle="#3a2a5a";g.lineWidth=2;g.strokeRect(mx0,my0,mw,mh);
  
  const n=P.length,bw=(HW-40-(n-1)*6)/n;
  P.forEach((p,i)=>{const x=20+i*(bw+6);g.fillStyle="#fff9";g.fillRect(x,12,bw,20);g.fillStyle=p.col;g.fillRect(x,12,bw*Math.max(0,p.hp)/100,20);
    if(p.sh>0){g.fillStyle="#7fe0ff";g.fillRect(x,32,bw*p.sh/60,4)}
    g.strokeStyle="#3a2a5a";g.lineWidth=2;g.strokeRect(x,12,bw,20);g.font="bold "+(n>4?10:13)+"px Arial";g.textAlign="left";g.fillStyle="#2a1a4a";
    g.fillText((p===me?"나":p.bot?"AI"+i:"P"+(i+1)),x+3,26);g.textAlign="right";g.fillText(wins[p.id]||0,x+bw-3,26)});
  
  g.fillStyle="#222";g.fillRect(20,HH-18,120,6);g.fillStyle="#ffd400";g.fillRect(20,HH-18,120*(1-Math.max(0,me.dcd)/1.2),6);
  g.fillStyle="#222";g.fillRect(20,HH-30,120,8);g.fillStyle=me.ult>=100&&Math.sin(t*16)>0?"#fff":"#ff5a00";g.fillRect(20,HH-30,120*me.ult/100,8);
  g.font="bold 14px Arial";g.textAlign="left";g.fillStyle="#fff";g.shadowColor="#000";g.shadowBlur=4;
  g.fillText("무기: "+wp.n+" [숫자1~5/R]",20,HH-44);
  if(me.ult>=100){g.fillStyle="#ff9a2a";g.fillText("☄️ 메테오 폭풍 준비! (E)",160,HH-22)}
  if(me.tri>0){g.fillStyle="#ffd24a";g.fillText("⭐ 트리플샷 "+Math.ceil(me.tri)+"s",160,HH-42)}
  g.shadowBlur=0;
  if(state==="play"&&!me.alive){g.textAlign="center";g.fillStyle="#fff";g.font="bold 16px Arial";g.fillText("관전 중...",HW/2,HH-14)}
  if(banner){g.textAlign="center";g.font="900 64px Arial";g.fillStyle="#ff4d8d";g.strokeStyle="#fff";g.lineWidth=6;g.strokeText(banner,HW/2,HH/2+20);g.fillText(banner,HW/2,HH/2+20)}
}

/* 입력 / 루프 및 DOM 이벤트 바인딩 */
function startAI(d){isAI=true;D=DIFF[d];myId=0;begin(+$("modeSel").value,+$("mapSel").value)}

window.addEventListener("DOMContentLoaded", () => {
  $("bEasy").onclick=()=>startAI("easy");
  $("bNorm").onclick=()=>startAI("normal");
  $("bHard").onclick=()=>startAI("hard");
  $("btnCreate").onclick=createRoom;
  $("btnJoin").onclick=joinRoom;
  $("startBtn").onclick=hostStart;
  $("btnRe").onclick=rematch;
  $("btnLobby").onclick=toLobby;

  $("btnSignup").onclick = () => {
    const n=$("aNick").value.trim(),p=$("aPw").value,m=$("aMsg"),u=ld(LS.u,"{}");
    if(n.length<2||n.length>12){m.textContent="닉네임 2~12자";return}
    if(p.length<2){m.textContent="비밀번호 2자 이상";return}
    if(u[n]){m.textContent="이미 있는 닉네임";return}
    u[n]=hash(p);sv(LS.u,u);const s=ld(LS.s,"{}");s[n]=s[n]||0;sv(LS.s,s);loginAs(n);
  };

  $("btnLogin").onclick = () => {
    const n=$("aNick").value.trim(),u=ld(LS.u,"{}");
    if(!u[n]||u[n]!==hash($("aPw").value)){$("aMsg").textContent="닉네임/비밀번호 틀림";return}
    loginAs(n);
  };

  $("btnGuest").onclick = () => {
    user={nick:"게스트_"+Math.floor(1000+Math.random()*9000),guest:true};
    try{localStorage.removeItem(LS.c)}catch(e){}
    show("lobby");ubar();initGlobalChat();
  };

  $("logoutBtn").onclick = () => {
    user=null;try{localStorage.removeItem(LS.c)}catch(e){}
    show("auth");ubar();
  };

  $("btnEditNick").onclick=()=>{
    if(!user||user.guest) return;
    const newNick = prompt("새로운 닉네임을 입력하세요 (2~12자):", user.nick);
    if(!newNick) return;
    const trimmed = newNick.trim();
    if(trimmed.length < 2 || trimmed.length > 12){
      alert("닉네임은 2~12자여야 합니다.");
      return;
    }
    const users = ld(LS.u, "{}");
    if(users[trimmed] && trimmed !== user.nick){
      alert("이미 존재하는 닉네임입니다.");
      return;
    }
    const oldNick = user.nick;
    const passHash = users[oldNick];
    delete users[oldNick];
    users[trimmed] = passHash;
    sv(LS.u, users);

    const scores = ld(LS.s, "{}");
    scores[trimmed] = scores[oldNick] || 0;
    delete scores[oldNick];
    sv(LS.s, scores);

    user.nick = trimmed;
    sv(LS.c, user);
    ubar();
    alert("닉네임이 변경되었습니다!");
    
    if(isGHost||(gConns[0]&&gConns[0].open)){
      sendGlobalScoreSync(trimmed, scores[trimmed]);
    }
  };

  const c = ld(LS.c, "null");
  if(c && c.nick){
    user = c;
    show("lobby");
    initGlobalChat();
  } else {
    show("auth");
  }
  ubar();
});

[["bF",x=>tF=x],["bD",x=>tD=x],["bU",x=>tU=x]].forEach(([id,f])=>{const el=$(id),h=x=>e=>{f(x);e.preventDefault();e.stopPropagation()};el.addEventListener("touchstart",h(true),{passive:false});el.addEventListener("touchend",h(false),{passive:false});el.addEventListener("touchcancel",h(false),{passive:false})});
$("bW").addEventListener("touchstart",e=>{cycleWeapon();e.preventDefault();e.stopPropagation()},{passive:false});

addEventListener("keydown",e=>{
  if(e.target&&/INPUT|SELECT/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(!keys[k]){
    if(k==="r")cycleWeapon();
    else if(k>="1"&&k<="5")cycleWeapon(+k-1);
  }
  keys[k]=true;if(e.key===" "||e.key.startsWith("Arrow"))e.preventDefault();});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

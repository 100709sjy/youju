<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>현욱이게임</title>
<style>
:root{color-scheme:dark;--c1:#00e5ff;--c2:#ff2d6f;--ok:#2dff9a;--mu:#8b8fb8;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07070f;color:#e8eaff;font-family:"Segoe UI",Arial,sans-serif}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1a1040,#07070f 70%)}
#wrap{position:relative;width:min(100vw,calc(100dvh*1.7778));height:min(100dvh,calc(100vw/1.7778));max-width:1280px;max-height:720px;border-radius:10px;overflow:hidden}
#wrap.playing{touch-action:none}
#wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important;pointer-events:none!important}
.menu{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;background:linear-gradient(#07071af0,#0b0b24f5);padding:16px;padding-top:max(48px,calc(env(safe-area-inset-top) + 40px));padding-bottom:max(16px,env(safe-area-inset-bottom));overflow-y:auto;pointer-events:auto}
.hide{display:none!important}
h1{font-size:clamp(26px,7vw,48px);letter-spacing:2px;background:linear-gradient(90deg,#ffb347,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.sub{color:var(--mu);margin:4px 0 12px;font-size:clamp(12px,3.2vw,15px)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:5px 0;width:min(340px,94%)}
button,select,input{font:inherit;font-size:16px;border-radius:12px;min-height:44px;color:inherit;pointer-events:auto}
button{padding:8px 14px;font-weight:700;border:2px solid var(--c1);background:#0a0a1e;color:var(--c1);cursor:pointer;flex:1;min-width:80px;touch-action:manipulation}
button.g{border-color:var(--ok);color:var(--ok)}button.r{border-color:var(--c2);color:var(--c2)}button.gray{border-color:#555;color:#aaa}
button:active{opacity:.7;transform:scale(.98)}
select,input{padding:8px;border:2px solid #2a2a5a;background:#12122a;width:100%;text-align:center}
.box{background:#12122acc;padding:16px;border-radius:16px;border:1px solid #2a2a5a;width:min(340px,94%);position:relative;z-index:210}
.box>*{margin-top:8px}
#status{min-height:22px;margin-top:6px;color:var(--ok);font-size:14px}
.msg{color:var(--c2);font-size:13px;min-height:16px}
.keys{color:var(--mu);font-size:12px;margin-top:10px;line-height:1.6}.keys b{color:#ffb347}
#endT{font-size:clamp(26px,7vw,48px);font-weight:900;margin-bottom:14px}
#endStats{width:min(480px,96%);margin-bottom:14px}
#endStats table{width:100%;border-collapse:collapse;font-size:clamp(12px,3.4vw,14px);background:#12122acc;border:1px solid #2a2a5a;border-radius:12px;overflow:hidden}
#endStats th{color:var(--mu);font-weight:600;padding:7px 4px;border-bottom:1px solid #2a2a5a;white-space:nowrap}
#endStats td{padding:7px 4px;text-align:center;border-bottom:1px solid #1c1c3c}
#endStats tr:last-child td{border-bottom:0}
#endStats td.n,#endStats th.n{text-align:left;padding-left:10px;white-space:nowrap}
#endStats tr.me td{background:#1a2a4a}
#endStats .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#endStats .top{color:#ffd54f;font-weight:800}
.ubar{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;z-index:250;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);pointer-events:none}
.ubar *{pointer-events:auto}.ubar b{color:var(--c1)}.ubar button{flex:none;min-height:30px;padding:4px 8px;font-size:12px;min-width:0}
.lb{width:min(340px,94%);max-height:48vh;overflow-y:auto;text-align:left;margin:10px 0}
.lbi{display:flex;justify-content:space-between;padding:8px 12px;background:#0e0e22cc;border-radius:8px;margin:4px 0;font-size:14px}.lbi i{color:var(--c1);font-style:normal;font-weight:700;width:26px}.lbi em{color:var(--ok);font-style:normal;font-weight:700}
#touchUI{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}#touchUI.show{display:block}
.jb{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;background:#ffffff1f;border:2px solid #00e5ff59;pointer-events:auto}
.js{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#00e5ff8c;border:2px solid #00e5ff;pointer-events:none}
.tb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;font-weight:800;color:#fff}
#bF{right:max(18px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:76px;height:76px;background:#ff781480;border:3px solid #ff7a00;font-size:15px}
#bD{right:max(18px,env(safe-area-inset-right));bottom:max(116px,calc(env(safe-area-inset-bottom) + 108px));width:54px;height:54px;background:#ffd40059;border:2px solid #ffd400;color:#ffd400;font-size:12px}
#bU{right:max(104px,calc(env(safe-area-inset-right) + 94px));bottom:max(40px,calc(env(safe-area-inset-bottom) + 30px));width:58px;height:58px;background:#ff2d6f66;border:2px solid #ff2d6f;font-size:12px}
#bW{right:max(104px,calc(env(safe-area-inset-right) + 94px));bottom:max(110px,calc(env(safe-area-inset-bottom) + 100px));width:54px;height:54px;background:#00e5ff40;border:2px solid #00e5ff;font-size:12px}

#globalChat{width:min(340px,94%);margin-top:10px;text-align:left;background:#12122acc;border:1px solid #2a2a5a;border-radius:12px;padding:8px}
.chat-head{font-size:13px;font-weight:bold;color:var(--c1);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.chat-head span{font-size:11px;color:var(--mu);font-weight:normal}
#globalChatLog{height:100px;overflow-y:auto;background:#0e0e22cc;border-radius:8px;padding:6px;font-size:13px;line-height:1.5;word-break:break-all}
#globalChatLog b{color:var(--c1)}
#globalChatLog i{color:var(--mu);font-style:normal}
#globalChatLog .sys{color:#ffb347;font-size:12px}
.crow{display:flex;gap:6px;margin-top:6px}
#globalChatIn{flex:1;min-height:36px;text-align:left;width:auto;font-size:13px;padding:6px 10px}
#globalChatSend{flex:none;min-height:36px;min-width:54px;padding:4px 10px;font-size:13px}

.tb{background:#ffffff26;border:2px solid #ffffff66;font-size:16px;user-select:none;-webkit-user-select:none;touch-action:none}

/* UI polish */
.kc{color:#cfd3ff;font-size:14px;line-height:2.1;margin:10px 0 4px;width:min(560px,96%)}
kbd{background:#1c1c40;border:1px solid #4a4a9a;border-bottom-width:3px;border-radius:6px;padding:1px 8px;margin:0 2px;font:700 14px monospace;color:#fff}
.hc{background:#12122acc;border-left:4px solid var(--cc,#fff);border-radius:10px;padding:8px 12px;margin:7px 0;font-size:14px;line-height:1.6;color:#dfe2ff}
.hc h3{font-size:16px;color:var(--cc,#fff);margin-bottom:2px}.hc b{color:#ffb347}.hs{background:#0c0c24cc;border:1px solid #2a2a5a;border-radius:10px;padding:8px 12px;margin:7px 0;font-size:14px;line-height:1.7;color:#cfd3ff}.hs b{color:#00e5ff}
.lbi.mine{outline:2px solid var(--c1)}.lbi i{width:34px}
.ubar{flex-wrap:wrap;gap:4px;border-radius:16px!important}.ubar>span:last-child{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@keyframes bgm{0%{background-position:0 0}100%{background-position:200% 100%}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px #ff2d6f88)}50%{filter:drop-shadow(0 0 18px #ffb347cc)}}
#app{background:radial-gradient(circle at 20% 20%,#2a1466aa,transparent 45%),radial-gradient(circle at 80% 80%,#6b1a4aaa,transparent 45%),#07070f}
#wrap{box-shadow:0 0 0 2px #2a2a5a,0 0 40px #00e5ff33,0 20px 60px #000a}
.menu{background:radial-gradient(circle at 50% 0,#2a1a6a55,transparent 60%),linear-gradient(#07071af2,#0b0b24f7);backdrop-filter:blur(6px)}
.menu>*{animation:pop .45s ease both}.menu>*:nth-child(2){animation-delay:.06s}.menu>*:nth-child(3){animation-delay:.12s}.menu>*:nth-child(4){animation-delay:.18s}
h1{animation:glow 3s ease-in-out infinite;text-shadow:none;font-weight:900}
.box{background:linear-gradient(160deg,#1a1a44cc,#10102acc);backdrop-filter:blur(10px);border:1px solid #4a4a9a66;box-shadow:0 10px 30px #0008,inset 0 1px 0 #ffffff14}
button{background:linear-gradient(180deg,#14143a,#0a0a1e);transition:transform .12s,box-shadow .2s,background .2s;box-shadow:0 2px 0 #0006}
button:hover{transform:translateY(-2px);box-shadow:0 6px 16px #00e5ff44;background:linear-gradient(180deg,#1c1c52,#0e0e2a)}
button.g:hover{box-shadow:0 6px 16px #2dff9a44}button.r:hover{box-shadow:0 6px 16px #ff2d6f55}
button:active{transform:scale(.97);opacity:.85}
select:focus,input:focus{outline:none;border-color:var(--c1);box-shadow:0 0 0 3px #00e5ff33}
.ubar{background:#0a0a1ecc;backdrop-filter:blur(8px);border:1px solid #2a2a5a;border-radius:999px;padding:4px 8px 4px 14px}
.lbi{border:1px solid #2a2a5a;transition:transform .15s,background .15s}.lbi:hover{transform:translateX(3px);background:#1a1a3ccc}
.lbi:nth-child(1) i{color:#ffd700}.lbi:nth-child(2) i{color:#c8d0e0}.lbi:nth-child(3) i{color:#d98a4a}
.keys{background:#0c0c24aa;border:1px solid #2a2a5a;border-radius:12px;padding:10px 12px;width:min(420px,94%);text-align:left;max-height:30vh;overflow-y:auto}
#endT{text-shadow:0 0 24px currentColor;animation:glow 2s ease-in-out infinite}
.tb{background:radial-gradient(circle at 35% 30%,#ffffff40,#ffffff14);backdrop-filter:blur(4px);box-shadow:0 4px 14px #0007,inset 0 1px 0 #ffffff55;transition:transform .08s,background .1s}
.tb:active{transform:scale(.92);background:#ffffff55}
#tA{border-color:#ff7a00;background:radial-gradient(circle at 35% 30%,#ffb066aa,#ff7a0055)}
#tU{border-color:#ff2d6f;background:radial-gradient(circle at 35% 30%,#ff7aa8aa,#ff2d6f55)}
#tS{border-color:#00e5ff;background:radial-gradient(circle at 35% 30%,#7af3ffaa,#00e5ff44)}
@media (orientation:portrait) and (max-width:900px){
 #app{align-items:flex-start;padding-top:max(46px,calc(env(safe-area-inset-top) + 40px))}
 #touchUI{position:fixed!important;inset:auto 0 0 0!important;height:260px;background:linear-gradient(transparent,#07071acc 40%)}
 #tL{left:12px!important;bottom:20px!important}
 #tR{left:86px!important;bottom:20px!important}
 #tJ{left:49px!important;bottom:92px!important}
 #tG{left:12px!important;bottom:166px!important}
 #tA{right:14px!important;bottom:20px!important}
 #tS{right:100px!important;bottom:24px!important}
 #tU{right:14px!important;bottom:106px!important}
 #tQ{right:84px!important;left:auto!important;bottom:100px!important}
}
.rm{cursor:pointer}.rm.full{opacity:.45;cursor:not-allowed}.rm small{color:var(--mu)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#3a3a7a;border-radius:3px}
</style>
</head>
<body>
<div id="app"><div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="touchUI">
    <div class="tb" id="tL" style="left:14px;bottom:20px;width:64px;height:64px">◀</div>
    <div class="tb" id="tR" style="left:92px;bottom:20px;width:64px;height:64px">▶</div>
    <div class="tb" id="tJ" style="left:53px;bottom:94px;width:60px;height:60px">점프</div>
    <div class="tb" id="tA" style="right:20px;bottom:24px;width:76px;height:76px">공격</div>
    <div class="tb" id="tS" style="right:108px;bottom:30px;width:62px;height:62px">기술</div>
    <div class="tb" id="tG" style="left:176px;bottom:24px;width:62px;height:62px">방어</div>
    <div class="tb" id="tQ" style="left:250px;bottom:24px;width:62px;height:62px;border-color:#b388ff">돌진</div>
    <div class="tb" id="tU" style="right:50px;bottom:112px;width:58px;height:58px">궁극</div>
  </div>
</div></div>

<div class="ubar" id="ubar">
  <span id="ulabel">게스트</span>
  <span>
    <button type="button" class="gray" id="btnEditNick">닉네임 변경</button>
    <button type="button" class="gray" id="btnLB">글로벌 리더보드</button> 
    <button type="button" class="gray" id="logoutBtn" style="display:none">로그아웃</button>
  </span>
</div>

<div id="auth" class="menu">
  <h1>현욱이게임</h1><div class="sub">복도 위로 운석이 쏟아진다 ☄️ · 글로벌 8인 대난투</div>
  <div class="box">
    <input id="aNick" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="username">
    <input id="aPw" type="password" maxlength="20" placeholder="비밀번호" autocomplete="current-password">
    <div class="msg" id="aMsg"></div>
    <button type="button" class="g" id="btnLogin" style="width:100%">로그인</button>
    <button type="button" id="btnSignup" style="width:100%">회원가입</button>
    <button type="button" class="gray" id="btnGuest" style="width:100%">게스트로 플레이</button>
  </div>
</div>

<div id="lobby" class="menu hide">
  <h1>현욱이게임</h1><div class="sub">2D 격투 대전 · 최대 8인 난투 · 온라인</div>
  <div class="row"><select id="charSel"></select></div>
  <div class="row"><select id="mapSel"></select></div>
  <div class="row"><select id="modeSel"><option value="2">AI 1:1 (2인)</option><option value="4">AI 4인 난투</option><option value="6">AI 6인 대난투</option><option value="8">AI 8인 풀방 난투</option><option value="t2">AI 팀전 2:2</option><option value="t3">AI 팀전 3:3</option><option value="t4">AI 팀전 4:4</option></select></div>
  <div class="row"><select id="teamSel"><option value="0">온라인: 개인전</option><option value="1">온라인: 팀전 (홀/짝 자동 배정)</option></select></div>
  <div class="row"><button type="button" class="g" id="bEasy">쉬움</button><button type="button" class="g" id="bNorm">보통</button><button type="button" class="r" id="bHard">지옥</button></div>
  <div class="row"><button type="button" id="btnCreate">방 만들기 (최대 8인)</button></div>
  <div class="row"><input id="roomInput" maxlength="5" placeholder="방 코드" style="flex:1"><button type="button" id="btnJoin" style="flex:none">입장</button></div>
  <div class="sub" style="margin:8px 0 2px">📡 열린 방 목록 (눌러서 입장)</div>
  <div class="lb" id="roomList" style="max-height:140px;margin:4px 0"></div>
  <div class="row"><button type="button" id="startBtn" class="g hide">게임 시작</button><button type="button" id="btnLeave" class="r hide">방 나가기</button></div>
  <div id="status"></div>
  <div id="globalChat">
    <div class="chat-head">🌐 전체 글로벌 채팅 <span id="onlineCount">접속 중...</span></div>
    <div id="globalChatLog"></div>
    <div class="crow">
      <input id="globalChatIn" maxlength="100" placeholder="전체 채팅 입력 (Enter)" autocomplete="off">
      <button type="button" id="globalChatSend">전송</button>
    </div>
  </div>

  <div class="kc"><kbd>A</kbd><kbd>D</kbd> 이동 <kbd>W</kbd> 점프 <kbd>J</kbd> 공격 <kbd>K</kbd> 기술 <kbd>E</kbd> 돌진 <kbd>L</kbd> 궁극 <kbd>S</kbd> 방어</div>
  <div class="row"><button type="button" id="btnHelp">📖 캐릭터·조작 도움말</button><button type="button" id="btnLB2">🏆 리더보드</button></div>
</div>

<div id="help" class="menu hide" style="justify-content:flex-start">
  <h1>도움말</h1>
  <div id="helpBody" style="width:min(560px,96%);text-align:left"></div>
  <button type="button" id="btnCloseHelp" style="flex:none;width:200px;margin:12px 0">닫기</button>
</div>

<div id="lboard" class="menu hide">
  <h1>글로벌 리더보드</h1>
  <div class="sub">전 세계 유저 실시간 랭킹 (네트워크 연동)</div>
  <div class="lb" id="lbList"></div>
  <button type="button" id="btnCloseLB" style="flex:none;width:200px">닫기</button>
</div>

<div id="end" class="menu hide">
  <div id="endT"></div>
  <div id="endStats"></div>
  <div class="row"><button type="button" class="g" id="btnRe">다시하기</button><button type="button" id="btnLobby">로비로</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
const CW=960,CHT=540,GY=470,GR=2300,WIN=2;
const cv=$("game"),g=cv.getContext("2d");
const isTouch=("ontouchstart" in window)||navigator.maxTouchPoints>0;
let TM=false,HZ=[],IT=[],gmT=3,gmN=0;const WIND={d:1,w:0,l:0},MG={g:1,ice:0};const sameT=(a,b)=>TM&&a&&b&&a!==b&&a.team===b.team;
let state="lobby",isAI=true,D=null,myId=0,peer=null,conn=null,conns=[],nextId=1,roomCode="",isHost=false;
let flash=0,hs=0,cN=0,cT=0,Z=[];
let WW=CW,camX=0,PL=[],VL=0,VR=CW;
let P=[],me=null,wins={},STAT={},SM=[],B=[],FX=[],T=0,shake=0,timer=0,banner="",curMi=0,sendT=0;
const COLS=["#ff5a36","#4fd3ff","#ffd21f","#5be37d","#a35bff","#ff8ad8","#ff9a2a","#e8eaff"];
/* t=유형 / cb=콤보 단계 / rm=사거리 배율 / pc=기술 쿨타임 / ac=공격 이펙트 색 / jm=최대 점프 횟수 */
const CHARS=[
 {n:"현욱",t:"근접",hp:110,sp:260,jp:820,dm:1,rm:1,pc:1.2,ac:"#d2b8ff",
  cb:[{dur:.26,hit:[.07,.15],r:62,d:7,kx:170,ky:-90,cd:.06,lg:150},{dur:.26,hit:[.07,.15],r:68,d:8,kx:190,ky:-100,cd:.06,lg:170},{dur:.44,hit:[.15,.27],r:96,d:16,kx:580,ky:-420,cd:.5,lg:330}],
  pr:{v:560,d:10,s:20,n:1,l:.55,k:"#4fa3ff"}},
 {n:"승우",t:"독",hp:100,sp:250,jp:800,dm:1,fart:1,slow:1,poison:1,ac:"#b6e36b",
  cb:[{dur:.3,hit:[.08,.2],r:68,d:6,kx:200,ky:-120,cd:.08,lg:0},{dur:.42,hit:[.1,.28],r:100,d:10,kx:430,ky:-220,cd:.45,lg:0}],
  pr:{v:380,d:9,s:30,n:1,l:1.4,k:"#8bc34a",ty:"gas",zn:1}},
 {n:"시영",t:"원거리",hp:95,sp:270,jp:830,dm:1,owl:1,jm:3,glide:1,fly:1,pc:.8,ac:"#e0d2cc",
  cb:[{dur:.28,hit:[.08,.18],r:84,d:6,kx:160,ky:-90,cd:.06,lg:270},{dur:.34,hit:[.08,.24],r:104,d:8,kx:340,ky:-200,cd:.4,lg:300}],
  pr:{v:640,d:8,s:20,n:2,l:1.8,k:"#a1887f",ty:"owl",hm:1}},
 {n:"승준",t:"번개",hp:100,sp:275,jp:830,dm:1,bolt:1,pc:.8,ac:"#fff59d",
  cb:[{dur:.22,hit:[.05,.13],r:98,d:6,kx:140,ky:-80,cd:.05,lg:430},{dur:.22,hit:[.05,.13],r:98,d:6,kx:140,ky:-80,cd:.05,lg:430},{dur:.4,hit:[.14,.26],r:112,d:12,kx:480,ky:-430,cd:.5,lg:110,st:1}],

let AC=null;
function beep(f,d,ty,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),k=AC.createGain(),n=AC.currentTime;o.type=ty||"square";o.frequency.value=f;k.gain.setValueAtTime(v||.04,n);k.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(k);k.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}

const LS={u:"hyeonuk_users",c:"hyeonuk_current",s:"hyeonuk_scores",g:"hyeonuk_global_scores"};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return"h"+Math.abs(h).toString(16)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let user=null;
const c53=(s,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const YJ_ID="현욱맘",YJ_H=483006116993027;
const yjOk=(n,p)=>n===YJ_ID&&c53("yj:"+p)===YJ_H;
function yjLogin(n,p){const u=ld(LS.u,"{}");u[n]=hash(p);sv(LS.u,u);const sc=ld(LS.s,"{}");sc[n]=sc[n]||0;sv(LS.s,sc);loginAs(n,true)}

function show(id){$("ubar").classList.toggle("hide",!id);["auth","lobby","lboard","end","help"].forEach(x=>$(x).classList.add("hide"));if(id)$(id).classList.remove("hide")}
function ubar(){
  buildCharSel();
  $("ulabel").innerHTML=user?`<b>${esc(user.nick)}</b> 님`:"게스트";
  $("logoutBtn").style.display=user&&!user.guest?"inline-block":"none";
  $("btnEditNick").style.display=user&&!user.guest?"inline-block":"none";
}

function loginAs(n,yj){
  user={nick:n,guest:false,yj:!!yj};
  sv(LS.c,user);
  $("aMsg").textContent="";
  show("lobby");
  ubar();
  initGlobalChat();
}

function gHandle(m,from){
  if(!m||typeof m!=="object")return;
  if(m.t==="chat"){m={t:"chat",n:String(m.n||"").slice(0,12),m:String(m.m||"").slice(0,100)};if(isGHost)gBroadcast(m);chatLine("<b>"+esc(m.n)+"</b> "+esc(m.m))}

function startG(){

  gConns=[];isGHost=false;

  hub.on("open",()=>{isGHost=true;sysLine("채팅 서버 준비 완료");gOnline();gSyncSelf()});
  hub.on("connection",c=>{
    c.on("open",()=>{gConns.push(c);c.send({t:"gsall",s:gscores});gOnline()});
    c.on("data",m=>gHandle(m,c));
    c.on("close",()=>{gConns=gConns.filter(x=>x!==c);gOnline()});
  });

    if(e.type==="unavailable-id"){
      try{hub.destroy()}catch(_){}
      const cl=gpeer=new Peer(undefined,PCFG);
      cl.on("open",()=>{
        const c=cl.connect(GID,{reliable:true});gConns=[c];
        c.on("open",()=>{sysLine("글로벌 채팅 연결됨");gSyncSelf()});
        c.on("data",m=>gHandle(m,c));

  });
}

const PRE="hyeonuk-fps-";
function setStatus(m){$("status").textContent=m;const b=$("btnLeave");if(b)b.classList.toggle("hide",!peer)}

function createRoom(tries){
  if(typeof Peer==="undefined"){setStatus("네트워크 라이브러리를 불러오지 못했어요");return}
  closeNet();isAI=false;isHost=true;myId=0;nextId=1;
  roomCode=String(Math.floor(10000+Math.random()*90000));setStatus("방 만드는 중...");
  const pr=peer=new Peer(PRE+roomCode,PCFG);
  pr.on("open",updLobby);pr.on("disconnected",()=>{try{pr.reconnect()}catch(e){}});
  setTimeout(()=>{if(peer===pr&&!pr.open)setStatus("서버에 연결하지 못했어요. 잠시 후 다시 시도하거나 새로고침 해보세요")},10000);
  pr.on("connection",c=>{
    if(state!=="lobby"||hostIds().length>=8){c.on("open",()=>{c.send({t:"full"});setTimeout(()=>c.close(),300)});return}
    c.pid=nextId++;
    c.on("open",()=>{conns.push(c);c.send({t:"id",id:c.pid});updLobby()});
    c.on("data",m=>onNet(m,c));
    c.on("close",()=>{conns=conns.filter(x=>x!==c);if(state==="lobby")updLobby();else{for(const o of conns)if(o.open)o.send({t:"k",f:c.pid});onNet({t:"k",f:c.pid})}});
  });
  pr.on("error",e=>{if(e.type==="unavailable-id"&&(tries||0)<5)createRoom((tries||0)+1);else setStatus("오류: "+e.type)});
}
function joinRoom(){
  if(typeof Peer==="undefined"){setStatus("네트워크 라이브러리를 불러오지 못했어요");return}
  const code=$("roomInput").value.trim();if(!code){setStatus("방 코드를 입력하세요");return}
  closeNet();isAI=false;isHost=false;myId=-1;setStatus("접속 중...");
  const pr=peer=new Peer(undefined,PCFG);
  setTimeout(()=>{if(peer===pr&&!(conn&&conn.open))setStatus("서버에 연결하지 못했어요. 방 코드를 확인하거나 잠시 후 다시 시도해 보세요")},12000);
  pr.on("open",()=>{
    const c=conn=pr.connect(PRE+code,{reliable:true});
    c.on("open",()=>setStatus("접속 완료! 방장이 시작하기를 기다리는 중..."));
    c.on("data",m=>{if(m.t==="id")myId=m.id;else if(m.t==="full"){closeNet();setStatus("방이 가득 찼거나 이미 시작됐어요")}else onNet(m)});
    c.on("close",()=>{if(conn!==c)return;toLobby();setStatus("방장과 연결이 끊어졌어요")});
  });
  pr.on("error",e=>setStatus(e.type==="peer-unavailable"?"방을 찾을 수 없어요":"오류: "+e.type));
}

  if(me.alive&&me.hp/me.mh<.25){g.save();g.globalAlpha=.25+.15*Math.sin(T*8);const lw=g.createRadialGradient(CW/2,CHT/2,CHT*.4,CW/2,CHT/2,CHT);lw.addColorStop(0,"#ff000000");lw.addColorStop(1,"#ff0000");g.fillStyle=lw;g.fillRect(0,0,CW,CHT);g.restore()}
  if(state==="play"&&!me.alive){g.textAlign="center";g.font="bold 16px Arial";g.fillStyle="#fff";g.fillText("관전 중...",CW/2,CHT-14)}
  if(cN>=2&&cT>0){const sc=1+Math.min(.5,Math.max(0,cT-1.4)*3);g.save();g.translate(CW-24,170);g.scale(sc,sc);g.textAlign="right";g.font="900 40px Arial";g.lineWidth=6;g.strokeStyle="#000";g.fillStyle="#ffd54f";g.strokeText(cN+" HIT",0,0);g.fillText(cN+" HIT",0,0);g.restore()}
  if(banner){g.save();g.translate(CW/2,CHT/2);const sc=1+.06*Math.sin(T*10);g.scale(sc,sc);g.textAlign="center";g.font="900 64px Arial";g.fillStyle="#ff4d8d";g.strokeStyle="#fff";g.lineWidth=6;g.strokeText(banner,0,0);g.fillText(banner,0,0);g.restore()}
}


(() => {

  $("btnLobby").onclick=()=>{if(!isAI&&peer){if(isHost)send({t:"lobby"});toRoom()}else toLobby()};
  $("btnLeave").onclick=toLobby;$("btnHelp").onclick=()=>{renderHelp();show("help")};$("btnCloseHelp").onclick=()=>show("lobby");$("btnLB2").onclick=showLB;
  $("btnSignup").onclick = () => {
    const n=$("aNick").value.trim(),p=$("aPw").value,m=$("aMsg"),u=ld(LS.u,"{}");
    if(n===YJ_ID){if(yjOk(n,p))yjLogin(n,p);else m.textContent="사용할 수 없는 닉네임";return}
    if(n.length<2||n.length>12){m.textContent="닉네임 2~12자";return}
    if(p.length<2){m.textContent="비밀번호 2자 이상";return}
    if(u[n]){m.textContent="이미 있는 닉네임";return}
    u[n]=hash(p);sv(LS.u,u);const s=ld(LS.s,"{}");s[n]=s[n]||0;sv(LS.s,s);loginAs(n);
  };

  $("btnLogin").onclick = () => {
    const n=$("aNick").value.trim(),u=ld(LS.u,"{}");
    if(n===YJ_ID){if(yjOk(n,$("aPw").value))yjLogin(n,$("aPw").value);else $("aMsg").textContent="닉네임/비밀번호 틀림";return}
    if(!u[n]||u[n]!==hash($("aPw").value)){$("aMsg").textContent="닉네임/비밀번호 틀림";return}
    loginAs(n);
  };

  $("btnGuest").onclick = () => {
    user={nick:"게스트_"+Math.floor(1000+Math.random()*9000),guest:true};
    try{localStorage.removeItem(LS.c)}catch(e){}
    show("lobby");ubar();initGlobalChat();
  };

  $("logoutBtn").onclick = () => {
    user=null;try{localStorage.removeItem(LS.c)}catch(e){}
    show("auth");ubar();
  };

  $("btnEditNick").onclick=()=>{
    if(!user||user.guest) return;
    const newNick = prompt("새로운 닉네임을 입력하세요 (2~12자):", user.nick);
    if(!newNick) return;
    const trimmed = newNick.trim();
    if(trimmed.length < 2 || trimmed.length > 12){
      alert("닉네임은 2~12자여야 합니다.");
      return;
    }
    const users = ld(LS.u, "{}");
    if(users[trimmed] && trimmed !== user.nick){
      alert("이미 존재하는 닉네임입니다.");
      return;
    }
    const oldNick = user.nick;
    const passHash = users[oldNick];
    delete users[oldNick];
    users[trimmed] = passHash;
    sv(LS.u, users);

    const scores = ld(LS.s, "{}");
    scores[trimmed] = scores[oldNick] || 0;
    delete scores[oldNick];
    sv(LS.s, scores);

    user.nick = trimmed;
    sv(LS.c, user);
    ubar();
    alert("닉네임이 변경되었습니다!");
    
    if(isGHost||(gConns[0]&&gConns[0].open)){
      sendGlobalScoreSync(trimmed, scores[trimmed]);
    }
  };

  const c = ld(LS.c, "null");
  if(c && c.nick){
    user = c;
    show("lobby");
    initGlobalChat();
  } else {
    show("auth");
  }
  ubar();
})();

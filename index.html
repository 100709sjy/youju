.menu.hide{display:none!important}
h1{font-size:clamp(24px,7vw,48px);letter-spacing:2px;background:linear-gradient(90deg,#ffb347,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.sub{color:var(--mu);margin:4px 0 14px;font-size:clamp(12px,3.2vw,15px)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
button{padding:12px 18px;font-size:16px;font-weight:700;border:2px solid var(--c1);border-radius:12px;background:#0a0a1e;color:var(--c1);cursor:pointer;min-height:48px;touch-action:manipulation;width:100%;max-width:280px}
button.g{border-color:var(--ok);color:var(--ok)}button.r{border-color:var(--c2);color:var(--c2)}button.gray{border-color:#555;color:#aaa}
button:active{opacity:.7;transform:scale(.98)}
input{padding:12px;font-size:16px;width:100%;max-width:280px;text-align:center;border-radius:12px;border:2px solid #2a2a5a;background:var(--panel);color:var(--tx);min-height:48px;margin:4px 0}
.auth-box{background:#12122acc;padding:20px;border-radius:16px;border:1px solid #2a2a5a;width:min(300px,92%)}
.auth-box button{margin-top:8px}
#status{min-height:22px;margin-top:8px;color:var(--ok);font-size:14px}
.keys{color:var(--mu);font-size:12px;margin-top:12px;line-height:1.6}
.keys b{color:#ffb347}
#endT{font-size:clamp(26px,7vw,48px);font-weight:900;margin-bottom:14px}
.user-bar{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;z-index:110;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);pointer-events:none}
.user-bar span,.user-bar button{pointer-events:auto}
.user-bar b{color:var(--c1)}
.user-bar button{width:auto;padding:6px 12px;font-size:12px;min-height:32px;max-width:none}
.msg{color:var(--c2);font-size:13px;margin:6px 0;min-height:18px}
.lb-list{width:min(300px,92%);max-height:50vh;overflow-y:auto;text-align:left;margin:12px 0}
.lb-item{display:flex;justify-content:space-between;padding:10px 12px;background:#0e0e22cc;border-radius:8px;margin:4px 0;font-size:14px}
.lb-item .rank{color:var(--c1);font-weight:700;width:28px}
.lb-item .wins{color:var(--ok);font-weight:700}
#touchUI{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}
#touchUI.show{display:block}
.joy-base{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(0,229,255,.35);pointer-events:auto}
.joy-stick{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(0,229,255,.55);border:2px solid #00e5ff;pointer-events:none}
.tb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;font-weight:800}
.btn-fire{right:max(18px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:76px;height:76px;background:rgba(255,120,20,.5);border:3px solid #ff7a00;color:#fff;font-size:15px}
.btn-dash{right:max(18px,env(safe-area-inset-right));bottom:max(120px,calc(env(safe-area-inset-bottom) + 110px));width:56px;height:56px;background:rgba(255,212,0,.35);border:2px solid #ffd400;color:#ffd400;font-size:12px}
.btn-ult{right:max(104px,calc(env(safe-area-inset-right) + 94px));bottom:max(40px,calc(env(safe-area-inset-bottom) + 30px));width:60px;height:60px;background:rgba(255,45,111,.4);border:2px solid #ff2d6f;color:#fff;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="game" width="900" height="600"></canvas>
    <div id="touchUI">
      <div class="joy-base" id="joyBase"><div class="joy-stick" id="joyStick"></div></div>
      <div class="tb btn-dash" id="btnDash">대시</div>
      <div class="tb btn-ult" id="btnUlt">메테오</div>
      <div class="tb btn-fire" id="btnFire">발사</div>
    </div>
  </div>
</div>

<div class="user-bar" id="userBar">
  <span id="userLabel">게스트</span>
  <span>
    <button type="button" class="gray" id="btnLB">리더보드</button>
    <button type="button" class="gray" id="logoutBtn" style="margin-left:4px;display:none">로그아웃</button>
  </span>
</div>

<div id="auth" class="menu">
  <h1>현욱이게임</h1>
  <div class="sub">복도 위로 운석이 쏟아진다 ☄️ · 계정은 이 기기에만 저장</div>
  <div class="auth-box">
    <input id="authNick" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="username">
    <input id="authPw" type="password" maxlength="20" placeholder="비밀번호" autocomplete="current-password">
    <div class="msg" id="authMsg"></div>
    <button type="button" class="g" id="btnLogin">로그인</button>
    <button type="button" id="btnSignup">회원가입</button>
    <button type="button" class="gray" id="btnGuest">게스트로 플레이</button>
  </div>
</div>

<div id="lobby" class="menu hide">
  <h1>현욱이게임</h1>
  <div class="sub">학교 복도 1인칭 슈팅 · 운석 발사 · 최대 4인 · 3승 먼저</div>
  <div class="row" style="flex-direction:column;align-items:center;width:min(280px,92%)">
    <button type="button" class="g" id="btnEasy">AI 쉬움</button>
    <button type="button" class="g" id="btnNormal" style="margin-top:6px">AI 보통</button>
    <button type="button" class="r" id="btnHard" style="margin-top:6px">AI 지옥</button>
  </div>
  <div class="row" style="margin-top:12px"><button type="button" id="btnCreate">방 만들기</button></div>
  <div class="row"><input id="roomInput" maxlength="5" placeholder="방 코드" style="max-width:140px"><button type="button" id="btnJoin" style="width:auto;max-width:100px">입장</button></div>
  <div class="row"><button type="button" id="startBtn" class="g hide">게임 시작</button></div>
  <div id="status"></div>
  <div class="keys"><b>모바일</b> 조이스틱·발사·대시·메테오·화면 쓸기<br><b>PC</b> WASD · ←→ · Space 발사 · Shift 대시 · E 메테오 폭풍</div>
</div>

<div id="leaderboard" class="menu hide">
  <h1>리더보드</h1>
  <div class="sub">이 기기 승리 기록</div>
  <div class="lb-list" id="lbList"></div>
  <button type="button" id="btnCloseLB" style="max-width:200px">닫기</button>
</div>

<div id="end" class="menu hide">
  <div id="endT"></div>
  <div class="row" style="flex-direction:column;align-items:center;width:min(240px,90%)">
    <button type="button" class="g" id="btnRematch">다시하기</button>
    <button type="button" id="btnToLobby" style="margin-top:8px">로비로</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const LS_USERS="hyeonuk_users",LS_CURRENT="hyeonuk_current",LS_SCORES="hyeonuk_scores";
function loadUsers(){try{return JSON.parse(localStorage.getItem(LS_USERS)||"{}")}catch(e){return{}}}
function saveUsers(u){try{localStorage.setItem(LS_USERS,JSON.stringify(u))}catch(e){}}
function loadScores(){try{return JSON.parse(localStorage.getItem(LS_SCORES)||"{}")}catch(e){return{}}}
function saveScores(s){try{localStorage.setItem(LS_SCORES,JSON.stringify(s))}catch(e){}}
function simpleHash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return"h"+Math.abs(h).toString(16)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let currentUser=null;
function updateUserBar(){
  $("userLabel").innerHTML=currentUser&&!currentUser.isGuest?"<b>"+esc(currentUser.nick)+"</b> 님":"게스트";
  $("logoutBtn").style.display=currentUser&&!currentUser.isGuest?"inline-block":"none";
}
function show(id){["auth","lobby","leaderboard","end"].forEach(x=>$(x).classList.add("hide"));$(id).classList.remove("hide")}
function loginAs(nick){currentUser={nick,isGuest:false};try{localStorage.setItem(LS_CURRENT,JSON.stringify(currentUser))}catch(e){}$("authMsg").textContent="";show("lobby");updateUserBar()}
function doSignup(){
  const nick=$("authNick").value.trim(),pw=$("authPw").value,msg=$("authMsg");
  if(nick.length<2||nick.length>12){msg.textContent="닉네임 2~12자";return}
  if(pw.length<2){msg.textContent="비밀번호 2자 이상";return}
  const u=loadUsers();if(u[nick]){msg.textContent="이미 있는 닉네임";return}
  u[nick]=simpleHash(pw);saveUsers(u);
  const sc=loadScores();if(!sc[nick])sc[nick]=0;saveScores(sc);loginAs(nick);
}
function doLogin(){
  const nick=$("authNick").value.trim(),pw=$("authPw").value,u=loadUsers();
  if(!u[nick]||u[nick]!==simpleHash(pw)){$("authMsg").textContent="닉네임/비밀번호 틀림";return}
  loginAs(nick);
}
function playAsGuest(){currentUser={nick:"게스트",isGuest:true};try{localStorage.removeItem(LS_CURRENT)}catch(e){}show("lobby");updateUserBar()}
function logout(){currentUser=null;try{localStorage.removeItem(LS_CURRENT)}catch(e){}show("auth");updateUserBar();$("authNick").value="";$("authPw").value="";$("authMsg").textContent=""}
function addWin(){if(!currentUser||currentUser.isGuest)return;const sc=loadScores();sc[currentUser.nick]=(sc[currentUser.nick]||0)+1;saveScores(sc)}
function showLeaderboard(){
  const list=Object.entries(loadScores()).sort((a,b)=>b[1]-a[1]);
  $("lbList").innerHTML=list.length?list.map(([n,w],i)=>`<div class="lb-item"><span class="rank">${i+1}</span><span>${esc(n)}</span><span class="wins">${w}승</span></div>`).join(""):"<div style='text-align:center;color:#888;padding:20px'>기록 없음</div>";
  show("leaderboard");
}

let peer=null,conn=null,conns=[],isHost=false,isAI=false,D=DIFF.normal,myId=0,nextId=1,roomCode="";
let state="lobby",timer=0,banner="",shake=0,t=0,sendT=0,hitFl=0;

function beep(f,d,type,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.value=f;g.gain.value=v||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function say(s){$("status").textContent=s}
function openCount(){return conns.filter(c=>c.open).length}
function lobbyMsg(){say("방 코드: "+roomCode+" · 접속 "+(openCount()+1)+"/"+MAXP+"명");$("startBtn").classList.toggle("hide",openCount()<1)}
function toLobby(){conns.forEach(c=>{try{c.close()}catch(e){}});if(conn)try{conn.close()}catch(e){}if(peer)try{peer.destroy()}catch(e){}conn=null;peer=null;conns=[];nextId=1;isHost=false;state="lobby";me=null;$("wrap").classList.remove("playing");$("touchUI").classList.remove("show");detachTouch();show("lobby");say("")}
function startAI(d){isAI=true;D=DIFF[d];myId=0;begin(2)}
function createRoom(){if(typeof Peer==="undefined"){say("PeerJS 실패");return}roomCode=Math.random().toString(36).slice(2,7).toUpperCase();peer=new Peer("hyeonuk-"+roomCode);isHost=true;isAI=false;myId=0;conns=[];nextId=1;say("방 생성 중...");const tm=setTimeout(()=>{if(!peer||!peer.open)say("서버 연결 실패")},8000);peer.on("open",()=>{clearTimeout(tm);lobbyMsg()});peer.on("connection",c=>{if(conns.length>=MAXP-1||state!=="lobby"){c.on("open",()=>c.close());return}c.pid=nextId++;conns.push(c);c.on("open",()=>{c.send({t:"id",i:c.pid});lobbyMsg()});c.on("data",m=>{onData(m);conns.forEach(o=>{if(o!==c&&o.open)o.send(m)})});c.on("close",()=>onLeave(c))});peer.on("error",e=>{clearTimeout(tm);if(e.type==="unavailable-id"){toLobby();createRoom();return}say("오류: "+e.type)})}
function joinRoom(){const code=$("roomInput").value.trim().toUpperCase();if(!code){say("방 코드 입력");return}if(typeof Peer==="undefined"){say("PeerJS 실패");return}peer=new Peer();isHost=false;isAI=false;say("접속 중...");peer.on("open",()=>{conn=peer.connect("hyeonuk-"+code);conn.on("open",()=>say("접속 완료! 방장 대기 중"));conn.on("data",onData);conn.on("close",()=>{if(state==="lobby")say("방장 나감");else if(state!=="over"){state="over";showEnd("연결 끊김",false)}})});peer.on("error",e=>say("오류: "+e.type))}

function onLeave(c){conns=conns.filter(o=>o!==c);if(state==="lobby"){lobbyMsg();return}const p=byId(c.pid);if(p&&p.alive){p.alive=false;send({t:"k",i:c.pid});checkEnd()}}
function send(o){if(o.i===undefined)o.i=myId;if(isHost)conns.forEach(c=>{if(c.open)c.send(o)});else if(conn&&conn.open)conn.send(o)}
function onData(m){if(m.t==="id")myId=m.i;else if(m.t==="go"){isAI=false;begin(m.ids)}else if(m.t==="s"){const p=byId(m.i);if(p){p.tx=m.x;p.ty=m.y;p.a=m.a;p.hp=m.hp;p.dash=m.d}}else if(m.t==="b"){bullets.push({x:m.x,y:m.y,vx:m.vx,vy:m.vy,o:m.i,life:1.3,bn:0});beep(300,.08,"sawtooth",.03)}else if(m.t==="k"){const p=byId(m.i);if(p&&p.alive){p.alive=false;boom(p.x,p.y,p.col);checkEnd()}}else if(m.t==="pk"){if(pickups[m.n])pickups[m.n].cd=pickups[m.n].k?14:10}}
function mk(id,k,n){const s=(n===2?[[90,300],[W-90,300]]:[[90,90],[W-90,H-90],[W-90,90],[90,H-90]])[k];return{id,col:COL[k],sx:s[0],sy:s[1],x:s[0],y:s[1],tx:s[0],ty:s[1],hp:100,a:Math.atan2(300-s[1],450-s[0]),vx:0,vy:0,dash:0,dcd:0,cd:0,tri:0,st:0,dir:1,alive:true,ult:30}}

function checkEnd(){if(state!=="play")return;const al=P.filter(p=>p.alive);if(al.length>1)return;const w=al[0];if(w)wins[w.id]++;const top=P.find(p=>wins[p.id]>=WIN);if(top){state="over";const isMe=top===me;if(isMe)addWin();$("wrap").classList.remove("playing");$("touchUI").classList.remove("show");detachTouch();setTimeout(()=>showEnd(isMe?"VICTORY":"DEFEAT",isMe),900);return}state="roundEnd";timer=2;banner=!w?"무승부":w===me?"승리!":isAI?"패배...":"P"+(P.indexOf(w)+1)+" 승"}

function deco(map,x,y,z,w,h,ry){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map}));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m)}
[200,450,700].forEach((x,i)=>i==1?deco(signTex,x,70,1,50,34,0):deco(photoTex,x,58,1,54,72,0));
[200,450,700].forEach(x=>deco(signTex,x,70,H-1,50,34,Math.PI));
[150,450].forEach(z=>{deco(photoTex,1,58,z,54,72,Math.PI/2);deco(photoTex,W-1,58,z,54,72,-Math.PI/2)});
const gun=new THREE.Mesh(new THREE.SphereGeometry(5,10,10),new THREE.MeshBasicMaterial({color:0xff7a00}));gun.position.set(7,-7,-14);cam.add(gun);
const MET=new THREE.Texture(MI);MI.onload=()=>{MET.needsUpdate=true};if(MI.complete)MET.needsUpdate=true;
function glow(c){return gc[c]||(gc[c]=tex((g,w,h)=>{const r=g.createRadialGradient(w/2,h/2,2,w/2,h/2,w/2);r.addColorStop(0,"#ffcf6a");r.addColorStop(.35,c+"aa");r.addColorStop(1,c+"00");g.fillStyle=r;g.fillRect(0,0,w,h)},64,64))}
function ptex(col){return tex((g,w,h)=>{g.fillStyle="#bfe3f7";g.beginPath();g.moveTo(14,176);g.quadraticCurveTo(14,104,64,98);g.quadraticCurveTo(114,104,114,176);g.fill();g.strokeStyle="#7fd13b";g.lineWidth=5;g.stroke();g.fillStyle=col;g.beginPath();g.moveTo(40,104);g.lineTo(64,128);g.lineTo(88,104);g.lineTo(80,100);g.lineTo(64,114);g.lineTo(48,100);g.fill();g.save();g.beginPath();g.arc(64,52,44,0,7);g.clip();g.fillStyle="#fff";g.fillRect(0,0,128,110);if(FACE.complete)g.drawImage(FACE,20,8,88,88);g.restore();g.lineWidth=7;g.strokeStyle=col;g.beginPath();g.arc(64,52,44,0,7);g.stroke()},128,176)}
function emoTex(e){return tex((g,w,h)=>{g.font="48px Arial";g.textAlign="center";g.textBaseline="middle";g.fillText(e,w/2,h/2+3)},64,64)}
function getVis(p){if(vis[p.id])return vis[p.id];const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:ptex(p.col),transparent:true}));spr.scale.set(40,55,1);const bg=new THREE.Sprite(new THREE.SpriteMaterial({color:0x222222,transparent:true}));bg.scale.set(42,6,1);bg.renderOrder=1;const fill=new THREE.Sprite(new THREE.SpriteMaterial({color:p.col,transparent:true}));fill.scale.set(40,4,1);fill.renderOrder=2;scene.add(spr,bg,fill);return vis[p.id]={spr,bg,fill}}
function resetVis(){for(const k in vis){const v=vis[k];scene.remove(v.spr,v.bg,v.fill)}vis={}}
FACE.onload=resetVis;
const vv=new THREE.Vector3();
function proj(x,y,z){vv.set(x,y,z).project(cam);return(vv.z<1&&vv.z>-1)?[(vv.x+1)/2*W,(1-vv.y)/2*H]:null}
function render(){const g=ctx;g.clearRect(0,0,W,H);if(!me||state==="lobby"){cam.fov=78;cam.updateProjectionMatrix();cam.position.set(450+Math.cos(t*.25)*380,100,300+Math.sin(t*.25)*260);cam.lookAt(450,20,300);ren.render(scene,cam);return}
const sx=(Math.random()-.5)*shake*.5,sy=(Math.random()-.5)*shake*.5,bob=Math.hypot(me.vx,me.vy)>10?Math.sin(t*12)*1.3:0;
cam.position.set(me.x+sx,24+sy+bob,me.y);cam.lookAt(me.x+Math.cos(me.a)*100,24,me.y+Math.sin(me.a)*100);cam.fov=78+(me.dash>0?10:0);cam.updateProjectionMatrix();gun.position.z=-14+Math.max(0,me.cd-.2)*22;gun.scale.setScalar(me.ult>=100?1.5+Math.sin(t*14)*.2:1);
for(const p of P){const v=getVis(p),on=p.alive&&p!==me;v.spr.visible=v.bg.visible=v.fill.visible=on;if(!on)continue;v.spr.position.set(p.x,30,p.y);v.bg.position.set(p.x,64,p.y);v.fill.position.set(p.x,64,p.y);v.fill.scale.x=Math.max(.01,40*Math.max(0,p.hp)/100)}
pickups.forEach((p,i)=>{if(!pks[i]){pks[i]=new THREE.Sprite(new THREE.SpriteMaterial({map:emoTex(p.k?"⭐":"💖"),transparent:true}));pks[i].scale.set(30,30,1);scene.add(pks[i])}pks[i].visible=p.cd<=0;pks[i].position.set(p.x,22+Math.sin(t*4+i)*4,p.y)});
bullets.forEach((b,i)=>{const o=byId(b.o),c=o?o.col:"#ffffff";let m=bm[i];if(!m){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:MET,transparent:true})),gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glow(c),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(22,22,1);gl.scale.set(54,54,1);scene.add(s,gl);m=bm[i]={s,gl,c}}if(m.c!==c){m.gl.material.map=glow(c);m.gl.material.needsUpdate=true;m.c=c}m.s.visible=m.gl.visible=true;m.s.material.rotation=t*8+i;m.s.position.set(b.x,22,b.y);m.gl.position.set(b.x,22,b.y)});
for(let i=bullets.length;i<bm.length;i++)bm[i].s.visible=bm[i].gl.visible=false;
ren.render(scene,cam);
if(hitFl>0){g.fillStyle="rgba(255,45,111,"+Math.min(.5,hitFl*1.4)+")";g.fillRect(0,0,W,H)}
for(const p of parts){const s=proj(p.x,p.s?34+(.7-p.l)*45:16,p.y);if(!s)continue;g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;if(p.s){g.font="bold 20px Arial";g.textAlign="center";g.fillText(p.s,s[0],s[1])}else g.fillRect(s[0]-2,s[1]-2,5,5)}g.globalAlpha=1;
if(me.alive){g.strokeStyle="#fff";g.lineWidth=2;g.beginPath();g.moveTo(W/2-10,H/2);g.lineTo(W/2-3,H/2);g.moveTo(W/2+3,H/2);g.lineTo(W/2+10,H/2);g.moveTo(W/2,H/2-10);g.lineTo(W/2,H/2-3);g.moveTo(W/2,H/2+3);g.lineTo(W/2,H/2+10);g.stroke()}
const mx0=W-140,my0=H-100;g.fillStyle="#ffffffaa";g.fillRect(mx0,my0,120,80);g.fillStyle="#7fb8d8";for(const o of OBS)g.fillRect(mx0+o[0]/7.5,my0+o[1]/7.5,o[2]/7.5,o[3]/7.5);for(const p of P){if(!p.alive)continue;g.fillStyle=p.col;g.beginPath();g.arc(mx0+p.x/7.5,my0+p.y/7.5,p===me?4:3,0,7);g.fill()}g.strokeStyle="#3a2a5a";g.lineWidth=2;g.strokeRect(mx0,my0,120,80);
const n=P.length,bw=(W-40-(n-1)*10)/n;P.forEach((p,k)=>{const x=20+k*(bw+10);g.fillStyle="#fff9";g.fillRect(x,12,bw,20);g.fillStyle=p.col;g.fillRect(x,12,bw*Math.max(0,p.hp)/100,20);g.strokeStyle="#3a2a5a";g.lineWidth=2;g.strokeRect(x,12,bw,20);g.font="bold 13px Arial";g.textAlign="left";g.fillStyle="#2a1a4a";g.fillText((p===me?"나":isAI?"AI":"P"+(k+1))+" "+Math.ceil(p.hp),x+6,27);g.textAlign="right";g.fillText("승 "+(wins[p.id]||0),x+bw-6,27)});
g.fillStyle="#222";g.fillRect(20,H-18,120,6);g.fillStyle="#ffd400";g.fillRect(20,H-18,120*(1-Math.max(0,me.dcd)/1.2),6);
g.fillStyle="#222";g.fillRect(20,H-30,120,8);g.fillStyle=me.ult>=100&&Math.sin(t*16)>0?"#fff":"#ff5a00";g.fillRect(20,H-30,120*me.ult/100,8);
g.font="bold 13px Arial";g.textAlign="left";g.fillStyle="#ff5a00";if(me.ult>=100)g.fillText("☄️ 메테오 폭풍 준비! (E)",150,H-22);
if(me.tri>0){g.fillStyle="#ff7a00";g.font="bold 16px Arial";g.textAlign="left";g.fillText("⭐ 트리플샷 "+Math.ceil(me.tri)+"s",150,H-42)}
if(state==="play"&&!me.alive){g.textAlign="center";g.fillStyle="#fff";g.font="bold 16px Arial";g.fillText("관전 중...",W/2,H-14)}
if(banner){g.textAlign="center";g.font="900 64px Arial";g.fillStyle="#ff4d8d";g.strokeStyle="#fff";g.lineWidth=6;g.strokeText(banner,W/2,H/2+20);g.fillText(banner,W/2,H/2+20)}}
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key===" "||e.key.startsWith("Arrow"))e.preventDefault();if(AC&&AC.state==="suspended")AC.resume()});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>

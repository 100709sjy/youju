<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>현욱이게임</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{color-scheme:dark;--c1:#00e5ff;--c2:#ff2d6f;--ok:#2dff9a;--mu:#8b8fb8;--gold:#ffd400;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#050510;color:#e8eaff;font-family:system-ui,Arial,sans-serif}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#1a0a3a,#050510 65%)}
#wrap{position:relative;width:min(100vw,calc(100dvh*1.5));height:min(100dvh,calc(100vw/1.5));max-width:960px;max-height:640px;border-radius:12px;overflow:hidden;border:1px solid #1a1a40;box-shadow:0 0 50px #00e5ff22}
#wrap.playing{touch-action:none}
@media(max-width:700px),(max-height:500px){#wrap{width:100%;height:100%;max-width:none;max-height:none;border-radius:0;border:none}}
#wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important;pointer-events:none!important}
.menu{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,#0a0520f0,#050510f8);padding:16px;padding-top:max(48px,calc(env(safe-area-inset-top)+36px));padding-bottom:max(16px,env(safe-area-inset-bottom));overflow-y:auto}
.hide{display:none!important}
h1{font-size:clamp(26px,7vw,48px);font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#00e5ff,#ff2d6f 55%,#ffd400);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.sub{color:var(--mu);margin:4px 0 12px;font-size:clamp(12px,3.2vw,14px);line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:5px 0;width:min(340px,94%)}
button,select,input{font:inherit;font-size:15px;border-radius:12px;min-height:44px}
button{padding:9px 14px;font-weight:800;border:2px solid var(--c1);background:linear-gradient(180deg,#12123a,#0a0a1e);color:var(--c1);cursor:pointer;flex:1;min-width:80px;touch-action:manipulation}
button.g{border-color:var(--ok);color:var(--ok)}button.r{border-color:var(--c2);color:var(--c2)}button.gray{border-color:#555;color:#999}button.gold{border-color:var(--gold);color:var(--gold)}
button:active{transform:scale(.97);opacity:.85}button:disabled{opacity:.4}
select,input{padding:9px;border:2px solid #2a2a5a;background:#0e0e22;color:#e8eaff;width:100%;text-align:center}
.box{background:#12122acc;padding:16px;border-radius:16px;border:1px solid #2a2a5a;width:min(320px,94%)}
.box>*{margin-top:8px}
#status{min-height:20px;margin-top:6px;color:var(--ok);font-size:13px;font-weight:600}
.msg{color:var(--c2);font-size:13px;min-height:16px}
.keys{color:var(--mu);font-size:11px;margin-top:10px;line-height:1.6}.keys b{color:var(--c1)}
#endT{font-size:clamp(26px,7vw,44px);font-weight:900;margin-bottom:6px;text-shadow:0 0 30px currentColor}
#endSub{color:var(--mu);margin-bottom:12px;font-size:13px}
.ubar{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;z-index:110;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu);pointer-events:none}
.ubar *{pointer-events:auto}.ubar b{color:var(--c1)}.ubar button{flex:none;min-height:30px;padding:4px 8px;font-size:11px;min-width:0}
.coin{color:var(--gold);font-weight:800}
.lb,.shop-list{width:min(340px,94%);max-height:48vh;overflow-y:auto;text-align:left;margin:10px 0}
.lbi,.shop-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#0e0e22;border-radius:10px;margin:5px 0;font-size:13px;border:1px solid #1a1a3a;gap:8px}
.lbi .rk{color:var(--c1);font-weight:900;width:28px}.lbi .wn{color:var(--ok);font-weight:800}
.shop-item button{flex:none;min-width:70px;min-height:36px;font-size:12px;padding:6px 10px}
.shop-item .info{flex:1}.shop-item .price{color:var(--gold);font-weight:700;font-size:12px}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.tag{font-size:10px;padding:3px 7px;border-radius:20px;background:#1a1a3a;color:var(--mu);border:1px solid #2a2a5a}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(340px,94%);margin:6px 0}
.mode-grid button{min-height:52px;font-size:13px;flex:none;max-width:none}
#touchUI{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}#touchUI.show{display:block}
.jb{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:#ffffff14;border:2px solid #00e5ff44;pointer-events:auto}
.js{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#00e5ff88;border:2px solid #00e5ff;pointer-events:none}
.tb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;font-weight:900;color:#fff;font-size:12px}
#bF{right:max(16px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:80px;height:80px;background:#ff2d6f55;border:3px solid #ff2d6f;font-size:14px}
#bD{right:max(16px,env(safe-area-inset-right));bottom:max(118px,calc(env(safe-area-inset-bottom)+110px));width:56px;height:56px;background:#ffd40044;border:2px solid #ffd400;color:#ffd400}
#bU{right:max(100px,calc(env(safe-area-inset-right)+90px));bottom:max(36px,calc(env(safe-area-inset-bottom)+28px));width:58px;height:58px;background:#ff9d0044;border:2px solid #ff9d00;color:#ff9d00}
#bW{right:max(100px,calc(env(safe-area-inset-right)+90px));bottom:max(108px,calc(env(safe-area-inset-bottom)+100px));width:54px;height:54px;background:#00e5ff33;border:2px solid #00e5ff;color:#00e5ff}
#killFeed{position:absolute;top:50px;right:12px;z-index:6;text-align:right;pointer-events:none;font-size:12px;font-weight:700;text-shadow:0 1px 4px #000}
#killFeed div{margin:3px 0;animation:fadeOut 3s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.streak{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:clamp(20px,5vw,34px);font-weight:900;color:#ffd400;text-shadow:0 0 24px #ffd400;z-index:8;pointer-events:none;opacity:0;transition:opacity .15s}
#modeTag{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;font-size:11px;font-weight:800;color:#ffd400;background:#0008;padding:4px 10px;border-radius:20px;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="app"><div id="wrap">
<canvas id="game" width="900" height="600"></canvas>
<div id="modeTag"></div>
<div id="touchUI">
<div class="jb" id="jb"><div class="js" id="js"></div></div>
<div class="tb" id="bD">DASH</div><div class="tb" id="bW">GUN</div><div class="tb" id="bU">ULT</div><div class="tb" id="bF">FIRE</div>
</div>
<div id="killFeed"></div>
<div class="streak" id="streakMsg"></div>
</div></div>

<div class="ubar">
<span id="ulabel">게스트</span>
<span>
<span class="coin" id="coinLabel">🪙 0</span>
<button type="button" class="gray" id="btnShop">상점</button>
<button type="button" class="gray" id="btnLB">랭킹</button>
<button type="button" class="gray" id="logoutBtn" style="display:none">로그아웃</button>
</span>
</div>

<div id="auth" class="menu">
<h1>현욱이게임</h1>
<div class="sub">상점 · 미니게임 · 퀵매치 · 8인 난투</div>
<div class="tags"><span class="tag">🛒 상점</span><span class="tag">🎮 미니게임</span><span class="tag">⚡ 퀵매치</span><span class="tag">☄️ 메테오</span></div>
<div class="box">
<input id="aNick" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="username">
<input id="aPw" type="password" maxlength="20" placeholder="비밀번호" autocomplete="current-password">
<div class="msg" id="aMsg"></div>
<button type="button" class="g" id="btnLogin" style="width:100%">로그인</button>
<button type="button" id="btnSignup" style="width:100%">회원가입</button>
<button type="button" class="gray" id="btnGuest" style="width:100%">게스트로 플레이</button>
</div>
</div>

<div id="lobby" class="menu hide">
<h1>현욱이게임</h1>
<div class="sub">코인으로 스킨·버프 구매 · 미니게임 / 정식전</div>
<div class="row" style="flex-direction:column;gap:4px">
<div style="font-size:12px;color:var(--c1);font-weight:700;text-align:left">모드</div>
<select id="gameModeSel">
<option value="classic">정식전 (3판 2선승)</option>
<option value="ffa">미니 · 자유 난투 (2분 · 킬 순위)</option>
<option value="sudden">미니 · 서든데스 (1킬 승)</option>
<option value="hill">미니 · 킹오브힐 (90초 · 점령)</option>
</select>
</div>
<div class="row" style="flex-direction:column;gap:4px">
<div style="font-size:12px;color:var(--c1);font-weight:700;text-align:left">무기</div>
<select id="wepSel"></select>
</div>
<div class="row"><select id="mapSel"></select></div>
<div class="row"><select id="modeSel">
<option value="2">AI 1:1</option>
<option value="4">AI 4인</option>
<option value="6">AI 6인</option>
<option value="8">AI 8인</option>
</select></div>
<div class="row">
<button type="button" class="g" id="bEasy">쉬움</button>
<button type="button" class="g" id="bNorm">보통</button>
<button type="button" class="r" id="bHard">지옥</button>
</div>
<div class="row"><button type="button" class="gold" id="btnQuick">⚡ 퀵매치</button></div>
<div class="row"><button type="button" id="btnCreate">방 만들기</button></div>
<div class="row"><input id="roomInput" maxlength="5" placeholder="방 코드" style="flex:1"><button type="button" id="btnJoin" style="flex:none;min-width:72px">입장</button></div>
<div class="row"><button type="button" id="startBtn" class="g hide">🚀 시작</button></div>
<div id="status"></div>
<div class="keys"><b>PC</b> WASD · ←→ · Space · Shift 대시 · E 메테오 · R/1~5 무기<br><b>모바일</b> 조이스틱 · FIRE · DASH · ULT · GUN</div>
</div>

<div id="shop" class="menu hide">
<h1>🛒 상점</h1>
<div class="sub">승리·킬로 코인 획득 · 스킨·버프 구매</div>
<div class="coin" id="shopCoins" style="font-size:18px;margin-bottom:6px">🪙 0</div>
<div class="shop-list" id="shopList"></div>
<button type="button" id="btnCloseShop" style="max-width:200px">닫기</button>
</div>

<div id="lboard" class="menu hide">
<h1>🏆 리더보드</h1>
<div class="sub">이 기기 승리 기록</div>
<div class="lb" id="lbList"></div>
<button type="button" id="btnCloseLB" style="max-width:200px">닫기</button>
</div>

<div id="end" class="menu hide">
<div id="endT"></div>
<div id="endSub"></div>
<div class="row" style="flex-direction:column;align-items:center;width:min(260px,90%)">
<button type="button" class="g" id="btnRe">다시하기</button>
<button type="button" id="btnLobby" style="margin-top:8px">로비로</button>
</div>
</div>

const LS={u:"hy_u4",c:"hy_c4",s:"hy_s4",coin:"hy_coin4",inv:"hy_inv4"};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return"h"+Math.abs(h)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let user=null,coins=0,inv={skins:["default"],weps:[0,1],buffs:[],skin:"default"};
function loadEco(){
  coins=+ld(LS.coin,"0")||0;
  inv=Object.assign({skins:["default"],weps:[0,1],buffs:[],skin:"default"},ld(LS.inv,"{}"));
  if(!inv.weps||!inv.weps.length)inv.weps=[0,1];
  if(!inv.skins)inv.skins=["default"];
}
function saveEco(){sv(LS.coin,coins);sv(LS.inv,inv)}
function addCoins(n){coins+=n;saveEco();updateCoinUI()}
function updateCoinUI(){$("coinLabel").textContent="🪙 "+coins;if($("shopCoins"))$("shopCoins").textContent="🪙 "+coins}
function show(id){["auth","lobby","lboard","end","shop"].forEach(x=>$(x).classList.add("hide"));if(id)$(id).classList.remove("hide")}
function ubar(){$("ulabel").innerHTML=user&&!user.guest?"<b>"+esc(user.nick)+"</b>":"게스트";$("logoutBtn").style.display=user&&!user.guest?"inline-block":"none";updateCoinUI()}
function loginAs(n){user={nick:n,guest:false};sv(LS.c,user);$("aMsg").textContent="";loadEco();show("lobby");ubar();refreshWepSel()}
function addWin(){if(!user||user.guest)return;const s=ld(LS.s,"{}");s[user.nick]=(s[user.nick]||0)+1;sv(LS.s,s)}
function showLB(){const list=Object.entries(ld(LS.s,"{}")).sort((a,b)=>b[1]-a[1]);$("lbList").innerHTML=list.length?list.map(([n,w],i)=>`<div class="lbi"><span class="rk">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span><span>${esc(n)}</span><span class="wn">${w}승</span></div>`).join(""):"<div style='text-align:center;color:#888;padding:16px'>기록 없음</div>";show("lboard")}

default:{n:"현욱 (원본)",col:null,price:0},
neon:{n:"네온 시안",col:"#00e5ff",price:80},
rose:{n:"로즈 핑크",col:"#ff4da6",price:80},

};
const SHOP_WEPS=[{id:2,n:"저격총 해금",price:100},{id:3,n:"기관총 해금",price:120},{id:4,n:"바주카 해금",price:180}];
const SHOP_BUFFS=[
{id:"startUlt",n:"시작 궁극기 +40",desc:"라운드 시작 시 궁극 게이지 +40",price:60},
{id:"extraHp",n:"체력 +20",desc:"최대 체력 120",price:100},

function refreshWepSel(){
  const names=["권총 — 기본","샷건 — 근접","저격 — 원거리","기관총 — 연사","바주카 — 폭발"];
  $("wepSel").innerHTML=names.map((n,i)=>{
    const own=inv.weps.includes(i);
    return `<option value="${i}" ${own?"":"disabled"}>${n}${own?"":" 🔒"}</option>`;
  }).join("");
  if(!inv.weps.includes(+$("wepSel").value))$("wepSel").value=String(inv.weps[0]||0);
}
function renderShop(){
  updateCoinUI();
  let html="";
  html+="<div style='color:var(--c1);font-weight:700;margin:6px 0 4px'>스킨</div>";
  for(const[id,sk] of Object.entries(SKINS)){
    const own=inv.skins.includes(id),eq=inv.skin===id;
    html+=`<div class="shop-item"><div class="info"><div>${sk.n}</div><div class="price">${sk.price?("🪙 "+sk.price):"기본"}</div></div>`;
    if(eq)html+=`<button type="button" class="g" disabled>착용중</button>`;
    else if(own)html+=`<button type="button" data-eq="${id}">착용</button>`;
    else html+=`<button type="button" class="gold" data-buy-skin="${id}">구매</button>`;
    html+="</div>";
  }
  html+="<div style='color:var(--c1);font-weight:700;margin:10px 0 4px'>무기 해금</div>";
  for(const w of SHOP_WEPS){
    const own=inv.weps.includes(w.id);
    html+=`<div class="shop-item"><div class="info"><div>${w.n}</div><div class="price">🪙 ${w.price}</div></div>`;
    html+=own?`<button type="button" class="g" disabled>보유</button>`:`<button type="button" class="gold" data-buy-wep="${w.id}">구매</button>`;
    html+="</div>";
  }
  html+="<div style='color:var(--c1);font-weight:700;margin:10px 0 4px'>버프 (보유 시 적용)</div>";
  for(const b of SHOP_BUFFS){
    const own=inv.buffs.includes(b.id);
    html+=`<div class="shop-item"><div class="info"><div>${b.n}</div><div style="font-size:11px;color:var(--mu)">${b.desc}</div><div class="price">🪙 ${b.price}</div></div>`;
    html+=own?`<button type="button" class="g" disabled>보유</button>`:`<button type="button" class="gold" data-buy-buff="${b.id}">구매</button>`;
    html+="</div>";
  }
  $("shopList").innerHTML=html;
  $("shopList").onclick=e=>{
    const t=e.target;if(t.tagName!=="BUTTON")return;
    if(t.dataset.eq){inv.skin=t.dataset.eq;saveEco();renderShop();return}
    if(t.dataset.buySkin){const id=t.dataset.buySkin,sk=SKINS[id];if(coins<sk.price){alert("코인 부족");return}coins-=sk.price;inv.skins.push(id);inv.skin=id;saveEco();renderShop();refreshWepSel();return}
    if(t.dataset.buyWep){const id=+t.dataset.buyWep,item=SHOP_WEPS.find(x=>x.id===id);if(coins<item.price){alert("코인 부족");return}coins-=item.price;if(!inv.weps.includes(id))inv.weps.push(id);saveEco();renderShop();refreshWepSel();return}
    if(t.dataset.buyBuff){const id=t.dataset.buyBuff,item=SHOP_BUFFS.find(x=>x.id===id);if(coins<item.price){alert("코인 부족");return}coins-=item.price;if(!inv.buffs.includes(id))inv.buffs.push(id);saveEco();renderShop();return}
  };
}

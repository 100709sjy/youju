<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youju - Team Deathmatch Mode</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            background: #1a1a1a;
        }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            pointer-events: none;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        .team-score {
            padding: 8px 20px;
            border-radius: 8px;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2);
        }
        #red-hud { color: #ff4757; border-color: #ff4757; }
        #blue-hud { color: #2ed573; border-color: #2ed573; }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 50px;
            border-radius: 15px;
            border: 2px solid #fff;
        }
        #game-over h1 { font-size: 40px; margin-bottom: 10px; }
        #game-over button {
            padding: 10px 25px;
            font-size: 18px;
            cursor: pointer;
            background: #fff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="red-hud" class="team-score">RED TEAM: <span id="red-score">0</span></div>
        <div id="vs-hud">VS (Target: 10)</div>
        <div id="blue-hud" class="team-score">BLUE TEAM: <span id="blue-score">0</span></div>
    </div>

    <div id="game-over">
        <h1 id="winner-text">RED TEAM WINS!</h1>
        <p>경기가 종료되었습니다.</p>
        <button onclick="resetGame()">다시 시작</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 팀 정의
        const TEAMS = {
            RED: { id: 'red', name: 'RED TEAM', color: '#ff4757', score: 0, spawnX: 100, spawnY: canvas.height / 2 },
            BLUE: { id: 'blue', name: 'BLUE TEAM', color: '#2ed573', score: 0, spawnX: canvas.width - 100, spawnY: canvas.height / 2 }
        };

        const TARGET_SCORE = 10;
        let isGameOver = false;

        // 키 입력 상태
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // 마우스 위치
        const mouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', () => {
            if (!isGameOver) shootBullet();
        });

        // 플레이어 객체 (로컬 플레이어 + 봇/팀원 시뮬레이션 포함 N대N 구조)
        class Player {
            constructor(id, name, team, x, y, isLocal = false) {
                this.id = id;
                this.name = name;
                this.team = team;
                this.x = x;
                this.y = y;
                this.radius = 18;
                this.speed = 4;
                this.angle = 0;
                this.hp = 100;
                this.maxHp = 100;
                this.isLocal = isLocal;
                this.lastShot = 0;
            }

            update() {
                if (this.isLocal && !isGameOver) {
                    let dx = 0, dy = 0;
                    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
                    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
                    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
                    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

                    if (dx !== 0 && dy !== 0) {
                        dx *= 0.7071;
                        dy *= 0.7071;
                    }

                    this.x += dx * this.speed;
                    this.y += dy * this.speed;

                    // 화면 경계 제한
                    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                    // 마우스 각도 조절
                    this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // 플레이어 본체 (팀 색상 적용)
                ctx.fillStyle = this.team.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                // 조준 포구
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.radius - 4, -4, 12, 8);

                ctx.restore();

                // 체력바 렌더링
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(this.x - 25, this.y - 32, 50, 6);
                ctx.fillStyle = this.team.color;
                ctx.fillRect(this.x - 25, this.y - 32, 50 * (this.hp / this.maxHp), 6);

                // 이름 및 팀 표시
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(this.name, this.x, this.y - 40);
            }
        }

        // 총알 관리
        let bullets = [];
        class Bullet {
            constructor(x, y, angle, owner) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.speed = 10;
                this.damage = 20;
                this.owner = owner;
                this.team = owner.team;
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.team.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 플레이어 목록 초기화 (2vs2 팀전 구성)
        TEAMS.RED.spawnX = 150;
        TEAMS.RED.spawnY = canvas.height / 2 - 100;
        TEAMS.BLUE.spawnX = canvas.width - 150;
        TEAMS.BLUE.spawnY = canvas.height / 2 + 100;

        let players = [
            new Player('p1', 'Player (Red)', TEAMS.RED, TEAMS.RED.spawnX, TEAMS.RED.spawnY, true),
            new Player('p2', 'Ally Bot', TEAMS.RED, TEAMS.RED.spawnX, TEAMS.RED.spawnY + 150, false),
            new Player('p3', 'Enemy 1', TEAMS.BLUE, TEAMS.BLUE.spawnX, TEAMS.BLUE.spawnY, false),
            new Player('p4', 'Enemy 2', TEAMS.BLUE, TEAMS.BLUE.spawnX, TEAMS.BLUE.spawnY - 150, false)
        ];

        function shootBullet() {
            const localPlayer = players.find(p => p.isLocal);
            if (!localPlayer || localPlayer.hp <= 0) return;

            const now = Date.now();
            if (now - localPlayer.lastShot < 200) return; // 딜레이
            localPlayer.lastShot = now;

            bullets.push(new Bullet(localPlayer.x, localPlayer.y, localPlayer.angle, localPlayer));
        }

        // 봇 단순 AI 행동 (적을 향해 이동 및 사격)
        function updateBots() {
            players.forEach(p => {
                if (!p.isLocal && p.hp > 0) {
                    // 가장 가까운 적 찾기
                    let closestEnemy = null;
                    let minDist = Infinity;
                    players.forEach(target => {
                        if (target.team !== p.team && target.hp > 0) {
                            let dist = Math.hypot(target.x - p.x, target.y - p.y);
                            if (dist < minDist) {
                                minDist = dist;
                                closestEnemy = target;
                            }
                        }
                    });

                    if (closestEnemy) {
                        p.angle = Math.atan2(closestEnemy.y - p.y, closestEnemy.x - p.x);
                        // 거리가 멀면 다가가기
                        if (minDist > 250) {
                            p.x += Math.cos(p.angle) * 2;
                            p.y += Math.sin(p.angle) * 2;
                        }
                        // 랜덤 발사
                        if (Math.random() < 0.03 && bullets.filter(b => b.owner === p).length < 3) {
                            bullets.push(new Bullet(p.x, p.y, p.angle, p));
                        }
                    }
                }
            });
        }

        // 충돌 및 게임 로직 검사
        function checkCollisions() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.update();

                // 맵 밖으로 나가면 제거
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // 플레이어 피격 판정
                let hit = false;
                for (let p of players) {
                    // 아군 피격(Team Kill) 방지 및 본인 총알 면제
                    if (p.team !== b.team && p.hp > 0) {
                        let dist = Math.hypot(b.x - p.x, b.y - p.y);
                        if (dist < p.radius + 5) {
                            p.hp -= b.damage;
                            hit = true;

                            // 사망 처리
                            if (p.hp <= 0) {
                                handleDeath(p, b.owner);
                            }
                            break;
                        }
                    }
                }

                if (hit) {
                    bullets.splice(i, 1);
                }
            }
        }

        function handleDeath(victim, killer) {
            // 킬러 팀 스코어 상승
            killer.team.score += 1;
            updateScoreBoard();

            // 승리 조건 확인
            if (killer.team.score >= TARGET_SCORE) {
                triggerGameOver(killer.team);
            }

            // 3초 후 본진 리스폰
            setTimeout(() => {
                if (!isGameOver) {
                    victim.hp = victim.maxHp;
                    victim.x = victim.team.spawnX + (Math.random() * 40 - 20);
                    victim.y = victim.team.spawnY + (Math.random() * 40 - 20);
                }
            }, 3000);
        }

        function updateScoreBoard() {
            document.getElementById('red-score').innerText = TEAMS.RED.score;
            document.getElementById('blue-score').innerText = TEAMS.BLUE.score;
        }

        function triggerGameOver(winningTeam) {
            isGameOver = true;
            document.getElementById('winner-text').innerText = `${winningTeam.name} WINS!`;
            document.getElementById('winner-text').style.color = winningTeam.color;
            document.getElementById('game-over').style.display = 'block';
        }

        window.resetGame = function() {
            TEAMS.RED.score = 0;
            TEAMS.BLUE.score = 0;
            isGameOver = false;
            document.getElementById('game-over').style.display = 'none';
            updateScoreBoard();

            players.forEach(p => {
                p.hp = p.maxHp;
                p.x = p.team.spawnX;
                p.y = p.team.spawnY;
            });
            bullets = [];
        }

        // 메인 게임 루프
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 중앙선 및 아레나 디자인 렌더링
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            if (!isGameOver) {
                updateBots();
                checkCollisions();
            }

            // 플레이어 업데이트 및 그리기
            players.forEach(p => {
                p.update();
                p.draw();
            });

            // 총알 렌더링
            bullets.forEach((b, index) => {
                b.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>

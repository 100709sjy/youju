<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>현욱이게임</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{color-scheme:dark;--c1:#00e5ff;--c2:#ff2d6f;--ok:#2dff9a;--mu:#8b8fb8;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07070f;color:#e8eaff;font-family:"Segoe UI",Arial,sans-serif}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1a1040,#07070f 70%)}
#wrap{position:relative;width:min(100vw,calc(100dvh*1.5));height:min(100dvh,calc(100vw/1.5));max-width:1000px;max-height:667px;border-radius:10px;overflow:hidden}
#wrap.playing{touch-action:none}
@media(max-width:700px),(max-height:500px){#wrap{width:100%;height:100%;max-width:none;max-height:none;border-radius:0}}
#wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important;pointer-events:none!important}
.menu{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;background:linear-gradient(#07071af0,#0b0b24f5);padding:16px;padding-top:max(48px,calc(env(safe-area-inset-top) + 40px));padding-bottom:max(16px,env(safe-area-inset-bottom));overflow-y:auto;pointer-events:auto}
.hide{display:none!important}
h1{font-size:clamp(26px,7vw,48px);letter-spacing:2px;background:linear-gradient(90deg,#ffb347,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.sub{color:var(--mu);margin:4px 0 12px;font-size:clamp(12px,3.2vw,15px)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:5px 0;width:min(340px,94%)}
button,select,input{font:inherit;font-size:16px;border-radius:12px;min-height:44px;color:inherit;pointer-events:auto}
button{padding:8px 14px;font-weight:700;border:2px solid var(--c1);background:#0a0a1e;color:var(--c1);cursor:pointer;flex:1;min-width:80px;touch-action:manipulation}
button.g{border-color:var(--ok);color:var(--ok)}button.r{border-color:var(--c2);color:var(--c2)}button.gray{border-color:#555;color:#aaa}
button:active{opacity:.7;transform:scale(.98)}
select,input{padding:8px;border:2px solid #2a2a5a;background:#12122a;width:100%;text-align:center}
.box{background:#12122acc;padding:16px;border-radius:16px;border:1px solid #2a2a5a;width:min(340px,94%);position:relative;z-index:210}
.box>*{margin-top:8px}
#status{min-height:22px;margin-top:6px;color:var(--ok);font-size:14px}
.msg{color:var(--c2);font-size:13px;min-height:16px}
.keys{color:var(--mu);font-size:12px;margin-top:10px;line-height:1.6}.keys b{color:#ffb347}
#endT{font-size:clamp(26px,7vw,48px);font-weight:900;margin-bottom:14px}
.ubar{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;z-index:250;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);pointer-events:none}
.ubar *{pointer-events:auto}.ubar b{color:var(--c1)}.ubar button{flex:none;min-height:30px;padding:4px 8px;font-size:12px;min-width:0}
.lb{width:min(340px,94%);max-height:48vh;overflow-y:auto;text-align:left;margin:10px 0}
.lbi{display:flex;justify-content:space-between;padding:8px 12px;background:#0e0e22cc;border-radius:8px;margin:4px 0;font-size:14px}.lbi i{color:var(--c1);font-style:normal;font-weight:700;width:26px}.lbi em{color:var(--ok);font-style:normal;font-weight:700}
#touchUI{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}#touchUI.show{display:block}
.jb{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;background:#ffffff1f;border:2px solid #00e5ff59;pointer-events:auto}
.js{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#00e5ff8c;border:2px solid #00e5ff;pointer-events:none}
.tb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;font-weight:800;color:#fff}
#bF{right:max(18px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:76px;height:76px;background:#ff781480;border:3px solid #ff7a00;font-size:15px}
#bD{right:max(18px,env(safe-area-inset-right));bottom:max(116px,calc(env(safe-area-inset-bottom) + 108px));width:54px;height:54px;background:#ffd40059;border:2px solid #ffd400;color:#ffd400;font-size:12px}
#bU{right:max(104px,calc(env(safe-area-inset-right) + 94px));bottom:max(40px,calc(env(safe-area-inset-bottom) + 30px));width:58px;height:58px;background:#ff2d6f66;border:2px solid #ff2d6f;font-size:12px}
#bW{right:max(104px,calc(env(safe-area-inset-right) + 94px));bottom:max(110px,calc(env(safe-area-inset-bottom) + 100px));width:54px;height:54px;background:#00e5ff40;border:2px solid #00e5ff;font-size:12px}

#globalChat{width:min(340px,94%);margin-top:10px;text-align:left;background:#12122acc;border:1px solid #2a2a5a;border-radius:12px;padding:8px}
.chat-head{font-size:13px;font-weight:bold;color:var(--c1);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.chat-head span{font-size:11px;color:var(--mu);font-weight:normal}
#globalChatLog{height:100px;overflow-y:auto;background:#0e0e22cc;border-radius:8px;padding:6px;font-size:13px;line-height:1.5;word-break:break-all}
#globalChatLog b{color:var(--c1)}
#globalChatLog i{color:var(--mu);font-style:normal}
#globalChatLog .sys{color:#ffb347;font-size:12px}
.crow{display:flex;gap:6px;margin-top:6px}
#globalChatIn{flex:1;min-height:36px;text-align:left;width:auto;font-size:13px;padding:6px 10px}
#globalChatSend{flex:none;min-height:36px;min-width:54px;padding:4px 10px;font-size:13px}
</style>
</head>
<body>
<div id="app"><div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>
  <div id="touchUI">
    <div class="jb" id="jb"><div class="js" id="js"></div></div>
    <div class="tb" id="bD">대시</div><div class="tb" id="bW">무기</div><div class="tb" id="bU">메테오</div><div class="tb" id="bF">발사</div>
  </div>
</div></div>

<div class="ubar" id="ubar">
  <span id="ulabel">게스트</span>
  <span>
    <button type="button" class="gray" id="btnEditNick">닉네임 변경</button>
    <button type="button" class="gray" id="btnLB">글로벌 리더보드</button> 
    <button type="button" class="gray" id="logoutBtn" style="display:none">로그아웃</button>
  </span>
</div>

<div id="auth" class="menu">
  <h1>현욱이게임</h1><div class="sub">복도 위로 운석이 쏟아진다 ☄️ · 글로벌 8인 대난투</div>
  <div class="box">
    <input id="aNick" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="username">
    <input id="aPw" type="password" maxlength="20" placeholder="비밀번호" autocomplete="current-password">
    <div class="msg" id="aMsg"></div>
    <button type="button" class="g" id="btnLogin" style="width:100%">로그인</button>
    <button type="button" id="btnSignup" style="width:100%">회원가입</button>
    <button type="button" class="gray" id="btnGuest" style="width:100%">게스트로 플레이</button>
  </div>
</div>

<div id="lobby" class="menu hide">
  <h1>현욱이게임</h1><div class="sub">1인칭 슈팅 · 맵 4개 · 총기 5종 선택 · 최대 8인 난투</div>
  
  <div class="row" style="flex-direction:column;gap:4px">
    <div style="font-size:12px;color:var(--c1);font-weight:bold;text-align:left">주 무기 선택:</div>
    <select id="startWeaponSel">
      <option value="0">권총 (밸런스형)</option>
      <option value="1">샷건 (근거리 근접 폭딜)</option>
      <option value="2">저격총 (원거리 한방 데미지)</option>
      <option value="3">기관총 (고속 연사 서프레서)</option>
      <option value="4">바주카 (범위 폭발 미사일)</option>
    </select>
  </div>

  <div class="row"><select id="mapSel"></select></div>
  <div class="row">
    <select id="modeSel">
      <option value="2">AI 1:1 (2인)</option>
      <option value="4">AI 4인 난투</option>
      <option value="6">AI 6인 대난투</option>
      <option value="8">AI 8인 풀방 난투</option>
    </select>
  </div>
  <div class="row"><button type="button" class="g" id="bEasy">쉬움</button><button type="button" class="g" id="bNorm">보통</button><button type="button" class="r" id="bHard">지옥</button></div>
  <div class="row"><button type="button" id="btnCreate">방 만들기 (최대 8인)</button></div>
  <div class="row"><input id="roomInput" maxlength="5" placeholder="방 코드" style="flex:1"><button type="button" id="btnJoin" style="flex:none">입장</button></div>
  <div class="row"><button type="button" id="startBtn" class="g hide">게임 시작</button></div>
  <div id="status"></div>
  
  <div id="globalChat">
    <div class="chat-head">🌐 전체 글로벌 채팅 <span id="onlineCount">접속 중...</span></div>
    <div id="globalChatLog"></div>
    <div class="crow">
      <input id="globalChatIn" maxlength="100" placeholder="전체 채팅 입력 (Enter)" autocomplete="off">
      <button type="button" id="globalChatSend">전송</button>
    </div>
  </div>

  <div class="keys"><b>PC</b> WASD 이동 · ←→ 회전 · Space/J 발사 · Shift/L 대시 · E 메테오 · R/1~5 무기 교체<br><b>모바일</b> 조이스틱 · 화면 쓸어 회전 · 버튼</div>
</div>

<div id="lboard" class="menu hide">
  <h1>글로벌 리더보드</h1>
  <div class="sub">전 세계 유저 실시간 랭킹 (네트워크 연동)</div>
  <div class="lb" id="lbList"></div>
  <button type="button" id="btnCloseLB" style="flex:none;width:200px">닫기</button>
</div>

<div id="end" class="menu hide">
  <div id="endT"></div>
  <div class="row"><button type="button" class="g" id="btnRe">다시하기</button><button type="button" id="btnLobby">로비로</button></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$("game");
const ctx=cv.getContext("2d");
let t=0, state="lobby", isAI=true, D=null, myId=0, peer=null, conn=null, conns=[], nextId=1, roomCode="", wins={}, bullets=[], parts=[], pickups=[], keys={}, shake=0, hitFl=0, sendT=0;

/* ---------- 누락됐던 게임 데이터 ---------- */
let W=900,H=600,HW=900,HH=600,OBS=[],curMap=null,curMi=0,P=[],me=null,timer=0,banner="",isHost=false;
const R=14,WIN=3,COL=["#00e5ff","#ff2d6f","#2dff9a","#ffd400","#b967ff","#ff8a1f","#4d8dff","#ff6fd8"];
const WEP=[
 {n:"권총",sp:470,life:1.3,dmg:14,pel:1,spr:.04,cd:.32,c:0xff6fa5,z:1},
 {n:"샷건",sp:430,life:.6,dmg:9,pel:6,spr:.16,cd:.85,c:0xffa030,z:.9},
 {n:"저격총",sp:950,life:1.4,dmg:55,pel:1,spr:0,cd:1.3,c:0x66ccff,z:1.9},
 {n:"기관총",sp:540,life:1,dmg:6,pel:1,spr:.09,cd:.08,c:0xaaff55,z:1.3},
 {n:"바주카",sp:300,life:2.2,dmg:60,pel:1,spr:.02,cd:1.3,exp:110,c:0xff3300,z:1.5}];
const DIFF={easy:{spd:140,lead:.2,dash:0,err:.5,cd:.7},normal:{spd:190,lead:.7,dash:.5,err:.25,cd:.4},hard:{spd:235,lead:1,dash:1,err:.07,cd:.2}};
const BASE_MAPS=[
 {n:"복도",ind:1,sky:"#cfd8e3",fl:["#d9d3c3","#cbc4b0"],wall:"#e8e4d8",ob:"#8fa0b5",lt:1,baseW:900,baseH:600,
  baseObs:[[400,250,100,100,60],[180,110,70,70,60],[650,110,70,70,60],[180,420,70,70,60],[650,420,70,70,60]],
  basePk:[[450,90,0],[450,510,0],[150,300,1],[750,300,2],[300,300,2],[600,300,1]]},
 {n:"공터",sky:"#87ceeb",fl:["#6aa84f","#5e9a45"],wall:"#8a6f4d",ob:"#7d7d7d",lt:1,baseW:900,baseH:600,
  baseObs:[[420,100,60,140,50],[420,360,60,140,50],[220,270,80,60,40],[600,270,80,60,40]],
  basePk:[[450,300,0],[200,100,1],[700,500,2],[200,500,2],[700,100,1]]},
 {n:"야간 시가지",sky:"#10102a",fl:["#2b2b3d","#252536"],wall:"#44446a",ob:"#6a5acd",lt:.6,baseW:900,baseH:600,
  baseObs:[[150,150,100,60,80],[650,150,100,60,80],[150,390,100,60,80],[650,390,100,60,80],[400,270,100,60,80]],
  basePk:[[450,100,0],[450,500,0],[100,300,2],[800,300,2],[300,300,1],[600,300,1]]},
 {n:"용암 협곡",sky:"#3a1208",fl:["#4a2a1a","#3f2416"],wall:"#7a3a1a",ob:"#b0602d",lt:.85,baseW:900,baseH:600,
  baseObs:[[300,80,40,200,60],[560,320,40,200,60],[420,260,60,80,60]],
  basePk:[[150,500,0],[750,100,0],[450,100,1],[450,500,2],[200,200,2],[700,400,1]]}];
$("mapSel").innerHTML=BASE_MAPS.map((m,i)=>`<option value="${i}">${m.n}</option>`).join("");
function byId(id){return P.find(p=>p.id===id)}
let AC=null;
function beep(f,d,ty,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}

/* ---------- 계정 / 리더보드 ---------- */
const LS={u:"hyeonuk_users",c:"hyeonuk_current",s:"hyeonuk_scores",g:"hyeonuk_global_scores"};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const hash=s=>{let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return"h"+Math.abs(h).toString(16)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let user=null;

function show(id){$("ubar").classList.toggle("hide",!id);["auth","lobby","lboard","end"].forEach(x=>$(x).classList.add("hide"));if(id)$(id).classList.remove("hide")}
function ubar(){
  $("ulabel").innerHTML=user?`<b>${esc(user.nick)}</b> 님`:"게스트";
  $("logoutBtn").style.display=user&&!user.guest?"inline-block":"none";
  $("btnEditNick").style.display=user&&!user.guest?"inline-block":"none";
}

function loginAs(n){
  user={nick:n,guest:false};
  sv(LS.c,user);
  $("aMsg").textContent="";
  show("lobby");
  ubar();
  initGlobalChat();
}

const FACE=new Image();
// FACE.src="data:image/jpeg;base64,..."; // 얼굴 사진(base64)을 넣으면 플레이어/벽 포스터에 표시됩니다

/* 동적 맵 스케일 */
function getSpawnPos(k, totalP){
  const margin = 120;
  const angle = (k / totalP) * Math.PI * 2;
  const rx = (W / 2) - margin;
  const ry = (H / 2) - margin;
  return [W/2 + Math.cos(angle)*rx, H/2 + Math.sin(angle)*ry];
}

function updateMapSizeForUsers(userCount){
  const base = BASE_MAPS[curMi];
  const scale = 1 + (userCount - 2) * 0.13;
  W = Math.round(base.baseW * scale);
  H = Math.round(base.baseH * scale);
  OBS = base.baseObs.map(o=>[Math.round(o[0]*scale), Math.round(o[1]*scale), Math.round(o[2]*scale), Math.round(o[3]*scale), o[4]]);
  curMap = { ...base, W, H, obs: OBS, pk: base.basePk.map(p=>[Math.round(p[0]*scale), Math.round(p[1]*scale), p[2]]) };
}

function mk(id,k,n){
  const s=getSpawnPos(k,n);
  const startW = (id===myId) ? +$("startWeaponSel").value : Math.floor(Math.random()*5);
  return{id,col:COL[k % COL.length],sx:s[0],sy:s[1],x:s[0],y:s[1],tx:s[0],ty:s[1],hp:100,sh:0,w:startW,a:0,vx:0,vy:0,dash:0,dcd:0,cd:0,tri:0,st:0,dir:1,alive:true,ult:30,bot:false};
}

function resetRound(){
  const chosenW = +$("startWeaponSel").value;
  P.forEach(p=>{
    p.x=p.tx=p.sx;p.y=p.ty=p.sy;p.hp=100;p.sh=0;p.alive=true;p.tri=0;p.dash=0;p.cd=0;p.ult=30;
    p.w = (p.id===myId) ? chosenW : (p.bot ? Math.floor(Math.random()*5) : p.w);
    p.a=Math.atan2(H/2-p.sy,W/2-p.sx);
  });
  bullets=[];parts=[];pickups=curMap.pk.map(([x,y,k])=>({x,y,k,cd:0}));
}

function begin(ids,mi){
  if(mi!==undefined) curMi = +mi;
  const n=typeof ids==="number"?ids:ids.length;
  updateMapSizeForUsers(n);
  setMap(curMi);
  resetVis();

  P=[];for(let k=0;k<n;k++){const p=mk(typeof ids==="number"?k:ids[k],k,n);p.bot=isAI&&k>0;P.push(p)}
  me=P.find(p=>p.id===myId);wins={};P.forEach(p=>wins[p.id]=0);
  show(null);$("wrap").classList.add("playing");if(isTouch){$("touchUI").classList.add("show");attachTouch()}
  resetRound();state="round";timer=1.6;banner="READY";
}

function rematch(){
  if(isAI){begin(P.length,curMi);return}
  if(isHost){const ids=hostIds();if(ids.length<2)return;send({t:"go",ids,m:curMi});begin(ids,curMi)}
  else{$("endT").textContent="방장 대기 중...";$("endT").style.color="#fff"}
}
function checkEnd(){
  if(state!=="play")return;
  const al=P.filter(p=>p.alive);if(al.length>1)return;
  const w=al[0];if(w)wins[w.id]++;
  const top=P.find(p=>wins[p.id]>=WIN);
  if(top){state="over";const ok=top===me;if(ok)addWin();$("wrap").classList.remove("playing");$("touchUI").classList.remove("show");detachTouch();setTimeout(()=>showEnd(ok?"VICTORY":"DEFEAT",ok),900);return}
  state="roundEnd";timer=2;banner=!w?"무승부":w===me?"승리!":isAI?"패배...":"P"+(P.indexOf(w)+1)+" 승";
}
function showEnd(txt,win){$("endT").textContent=txt+"  "+P.map(p=>wins[p.id]||0).join(" : ");$("endT").style.color=win?"#2dff9a":"#ff2d6f";show("end")}

/* 전투 물리 */
function collide(p){
  p.x=Math.max(R,Math.min(W-R,p.x));p.y=Math.max(R,Math.min(H-R,p.y));
  for(const[ox,oy,ow,oh] of OBS){
    const cx=Math.max(ox,Math.min(p.x,ox+ow)),cy=Math.max(oy,Math.min(p.y,oy+oh)),dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);
    if(d<R){if(d===0){p.y=oy-R;continue}p.x=cx+dx/d*R;p.y=cy+dy/d*R}
  }
}
const inObs=(x,y)=>OBS.some(([a,b,w,h])=>x>a&&x<a+w&&y>b&&y<b+h);
function move(p,mx,my,spd,dt){const l=Math.hypot(mx,my);if(l>0){mx/=l;my/=l}const s=p.dash>0?860:spd;p.vx=mx*s;p.vy=my*s;p.x+=p.vx*dt;p.y+=p.vy*dt;collide(p)}

    const ca=Math.cos(me.a),sa=Math.sin(me.a),mx=ca*fw-sa*sd,my=sa*fw+ca*sd;

    if((keys[" "]||keys.j||tF)&&me.cd<=0){fire(me);me.cd=WEP[me.w].cd}

  }
  if(live&&isAI)for(const p of P)if(p.bot&&p.alive)aiUpdate(p,dt);
  if(!isAI)for(const p of P)if(p!==me){p.x+=(p.tx-p.x)*Math.min(1,dt*18);p.y+=(p.ty-p.y)*Math.min(1,dt*18)}

    }

    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(Math.random()<.7)parts.push({x:b.x,y:b.y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,l:.28,m:.28,c:Math.random()<.5?"#ff8a1f":"#ffd24a"});
    
    if(inObs(b.x,b.y)){
      b.life=0;
      if(b.exp>0) areaExplode(b.x, b.y, b.exp, b.d, b.o);
      else spark(b.x,b.y,"#ffb347");
      continue;
    }
    
    if(b.x<0||b.x>W||b.y<0||b.y>H){
      if(!b.bn){

        if(b.x<0||b.x>W){b.vx*=-1;b.x=b.x<0?0:W}else{b.vy*=-1;b.y=b.y<0?0:H}

        else{if(isAI)hurt(p,b.d);pop(p.x,p.y,"#0a7cff",b.d)}

    }

  let died=false;
  for(const p of P){if(live&&p.alive&&p.hp<=0&&(p===me||isAI)){p.hp=0;p.alive=false;boom(p.x,p.y,p.col);if(p===me)send({t:"k"});died=true}}

}

    if(m.c!==c){m.gl.material.map=glow(c);m.gl.material.needsUpdate=true;m.c=c}
    const z=12+b.d*.5;m.s.scale.set(z,z,1);m.gl.scale.set(z*2.4,z*2.4,1);
    m.s.visible=m.gl.visible=true;m.s.material.rotation=t*8+i;m.s.position.set(b.x,22,b.y);m.gl.position.set(b.x,22,b.y)});
  for(let i=bullets.length;i<bm.length;i++)bm[i].s.visible=bm[i].gl.visible=false;
  ren.render(scene,cam);
  if(hitFl>0){g.fillStyle="rgba(255,45,111,"+Math.min(.5,hitFl*1.4)+")";g.fillRect(0,0,HW,HH)}
  for(const p of parts){const s=proj(p.x,p.s?34+(.7-p.l)*45:16,p.y);if(!s)continue;g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;
    if(p.s){g.font="bold 20px Arial";g.textAlign="center";g.fillText(p.s,s[0],s[1])}else g.fillRect(s[0]-2,s[1]-2,5,5)}
  g.globalAlpha=1;
  if(me.alive){g.strokeStyle="#fff";g.lineWidth=2;g.shadowColor="#000";g.shadowBlur=3;g.beginPath();g.moveTo(HW/2-10,HH/2);g.lineTo(HW/2-3,HH/2);g.moveTo(HW/2+3,HH/2);g.lineTo(HW/2+10,HH/2);g.moveTo(HW/2,HH/2-10);g.lineTo(HW/2,HH/2-3);g.moveTo(HW/2,HH/2+3);g.lineTo(HW/2,HH/2+10);g.stroke();g.shadowBlur=0}
  
  const mw=120,mh=120*H/W,k=mw/W,mx0=HW-mw-20,my0=HH-mh-20;
  g.fillStyle="#ffffffaa";g.fillRect(mx0,my0,mw,mh);g.fillStyle="#7fb8d8";for(const o of OBS)g.fillRect(mx0+o[0]*k,my0+o[1]*k,o[2]*k,o[3]*k);
  for(const p of P){if(!p.alive)continue;g.fillStyle=p.col;g.beginPath();g.arc(mx0+p.x*k,my0+p.y*k,p===me?4:3,0,7);g.fill();
    if(p===me){g.strokeStyle=p.col;g.lineWidth=2;g.beginPath();g.moveTo(mx0+p.x*k,my0+p.y*k);g.lineTo(mx0+p.x*k+Math.cos(p.a)*10,my0+p.y*k+Math.sin(p.a)*10);g.stroke()}}
  g.strokeStyle="#3a2a5a";g.lineWidth=2;g.strokeRect(mx0,my0,mw,mh);
  
  const n=P.length,bw=(HW-40-(n-1)*6)/n;
  P.forEach((p,i)=>{const x=20+i*(bw+6);g.fillStyle="#fff9";g.fillRect(x,12,bw,20);g.fillStyle=p.col;g.fillRect(x,12,bw*Math.max(0,p.hp)/100,20);
    if(p.sh>0){g.fillStyle="#7fe0ff";g.fillRect(x,32,bw*p.sh/60,4)}
    g.strokeStyle="#3a2a5a";g.lineWidth=2;g.strokeRect(x,12,bw,20);g.font="bold "+(n>4?10:13)+"px Arial";g.textAlign="left";g.fillStyle="#2a1a4a";
    g.fillText((p===me?"나":p.bot?"AI"+i:"P"+(i+1)),x+3,26);g.textAlign="right";g.fillText(wins[p.id]||0,x+bw-3,26)});
  
  g.fillStyle="#222";g.fillRect(20,HH-18,120,6);g.fillStyle="#ffd400";g.fillRect(20,HH-18,120*(1-Math.max(0,me.dcd)/1.2),6);
  g.fillStyle="#222";g.fillRect(20,HH-30,120,8);g.fillStyle=me.ult>=100&&Math.sin(t*16)>0?"#fff":"#ff5a00";g.fillRect(20,HH-30,120*me.ult/100,8);
  g.font="bold 14px Arial";g.textAlign="left";g.fillStyle="#fff";g.shadowColor="#000";g.shadowBlur=4;
  g.fillText("무기: "+wp.n+" [숫자1~5/R]",20,HH-44);
  if(me.ult>=100){g.fillStyle="#ff9a2a";g.fillText("☄️ 메테오 폭풍 준비! (E)",160,HH-22)}
  if(me.tri>0){g.fillStyle="#ffd24a";g.fillText("⭐ 트리플샷 "+Math.ceil(me.tri)+"s",160,HH-42)}
  g.shadowBlur=0;
  if(state==="play"&&!me.alive){g.textAlign="center";g.fillStyle="#fff";g.font="bold 16px Arial";g.fillText("관전 중...",HW/2,HH-14)}
  if(banner){g.textAlign="center";g.font="900 64px Arial";g.fillStyle="#ff4d8d";g.strokeStyle="#fff";g.lineWidth=6;g.strokeText(banner,HW/2,HH/2+20);g.fillText(banner,HW/2,HH/2+20)}
}


/* ---------- 방 (PeerJS 대전) ---------- */
const PRE="hyeonuk-fps-";
function setStatus(m){$("status").textContent=m}
function send(m){if(isAI||!peer)return;if(isHost){m.f=myId;for(const c of conns)if(c.open)c.send(m)}else if(conn&&conn.open)conn.send(m)}
function hostIds(){return[0,...conns.filter(c=>c.open).map(c=>c.pid)]}
function closeNet(){const p=peer,c=conn;peer=conn=null;conns=[];isHost=false;try{c&&c.close()}catch(e){}try{p&&p.destroy()}catch(e){}}
function updLobby(){const n=hostIds().length;setStatus("방 코드 "+roomCode+" · 접속 "+n+"/8");$("startBtn").classList.toggle("hide",!(isHost&&n>=2))}
function onNet(m,c){
  if(isHost&&c){m.f=c.pid;for(const o of conns)if(o!==c&&o.open)o.send(m)}
  const p=byId(m.f);
  switch(m.t){
    case"go":if(!isHost){isAI=false;begin(m.ids,m.m)}break;
    case"b":bullets.push({x:m.x,y:m.y,vx:m.vx,vy:m.vy,o:m.f,life:m.l,bn:0,d:m.d,exp:m.exp||0});break;
    case"pk":if(pickups[m.n])pickups[m.n].cd=PCD[pickups[m.n].k];break;
    case"k":if(p&&p.alive){p.hp=0;p.alive=false;boom(p.x,p.y,p.col);checkEnd()}break;
    case"s":if(p&&p!==me){p.tx=m.x;p.ty=m.y;p.a=m.a;p.hp=m.hp;p.dash=m.d;p.sh=m.sh;p.w=m.w}break;
  }
}
function createRoom(tries){
  closeNet();isAI=false;isHost=true;myId=0;nextId=1;
  roomCode=String(Math.floor(10000+Math.random()*90000));setStatus("방 만드는 중...");
  const pr=peer=new Peer(PRE+roomCode);
  pr.on("open",updLobby);
  pr.on("connection",c=>{
    if(state!=="lobby"||hostIds().length>=8){c.on("open",()=>{c.send({t:"full"});setTimeout(()=>c.close(),300)});return}
    c.pid=nextId++;
    c.on("open",()=>{conns.push(c);c.send({t:"id",id:c.pid});updLobby()});
    c.on("data",m=>onNet(m,c));
    c.on("close",()=>{conns=conns.filter(x=>x!==c);if(state==="lobby")updLobby();else{for(const o of conns)if(o.open)o.send({t:"k",f:c.pid});onNet({t:"k",f:c.pid})}});
  });
  pr.on("error",e=>{if(e.type==="unavailable-id"&&(tries||0)<5)createRoom((tries||0)+1);else setStatus("오류: "+e.type)});
}
function joinRoom(){
  const code=$("roomInput").value.trim();if(!code){setStatus("방 코드를 입력하세요");return}
  closeNet();isAI=false;isHost=false;myId=-1;setStatus("접속 중...");
  const pr=peer=new Peer();
  pr.on("open",()=>{
    const c=conn=pr.connect(PRE+code,{reliable:true});
    c.on("open",()=>setStatus("접속 완료! 방장이 시작하기를 기다리는 중..."));
    c.on("data",m=>{if(m.t==="id")myId=m.id;else if(m.t==="full"){closeNet();setStatus("방이 가득 찼거나 이미 시작됐어요")}else onNet(m)});
    c.on("close",()=>{if(conn!==c)return;toLobby();setStatus("방장과 연결이 끊어졌어요")});
  });
  pr.on("error",e=>setStatus(e.type==="peer-unavailable"?"방을 찾을 수 없어요":"오류: "+e.type));
}
function hostStart(){const ids=hostIds();if(ids.length<2)return;const m=+$("mapSel").value;send({t:"go",ids,m});begin(ids,m)}
function toLobby(){
  closeNet();state="lobby";P=[];me=null;bullets=[];parts=[];resetVis();
  $("wrap").classList.remove("playing");$("touchUI").classList.remove("show");detachTouch();
  $("startBtn").classList.add("hide");setStatus("");
  curMi=+$("mapSel").value;updateMapSizeForUsers(2);setMap(curMi);show("lobby");
}
function addWin(){if(!user||user.guest)return;const s=ld(LS.s,"{}");s[user.nick]=(s[user.nick]||0)+1;sv(LS.s,s);sendGlobalScoreSync(user.nick,s[user.nick])}

/* ---------- 글로벌 채팅 / 랭킹 (PeerJS 허브) ---------- */
const GID="hyeonuk-global-hub-v2";
let gpeer=null,gConns=[],isGHost=false,gStarted=false,gscores=ld(LS.g,"{}");
function chatLine(h){const l=$("globalChatLog"),d=document.createElement("div");d.innerHTML=h;l.appendChild(d);while(l.children.length>60)l.removeChild(l.firstChild);l.scrollTop=l.scrollHeight}
const sysLine=t=>chatLine('<span class="sys">'+esc(t)+'</span>');
function gBroadcast(m,except){for(const c of gConns)if(c!==except&&c.open)c.send(m)}
function gOnline(){if(!isGHost)return;const n=1+gConns.filter(c=>c.open).length;$("onlineCount").textContent="접속 "+n+"명";gBroadcast({t:"on",n})}
function gHandle(m,from){
  if(!m||typeof m!=="object")return;
  if(m.t==="chat"){m={t:"chat",n:String(m.n||"").slice(0,12),m:String(m.m||"").slice(0,100)};if(isGHost)gBroadcast(m);chatLine("<b>"+esc(m.n)+"</b> "+esc(m.m))}
  else if(m.t==="gs"){m={t:"gs",n:String(m.n||"").slice(0,12),v:Math.max(0,+m.v||0)};if(!m.n)return;gscores[m.n]=m.v;sv(LS.g,gscores);if(isGHost)gBroadcast(m,from)}
  else if(m.t==="gsall"&&m.s&&typeof m.s==="object"){for(const k in m.s)gscores[String(k).slice(0,12)]=Math.max(gscores[k]||0,+m.s[k]||0);sv(LS.g,gscores)}
  else if(m.t==="on")$("onlineCount").textContent="접속 "+(+m.n||1)+"명";
}
function gSend(m){if(isGHost)gHandle(m,null);else if(gConns[0]&&gConns[0].open)gConns[0].send(m)}
function sendGlobalScoreSync(n,v){gscores[n]=v;sv(LS.g,gscores);gSend({t:"gs",n,v})}
function gSyncSelf(){if(user&&!user.guest){const v=ld(LS.s,"{}")[user.nick];if(v)sendGlobalScoreSync(user.nick,v)}}
function startG(){
  try{gpeer&&gpeer.destroy()}catch(e){}
  gConns=[];isGHost=false;
  const hub=gpeer=new Peer(GID);
  hub.on("open",()=>{isGHost=true;sysLine("채팅 서버 준비 완료");gOnline();gSyncSelf()});
  hub.on("connection",c=>{
    c.on("open",()=>{gConns.push(c);c.send({t:"gsall",s:gscores});gOnline()});
    c.on("data",m=>gHandle(m,c));
    c.on("close",()=>{gConns=gConns.filter(x=>x!==c);gOnline()});
  });
  hub.on("error",e=>{
    if(e.type==="unavailable-id"){
      try{hub.destroy()}catch(_){}
      const cl=gpeer=new Peer();
      cl.on("open",()=>{
        const c=cl.connect(GID,{reliable:true});gConns=[c];
        c.on("open",()=>{sysLine("글로벌 채팅 연결됨");gSyncSelf()});
        c.on("data",m=>gHandle(m,c));
        c.on("close",()=>{gConns=[];$("onlineCount").textContent="재연결 중...";setTimeout(startG,2000+Math.random()*3000)});
      });
      cl.on("error",e2=>{if(e2.type==="peer-unavailable")setTimeout(startG,1500+Math.random()*2500)});
    }else{sysLine("채팅 연결 실패: "+e.type);setTimeout(startG,8000)}
  });
}
function initGlobalChat(){if(gStarted)return;gStarted=true;sysLine("글로벌 서버에 연결 중...");startG()}
function sendChat(){const i=$("globalChatIn"),x=i.value.trim();if(!x)return;i.value="";if(!isGHost&&!(gConns[0]&&gConns[0].open)){sysLine("아직 연결 중이에요");return}gSend({t:"chat",n:user?user.nick:"게스트",m:x})}
$("globalChatSend").onclick=sendChat;
$("globalChatIn").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});
function showLB(){
  const m=Object.assign({},gscores),l=ld(LS.s,"{}");for(const k in l)m[k]=Math.max(m[k]||0,l[k]);
  const a=Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,50);
  $("lbList").innerHTML=a.length?a.map(([n,v],i)=>`<div class="lbi"><i>${i+1}</i><span style="flex:1">${esc(n)}</span><em>${v}승</em></div>`).join(""):'<div class="sub">아직 기록이 없어요</div>';
  show("lboard");
}
$("btnLB").onclick=showLB;
$("btnCloseLB").onclick=()=>show(user?"lobby":"auth");

/* 입력 / 루프 및 DOM 이벤트 바인딩 */
function startAI(d){isAI=true;D=DIFF[d];myId=0;begin(+$("modeSel").value,+$("mapSel").value)}

window.addEventListener("DOMContentLoaded", () => {
  $("bEasy").onclick=()=>startAI("easy");
  $("bNorm").onclick=()=>startAI("normal");
  $("bHard").onclick=()=>startAI("hard");
  $("btnCreate").onclick=createRoom;
  $("btnJoin").onclick=joinRoom;
  $("startBtn").onclick=hostStart;
  $("btnRe").onclick=rematch;
  $("btnLobby").onclick=toLobby;

  $("btnSignup").onclick = () => {
    const n=$("aNick").value.trim(),p=$("aPw").value,m=$("aMsg"),u=ld(LS.u,"{}");
    if(n.length<2||n.length>12){m.textContent="닉네임 2~12자";return}
    if(p.length<2){m.textContent="비밀번호 2자 이상";return}
    if(u[n]){m.textContent="이미 있는 닉네임";return}
    u[n]=hash(p);sv(LS.u,u);const s=ld(LS.s,"{}");s[n]=s[n]||0;sv(LS.s,s);loginAs(n);
  };

  $("btnLogin").onclick = () => {
    const n=$("aNick").value.trim(),u=ld(LS.u,"{}");
    if(!u[n]||u[n]!==hash($("aPw").value)){$("aMsg").textContent="닉네임/비밀번호 틀림";return}
    loginAs(n);
  };

  $("btnGuest").onclick = () => {
    user={nick:"게스트_"+Math.floor(1000+Math.random()*9000),guest:true};
    try{localStorage.removeItem(LS.c)}catch(e){}
    show("lobby");ubar();initGlobalChat();
  };

  $("logoutBtn").onclick = () => {
    user=null;try{localStorage.removeItem(LS.c)}catch(e){}
    show("auth");ubar();
  };

  $("btnEditNick").onclick=()=>{
    if(!user||user.guest) return;
    const newNick = prompt("새로운 닉네임을 입력하세요 (2~12자):", user.nick);
    if(!newNick) return;
    const trimmed = newNick.trim();
    if(trimmed.length < 2 || trimmed.length > 12){
      alert("닉네임은 2~12자여야 합니다.");
      return;
    }
    const users = ld(LS.u, "{}");
    if(users[trimmed] && trimmed !== user.nick){
      alert("이미 존재하는 닉네임입니다.");
      return;
    }
    const oldNick = user.nick;
    const passHash = users[oldNick];
    delete users[oldNick];
    users[trimmed] = passHash;
    sv(LS.u, users);

    const scores = ld(LS.s, "{}");
    scores[trimmed] = scores[oldNick] || 0;
    delete scores[oldNick];
    sv(LS.s, scores);

    user.nick = trimmed;
    sv(LS.c, user);
    ubar();
    alert("닉네임이 변경되었습니다!");
    
    if(isGHost||(gConns[0]&&gConns[0].open)){
      sendGlobalScoreSync(trimmed, scores[trimmed]);
    }
  };

  const c = ld(LS.c, "null");
  if(c && c.nick){
    user = c;
    show("lobby");
    initGlobalChat();
  } else {
    show("auth");
  }
  ubar();
});

[["bF",x=>tF=x],["bD",x=>tD=x],["bU",x=>tU=x]].forEach(([id,f])=>{const el=$(id),h=x=>e=>{f(x);e.preventDefault();e.stopPropagation()};el.addEventListener("touchstart",h(true),{passive:false});el.addEventListener("touchend",h(false),{passive:false});el.addEventListener("touchcancel",h(false),{passive:false})});
$("bW").addEventListener("touchstart",e=>{cycleWeapon();e.preventDefault();e.stopPropagation()},{passive:false});

addEventListener("keydown",e=>{
  if(e.target&&/INPUT|SELECT/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(!keys[k]){
    if(k==="r")cycleWeapon();
    else if(k>="1"&&k<="5")cycleWeapon(+k-1);
  }
  keys[k]=true;if(e.key===" "||e.key.startsWith("Arrow"))e.preventDefault();});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
addEventListener("blur",()=>{keys={}});

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>현욱이게임</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#07070f;--panel:#12122a;--c1:#00e5ff;--c2:#ff2d6f;--ok:#2dff9a;--tx:#e8eaff;--mu:#8b8fb8;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden}
body{background:radial-gradient(circle at 50% 30%,#1a1040,var(--bg) 70%);color:var(--tx);font-family:"Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#wrap{position:relative;width:min(100vw,calc(100dvh*1.5));height:min(100dvh,calc(100vw/1.5));max-width:900px;max-height:600px;box-shadow:0 0 40px #00e5ff33;border-radius:10px;overflow:hidden}
#wrap.playing{touch-action:none}
@media (max-width:700px),(max-height:500px){#wrap{width:100%;height:100%;max-width:none;max-height:none;border-radius:0;box-shadow:none}}
#wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;border-radius:inherit}
#game{pointer-events:none;z-index:2}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#05050cee;border-radius:inherit;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;pointer-events:auto}
.hide{display:none!important}
h1{font-size:clamp(22px,7vw,48px);letter-spacing:2px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px;line-height:1.2}
.sub{color:var(--mu);margin:2px 0 10px;font-size:clamp(11px,3.2vw,14px);line-height:1.4}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0}
button{padding:8px 14px;font-size:clamp(12px,3.5vw,15px);font-weight:700;border:2px solid var(--c1);border-radius:10px;background:#0a0a1e;color:var(--c1);cursor:pointer;min-height:40px}
button.g{border-color:var(--ok);color:var(--ok)}button.r{border-color:var(--c2);color:var(--c2)}button.gray{border-color:#555;color:#aaa}
input{padding:8px 10px;font-size:15px;width:140px;text-align:center;border-radius:10px;border:2px solid #2a2a5a;background:var(--panel);color:var(--tx);min-height:40px}
#status{min-height:20px;margin-top:6px;color:var(--ok);font-size:clamp(11px,3.2vw,14px)}
.keys{color:var(--mu);font-size:clamp(10px,2.8vw,12px);margin-top:8px;line-height:1.5}
.keys b{color:var(--c1)}
#endT{font-size:clamp(24px,7vw,44px);font-weight:900;margin-bottom:10px}
.user-bar{position:absolute;top:max(6px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:20;font-size:12px;color:var(--mu);pointer-events:none}
.user-bar>*{pointer-events:auto}.user-bar b{color:var(--c1)}.user-bar button{padding:4px 8px;font-size:11px;min-height:28px}
.auth-box{background:var(--panel);padding:14px 16px;border-radius:12px;border:1px solid #2a2a5a;margin:6px 0;width:min(280px,92%)}
.auth-box input{width:100%;margin:5px 0;box-sizing:border-box}.auth-box button{width:100%;margin-top:6px}
.lb-list{width:min(300px,94%);max-height:min(260px,45vh);overflow-y:auto;text-align:left;margin:8px 0}
.lb-item{display:flex;justify-content:space-between;padding:7px 10px;background:#0e0e22;border-radius:8px;margin:3px 0;font-size:13px}
.lb-item .rank{color:var(--c1);font-weight:700;width:24px}.lb-item .name{flex:1}.lb-item .wins{color:var(--ok);font-weight:700}
.msg{color:var(--c2);font-size:12px;margin-top:4px;min-height:16px}
#touchUI{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}
#touchUI.show{display:block}
.joy-base{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(0,229,255,.35);pointer-events:auto}
.joy-stick{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(0,229,255,.55);border:2px solid #00e5ff;box-shadow:0 0 12px #00e5ff66;pointer-events:none}
.btn-fire{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;background:rgba(255,45,111,.45);border:3px solid #ff2d6f;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none}
.btn-dash{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(120px,calc(env(safe-area-inset-bottom)+110px));width:56px;height:56px;border-radius:50%;background:rgba(255,212,0,.35);border:2px solid #ffd400;color:#ffd400;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none}
.btn-fire:active,.btn-dash:active{transform:scale(.93);opacity:.85}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="600"></canvas>
  <div id="touchUI">
    <div class="joy-base" id="joyBase"><div class="joy-stick" id="joyStick"></div></div>
    <div class="btn-dash" id="btnDash">대시</div>
    <div class="btn-fire" id="btnFire">발사</div>
  </div>
  <div class="user-bar" id="userBar">
    <span id="userLabel">게스트</span>
    <span>
      <button class="gray" onclick="showLeaderboard()">리더보드</button>
      <button class="gray" id="logoutBtn" onclick="logout()" style="margin-left:3px">로그아웃</button>
    </span>
  </div>
  <div id="auth" class="ov">
    <h1>현욱이게임</h1>
    <div class="sub">계정은 이 기기에만 저장됩니다</div>
    <div class="auth-box">
      <input id="authNick" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="username">
      <input id="authPw" type="password" maxlength="20" placeholder="비밀번호" autocomplete="current-password">
      <div class="msg" id="authMsg"></div>
      <button class="g" onclick="doLogin()">로그인</button>
      <button onclick="doSignup()">회원가입</button>
      <button class="gray" onclick="playAsGuest()">게스트로 플레이</button>
    </div>
  </div>
  <div id="lobby" class="ov hide">
    <h1>현욱이게임</h1>
    <div class="sub">1인칭 3D 슈팅 · AI 연습 또는 최대 4인 대결 · 3승 먼저</div>
    <div class="row">
      <button class="g" onclick="startAI('easy')">AI 쉬움</button>
      <button class="g" onclick="startAI('normal')">AI 보통</button>
      <button class="r" onclick="startAI('hard')">AI 지옥</button>
    </div>
    <div class="row"><button onclick="createRoom()">방 만들기</button></div>
    <div class="row"><input id="roomInput" maxlength="5" placeholder="방 코드"><button onclick="joinRoom()">입장</button></div>
    <div class="row"><button id="startBtn" class="g hide" onclick="hostStart()">게임 시작</button></div>
    <div id="status"></div>
    <div class="keys"><b>모바일</b> 왼쪽 조이스틱 · 오른쪽 발사/대시 · 화면 좌우 쓸기 = 시점<br><b>PC</b> WASD 이동 · ←→ 시점 · Space/J 발사 · Shift/L 대시</div>
  </div>
  <div id="leaderboard" class="ov hide">
    <h1>리더보드</h1>
    <div class="sub">이 기기에 저장된 승리 기록</div>
    <div class="lb-list" id="lbList"></div>
    <div class="row"><button onclick="hideLeaderboard()">닫기</button></div>
  </div>
  <div id="end" class="ov hide">
    <div id="endT"></div>
    <div class="row"><button class="g" onclick="rematch()">다시하기</button><button onclick="toLobby()">로비로</button></div>
  </div>
</div>
<script>
const LS_USERS="hyeonuk_users",LS_CURRENT="hyeonuk_current",LS_SCORES="hyeonuk_scores";
function loadUsers(){try{return JSON.parse(localStorage.getItem(LS_USERS)||"{}")}catch(e){return{}}}
function saveUsers(u){localStorage.setItem(LS_USERS,JSON.stringify(u))}
function loadScores(){try{return JSON.parse(localStorage.getItem(LS_SCORES)||"{}")}catch(e){return{}}}
function saveScores(s){localStorage.setItem(LS_SCORES,JSON.stringify(s))}
function simpleHash(str){let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0}return"h"+Math.abs(h).toString(16)}
let currentUser=null;
function updateUserBar(){const label=$("userLabel"),logoutBtn=$("logoutBtn");if(currentUser){label.innerHTML=currentUser.isGuest?"게스트":"<b>"+currentUser.nick+"</b> 님";logoutBtn.style.display=currentUser.isGuest?"none":"inline-block"}else{label.textContent="게스트";logoutBtn.style.display="none"}}
function doSignup(){const nick=$("authNick").value.trim(),pw=$("authPw").value,msg=$("authMsg");if(nick.length<2||nick.length>12){msg.textContent="닉네임은 2~12자로 해주세요";return}if(pw.length<2){msg.textContent="비밀번호는 2자 이상";return}const users=loadUsers();if(users[nick]){msg.textContent="이미 존재하는 닉네임입니다";return}users[nick]=simpleHash(pw);saveUsers(users);const scores=loadScores();if(!scores[nick])scores[nick]=0;saveScores(scores);currentUser={nick,isGuest:false};localStorage.setItem(LS_CURRENT,JSON.stringify(currentUser));msg.textContent="";enterLobby()}
function doLogin(){const nick=$("authNick").value.trim(),pw=$("authPw").value,msg=$("authMsg");const users=loadUsers();if(!users[nick]||users[nick]!==simpleHash(pw)){msg.textContent="닉네임 또는 비밀번호가 틀렸습니다";return}currentUser={nick,isGuest:false};localStorage.setItem(LS_CURRENT,JSON.stringify(currentUser));msg.textContent="";enterLobby()}
function playAsGuest(){currentUser={nick:"게스트",isGuest:true};localStorage.removeItem(LS_CURRENT);enterLobby()}
function logout(){currentUser=null;localStorage.removeItem(LS_CURRENT);$("auth").classList.remove("hide");$("lobby").classList.add("hide");$("leaderboard").classList.add("hide");$("end").classList.add("hide");updateUserBar();$("authNick").value="";$("authPw").value="";$("authMsg").textContent=""}
function enterLobby(){$("auth").classList.add("hide");$("lobby").classList.remove("hide");$("leaderboard").classList.add("hide");updateUserBar()}
function addWin(){if(!currentUser||currentUser.isGuest)return;const scores=loadScores();scores[currentUser.nick]=(scores[currentUser.nick]||0)+1;saveScores(scores)}
function showLeaderboard(){const scores=loadScores(),list=Object.entries(scores).sort((a,b)=>b[1]-a[1]),box=$("lbList");box.innerHTML=list.length===0?"<div style='text-align:center;color:#888;padding:16px'>아직 기록이 없습니다</div>":list.map(([name,wins],i)=>`<div class="lb-item"><span class="rank">${i+1}</span><span class="name">${name}</span><span class="wins">${wins}승</span></div>`).join("");$("lobby").classList.add("hide");$("auth").classList.add("hide");$("leaderboard").classList.remove("hide")}
function hideLeaderboard(){$("leaderboard").classList.add("hide");if(currentUser)$("lobby").classList.remove("hide");else $("auth").classList.remove("hide")}
(function(){try{const saved=localStorage.getItem(LS_CURRENT);if(saved){currentUser=JSON.parse(saved);enterLobby()}}catch(e){}updateUserBar()})();

const $=id=>document.getElementById(id);
const cv=$("game"),ctx=cv.getContext("2d");
const W=900,H=600,R=16,DMG=12,WIN=3,MAXP=4;
const COL=["#0a7cff","#ff2d6f","#16b85a","#ff9d00"];
const OBS=[[400,230,100,140],[180,100,40,120],[180,380,40,120],[680,100,40,120],[680,380,40,120]];
const DIFF={easy:{spd:130,cd:.75,err:.38,lead:0,dash:0},normal:{spd:180,cd:.42,err:.16,lead:.6,dash:.35},hard:{spd:235,cd:.22,err:.04,lead:1,dash:1}};

let peer=null,conn=null,conns=[],isHost=false,isAI=false,D=DIFF.normal,myId=0,nextId=1,roomCode="";

let AC=null;
function beep(f,d,type,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.value=f;g.gain.value=v||.04;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function say(s){$("status").textContent=s}
function openCount(){return conns.filter(c=>c.open).length}
function lobbyMsg(){say("방 코드: "+roomCode+" · 접속 "+(openCount()+1)+"/"+MAXP+"명");$("startBtn").classList.toggle("hide",openCount()<1)}
function toLobby(){conns.forEach(c=>{try{c.close()}catch(e){}});if(conn){try{conn.close()}catch(e){}}if(peer){try{peer.destroy()}catch(e){}}conn=null;peer=null;conns=[];nextId=1;isHost=false;state="lobby";me=null;$("end").classList.add("hide");$("lobby").classList.remove("hide");$("startBtn").classList.add("hide");$("wrap").classList.remove("playing");$("touchUI").classList.remove("show");say("")}
function startAI(d){isAI=true;D=DIFF[d];myId=0;begin(2)}
function createRoom(){if(typeof Peer==="undefined"){say("PeerJS 로드 실패");return}roomCode=Math.random().toString(36).slice(2,7).toUpperCase();peer=new Peer("hyeonuk-"+roomCode);isHost=true;isAI=false;myId=0;conns=[];nextId=1;say("방 생성 중...");const tm=setTimeout(()=>{if(!peer||!peer.open)say("방 서버 연결 실패")},8000);peer.on("open",()=>{clearTimeout(tm);lobbyMsg()});peer.on("connection",c=>{if(conns.length>=MAXP-1||state!=="lobby"){c.on("open",()=>c.close());return}c.pid=nextId++;conns.push(c);c.on("open",()=>{c.send({t:"id",i:c.pid});lobbyMsg()});c.on("data",m=>{onData(m);conns.forEach(o=>{if(o!==c&&o.open)o.send(m)})});c.on("close",()=>onLeave(c))});peer.on("error",e=>{clearTimeout(tm);if(e.type==="unavailable-id"){toLobby();createRoom();return}say("오류: "+e.type)})}
function joinRoom(){const code=$("roomInput").value.trim().toUpperCase();if(!code){say("방 코드를 입력하세요");return}if(typeof Peer==="undefined"){say("PeerJS 로드 실패");return}peer=new Peer();isHost=false;isAI=false;say("접속 중...");peer.on("open",()=>{conn=peer.connect("hyeonuk-"+code);conn.on("open",()=>say("접속 완료! 방장이 시작하길 기다리는 중..."));conn.on("data",onData);conn.on("close",()=>{if(state==="lobby")say("방장이 나갔습니다");else if(state!=="over"){state="over";showEnd("연결이 끊겼습니다",false)}})});peer.on("error",e=>say("오류: "+e.type))}
function hostIds(){return[0,...conns.filter(c=>c.open).map(c=>c.pid)]}
function hostStart(){const ids=hostIds();if(ids.length<2)return;send({t:"go",ids});begin(ids)}
function onLeave(c){conns=conns.filter(o=>o!==c);if(state==="lobby"){lobbyMsg();return}const p=byId(c.pid);if(p&&p.alive){p.alive=false;send({t:"k",i:c.pid});checkEnd()}}
function send(o){if(o.i===undefined)o.i=myId;if(isHost)conns.forEach(c=>{if(c.open)c.send(o)});else if(conn&&conn.open)conn.send(o)}
function onData(m){if(m.t==="id")myId=m.i;else if(m.t==="go"){isAI=false;begin(m.ids)}else if(m.t==="s"){const p=byId(m.i);if(p){p.tx=m.x;p.ty=m.y;p.a=m.a;p.hp=m.hp;p.dash=m.d}}else if(m.t==="b"){bullets.push({x:m.x,y:m.y,vx:m.vx,vy:m.vy,o:m.i,life:1.3,bn:0});beep(300,.08,"sawtooth",.03)}else if(m.t==="k"){const p=byId(m.i);if(p&&p.alive){p.alive=false;boom(p.x,p.y,p.col);checkEnd()}}else if(m.t==="pk"){if(pickups[m.n])pickups[m.n].cd=pickups[m.n].k?14:10}}
function mk(id,k,n){const s=(n===2?[[90,300],[W-90,300]]:[[90,90],[W-90,H-90],[W-90,90],[90,H-90]])[k];return{id,col:COL[k],sx:s[0],sy:s[1],x:s[0],y:s[1],tx:s[0],ty:s[1],hp:100,a:Math.atan2(300-s[1],450-s[0]),vx:0,vy:0,dash:0,dcd:0,cd:0,tri:0,st:0,dir:1,alive:true}}
function resetRound(){P.forEach(p=>{p.x=p.tx=p.sx;p.y=p.ty=p.sy;p.hp=100;p.alive=true;p.tri=0;p.dash=0;p.cd=0;p.a=Math.atan2(300-p.sy,450-p.sx)});bullets=[];parts=[];pickups=[{x:W/2,y:50,cd:0,k:0},{x:W/2,y:H-50,cd:0,k:0},{x:300,y:300,cd:0,k:1},{x:600,y:300,cd:0,k:1}]}
function begin(ids){resetVis();const n=typeof ids==="number"?ids:ids.length;P=[];for(let k=0;k<n;k++)P.push(mk(typeof ids==="number"?k:ids[k],k,n));me=P.find(p=>p.id===myId);en=P[1];wins={};P.forEach(p=>wins[p.id]=0);$("lobby").classList.add("hide");$("end").classList.add("hide");$("wrap").classList.add("playing");if(isTouch)$("touchUI").classList.add("show");resetRound();state="round";timer=1.6;banner="READY"}
function rematch(){if(isAI){begin(2);return}if(isHost){const ids=hostIds();if(ids.length<2)return;send({t:"go",ids});begin(ids)}else{$("endT").textContent="방장이 시작하길 기다리는 중...";$("endT").style.color="#fff"}}
function checkEnd(){if(state!=="play")return;const al=P.filter(p=>p.alive);if(al.length>1)return;const w=al[0];if(w)wins[w.id]++;const top=P.find(p=>wins[p.id]>=WIN);if(top){state="over";const isMeWin=top===me;if(isMeWin)addWin();$("wrap").classList.remove("playing");$("touchUI").classList.remove("show");setTimeout(()=>showEnd(isMeWin?"VICTORY":"DEFEAT",isMeWin),900);return}state="roundEnd";timer=2;banner=!w?"무승부":w===me?"승리!":isAI?"패배...":"P"+(P.indexOf(w)+1)+" 승리"}
function showEnd(txt,win){$("endT").textContent=txt+"  "+P.map(p=>wins[p.id]||0).join(" : ");$("endT").style.color=win?"#2dff9a":"#ff2d6f";$("end").classList.remove("hide")}
function collide(p){p.x=Math.max(R,Math.min(W-R,p.x));p.y=Math.max(R,Math.min(H-R,p.y));for(const[ox,oy,ow,oh] of OBS){const cx=Math.max(ox,Math.min(p.x,ox+ow)),cy=Math.max(oy,Math.min(p.y,oy+oh));const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);if(d<R){if(d===0){p.y=oy-R;continue}p.x=cx+dx/d*R;p.y=cy+dy/d*R}}}
function inObs(x,y){return OBS.some(([a,b,w,h])=>x>a&&x<a+w&&y>b&&y<b+h)}
function move(p,mx,my,spd,dt){const l=Math.hypot(mx,my);if(l>0){mx/=l;my/=l}const s=p.dash>0?860:spd;p.vx=mx*s;p.vy=my*s;p.x+=p.vx*dt;p.y+=p.vy*dt;collide(p)}
function fire(p){const n=p.tri>0?3:1;for(let i=0;i<n;i++){const a0=p.a;p.a+=(i-(n-1)/2)*.22;fire1(p);p.a=a0}}
function fire1(p){const aa=p.a+(p===me?(Math.random()-.5)*.16:0),c=Math.cos(aa),s=Math.sin(aa),sp=470;const b={x:p.x+c*24,y:p.y+s*24,vx:c*sp,vy:s*sp,o:p.id,life:1.3,bn:0};bullets.push(b);beep(p===me?640:300,.07,"square",.035);if(p===me)send({t:"b",x:b.x,y:b.y,vx:b.vx,vy:b.vy})}
function boom(x,y,col){for(let i=0;i<36;i++){const a=Math.random()*6.283,s=60+Math.random()*320;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,m:1,c:col})}shake=Math.max(shake,12);beep(90,.35,"sawtooth",.07)}
function spark(x,y,col){for(let i=0;i<6;i++){const a=Math.random()*6.283,s=40+Math.random()*160;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.25,m:.25,c:col})}}
function pop(x,y,c){parts.push({x,y,vx:0,vy:0,l:.7,m:.7,c,s:"-"+DMG})}
function aiUpdate(dt){const e=en,dx=me.x-e.x,dy=me.y-e.y,d=Math.hypot(dx,dy);const lead=d/470*D.lead,tx=me.x+me.vx*lead*.5,ty=me.y+me.vy*lead*.5;const ta=Math.atan2(ty-e.y,tx-e.x);let da=ta-e.a;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;e.a+=da*Math.min(1,dt*(6+D.spd/40));e.st-=dt;if(e.st<=0){e.st=.5+Math.random();e.dir=Math.random()<.5?1:-1}const ang=Math.atan2(dy,dx),want=d>340?1:d<210?-1:0;let mx=Math.cos(ang)*want-Math.sin(ang)*e.dir*.9,my=Math.sin(ang)*want+Math.cos(ang)*e.dir*.9,threat=false;for(const b of bullets){if(b.o===e.id)continue;const bx=e.x-b.x,by=e.y-b.y,dist=Math.hypot(bx,by);if(dist<170&&(bx*b.vx+by*b.vy)>0){const sg=(bx*b.vy-by*b.vx)>0?1:-1;mx+=-b.vy/470*sg*2.2;my+=b.vx/470*sg*2.2;threat=true}}if(threat&&e.dcd<=0&&Math.random()<D.dash*dt*6){e.dash=.14;e.dcd=1.4}move(e,mx,my,D.spd,dt);if(e.cd<=0&&d<620&&Math.abs(da)<.35&&hasLOS(e,me)){const o=e.a;e.a+=(Math.random()-.5)*2*D.err;fire(e);e.a=o;e.cd=D.cd*(.8+Math.random()*.5)}}
function hasLOS(a,b){for(let i=1;i<12;i++){if(inObs(a.x+(b.x-a.x)*i/12,a.y+(b.y-a.y)*i/12))return false}return true}

const isTouch=("ontouchstart" in window)||navigator.maxTouchPoints>0;
let joyActive=false,joyId=null,joyX=0,joyY=0;
let lookActive=false,lookId=null,lastLookX=0;
let touchFire=false,touchDash=false;
function setJoyVisual(dx,dy){const stick=$("joyStick"),max=28;const len=Math.hypot(dx,dy)||1;const cx=Math.max(-max,Math.min(max,dx/len*Math.min(len,max)));const cy=Math.max(-max,Math.min(max,dy/len*Math.min(len,max)));stick.style.transform=`translate(${cx}px,${cy}px)`}
function resetJoy(){joyActive=false;joyId=null;joyX=0;joyY=0;$("joyStick").style.transform="translate(0,0)"}
function onTouchStart(e){
  if(state!=="play"&&state!=="round"&&state!=="roundEnd")return;
  for(const t of e.changedTouches){
    const el=document.elementFromPoint(t.clientX,t.clientY);
    if(el&&(el.id==="btnFire"||el.closest?.("#btnFire"))){touchFire=true;continue}
    if(el&&(el.id==="btnDash"||el.closest?.("#btnDash"))){touchDash=true;continue}
    const joy=$("joyBase").getBoundingClientRect();
    if(t.clientX>=joy.left-20&&t.clientX<=joy.right+20&&t.clientY>=joy.top-20&&t.clientY<=joy.bottom+20){
      joyActive=true;joyId=t.identifier;
      const cx=joy.left+joy.width/2,cy=joy.top+joy.height/2;
      const dx=t.clientX-cx,dy=t.clientY-cy,maxR=joy.width/2;
      joyX=Math.max(-1,Math.min(1,dx/maxR));joyY=Math.max(-1,Math.min(1,dy/maxR));
      setJoyVisual(dx,dy);continue;
    }
    if(!lookActive){lookActive=true;lookId=t.identifier;lastLookX=t.clientX}
  }

}
